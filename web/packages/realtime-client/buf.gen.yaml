# TypeScript of the realtime protocol and its imports, generated on every build (ADR-037).
version: v2
inputs:
  - directory: ../../../contracts
    paths: [../../../contracts/proto/psim/realtime/v1]
plugins:
  - local: [node, scripts/client-codegen.mjs]
    out: src/gen
    include_imports: true
    opt: [target=ts, import_extension=none]
clean: true
