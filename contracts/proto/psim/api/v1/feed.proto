syntax = "proto3";

package psim.api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "psim/api/v1/response.proto";
import "psim/catalog/v1/catalog.proto";
import "psim/catalog/v1/maintenance.proto";
import "psim/common/v1/types.proto";
import "psim/incident/v1/incident.proto";

// FeedService serves console read models. Owner: Projection Service. Scenarios S6, S11.
service FeedService {
  // GetOperationalSnapshot returns feed and plan data at a historical server capture time.
  rpc GetOperationalSnapshot(GetOperationalSnapshotRequest) returns (GetOperationalSnapshotResponse) {
    option (google.api.http) = {get: "/v1/feed/snapshot"};
  }
  // GetIncidentFeed returns active incidents of the caller scope and the resume token
  // at which the snapshot is consistent (ADR-019).
  rpc GetIncidentFeed(GetIncidentFeedRequest) returns (GetIncidentFeedResponse) {
    option (google.api.http) = {get: "/v1/feed/incidents"};
  }
  // GetLocationStatus returns the state of devices and zones of a location for the object view.
  rpc GetLocationStatus(GetLocationStatusRequest) returns (GetLocationStatusResponse) {
    option (google.api.http) = {get: "/v1/feed/locations/{location_id}/status"};
  }
  // GetOperatorLoad returns the current load of operators (supervisor).
  rpc GetOperatorLoad(GetOperatorLoadRequest) returns (GetOperatorLoadResponse) {
    option (google.api.http) = {get: "/v1/feed/operators"};
  }
}

// GetIncidentFeedRequest is the request of GetIncidentFeed.
message GetIncidentFeedRequest {
  repeated string site_ids = 1;
  repeated string zone_ids = 2;
}

// GetIncidentFeedResponse is the response of GetIncidentFeed.
// Not paginated: the console needs the whole feed (up to 10 000 incidents).
message GetIncidentFeedResponse {
  repeated psim.incident.v1.Incident incidents = 1;
  // Token for the realtime Subscribe frame.
  string resume_token = 2;
  google.protobuf.Timestamp snapshot_at = 3;
}

// GetLocationStatusRequest is the request of GetLocationStatus.
message GetLocationStatusRequest {
  string location_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetLocationStatusResponse is the response of GetLocationStatus.
message GetLocationStatusResponse {
  repeated ZoneStatus zones = 1;
  repeated DeviceStatus devices = 2;
  string resume_token = 3;
  google.protobuf.Timestamp snapshot_at = 4;
  repeated ConnectorRuntimeStatus connectors = 5;
  repeated psim.catalog.v1.MaintenanceWindow maintenance_windows = 6;
  repeated SiteDuty site_duties = 7;
}

// ZoneStatus is the aggregated state of a zone.
message ZoneStatus {
  string zone_id = 1;
  // Highest class among active device states.
  psim.common.v1.EventClass state = 2;
  bool armed = 3;
  uint32 open_incidents = 4;
  DataQuality quality = 5;
  google.protobuf.Timestamp confirmed_at = 6;
  psim.catalog.v1.ResourceState resource_state = 7;
}

// DeviceStatus is the current state of a device derived from alarm, fault, restore and state events.
message DeviceStatus {
  string device_id = 1;
  psim.common.v1.EventClass state = 2;
  // Last state-changing taxonomy type.
  string last_type = 3;
  google.protobuf.Timestamp last_changed_at = 4;
  bool online = 5;
  DataQuality quality = 6;
  google.protobuf.Timestamp confirmed_at = 7;
  psim.catalog.v1.ResourceState resource_state = 8;
  string connector_id = 9;
  // Equipment availability remains unknown when only events have been observed.
  string connection = 10;
  repeated SourceRuntimeStatus sources = 11;
}

// DataQuality separates observed equipment freshness from resource lifecycle.
enum DataQuality {
  DATA_QUALITY_UNSPECIFIED = 0;
  DATA_QUALITY_ACTUAL = 1;
  DATA_QUALITY_STALE = 2;
  DATA_QUALITY_UNKNOWN = 3;
}

// ConnectorRuntimeStatus describes a connection without asserting equipment state.
message ConnectorRuntimeStatus {
  string connector_id = 1;
  string connection = 2;
  DataQuality quality = 3;
  google.protobuf.Timestamp confirmed_at = 4;
  string session_id = 5;
  psim.catalog.v1.ResourceState resource_state = 6;
}

// GetOperatorLoadRequest is the request of GetOperatorLoad.
message GetOperatorLoadRequest {
  repeated string site_ids = 1;
}

// GetOperatorLoadResponse is the response of GetOperatorLoad.
message GetOperatorLoadResponse {
  repeated OperatorLoad operators = 1;
  string resume_token = 2;
  google.protobuf.Timestamp snapshot_at = 3;
}

// OperatorLoad is the current load of one operator.
message OperatorLoad {
  string user_id = 1;
  string display_name = 2;
  uint32 assigned_open = 3;
  uint32 escalated = 4;
  repeated string duty_site_ids = 5;
  repeated string fallback_site_ids = 6;
}

// SourceRuntimeStatus keeps event state, reported values and equipment availability independent.
message SourceRuntimeStatus {
  string source_id = 1;
  psim.common.v1.EventClass state = 2;
  DataQuality state_quality = 3;
  google.protobuf.Timestamp state_confirmed_at = 4;
  map<string, string> values = 5;
  DataQuality values_quality = 6;
  google.protobuf.Timestamp values_confirmed_at = 7;
  string availability = 8;
  google.protobuf.Timestamp availability_confirmed_at = 9;
  DataQuality availability_quality = 10;
}

// GetOperationalSnapshotRequest selects a historical view without realtime subscription.
message GetOperationalSnapshotRequest {
  google.protobuf.Timestamp at = 1;
  string location_id = 2;
  repeated string site_ids = 3;
}

// GetOperationalSnapshotResponse is read-only and never confirms current connectivity.
message GetOperationalSnapshotResponse {
  GetIncidentFeedResponse feed = 1;
  GetLocationStatusResponse location = 2;
  repeated psim.catalog.v1.Location catalog_locations = 3;
  repeated psim.catalog.v1.Device catalog_devices = 4;
  bool historical = 5;
  google.protobuf.Timestamp available_from = 6;
}
