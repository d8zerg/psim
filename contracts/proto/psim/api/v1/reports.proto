syntax = "proto3";

package psim.api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "psim/common/v1/types.proto";

// ReportService builds incident reports (ADR-028: analytics in ClickHouse).
// Owner: Projection Service. Scenario S13.
service ReportService {
  // GetIncidentReport returns incident metrics for a period.
  rpc GetIncidentReport(GetIncidentReportRequest) returns (GetIncidentReportResponse) {
    option (google.api.http) = {get: "/v1/reports/incidents"};
  }
  // ExportIncidentReport exports the same report as CSV.
  rpc ExportIncidentReport(ExportIncidentReportRequest) returns (ExportIncidentReportResponse) {
    option (google.api.http) = {
      get: "/v1/reports/incidents:export"
      response_body: "file"
    };
  }
}

// ReportFilter bounds each metric by its observation time, using [from, to).
// Creation, acknowledgement and resolution metrics use their respective timestamps.
// SLA observations use the earlier of completion and deadline; pending ones are excluded.
message ReportFilter {
  google.protobuf.Timestamp from = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp to = 2 [(buf.validate.field).required = true];
  repeated string site_ids = 3;
  repeated string incident_type_ids = 4;
  repeated psim.common.v1.Priority priorities = 5;
}

// ReportGrouping is the grouping dimension of report rows.
enum ReportGrouping {
  REPORT_GROUPING_UNSPECIFIED = 0;
  REPORT_GROUPING_NONE = 1;
  REPORT_GROUPING_SITE = 2;
  REPORT_GROUPING_INCIDENT_TYPE = 3;
  REPORT_GROUPING_PRIORITY = 4;
  REPORT_GROUPING_OPERATOR = 5;
  REPORT_GROUPING_DAY = 6;
}

// IncidentMetrics are incident counts, response times and SLA compliance for a group.
message IncidentMetrics {
  // Group key: site id, incident type id, priority, user id or date; empty for totals.
  string group = 1;
  // Created during the period.
  uint64 incidents_created = 2;
  // Resolved during the period, including incidents created earlier.
  uint64 incidents_resolved = 3;
  google.protobuf.Duration mtta = 4;
  google.protobuf.Duration mttr = 5;
  // Share of resolution = false_alarm among resolved, 0..1.
  double false_alarm_rate = 6;
  // Share of incidents acknowledged within SLA, 0..1.
  double ack_sla_compliance = 7;
  // Share of incidents resolved within SLA, 0..1.
  double resolve_sla_compliance = 8;
  // Created during the period and currently carrying a nonzero escalation level.
  uint64 escalated = 9;
  // Completed or overdue observations with a pinned target; pending observations are excluded.
  uint64 ack_sla_evaluated = 10;
  uint64 resolve_sla_evaluated = 11;
}

// GetIncidentReportRequest is the request of GetIncidentReport.
message GetIncidentReportRequest {
  ReportFilter filter = 1 [(buf.validate.field).required = true];
  ReportGrouping grouping = 2;
}

// GetIncidentReportResponse is the response of GetIncidentReport.
message GetIncidentReportResponse {
  IncidentMetrics totals = 1;
  repeated IncidentMetrics rows = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// ExportIncidentReportRequest is the request of ExportIncidentReport.
message ExportIncidentReportRequest {
  ReportFilter filter = 1 [(buf.validate.field).required = true];
  ReportGrouping grouping = 2;
}

// ExportIncidentReportResponse is the response of ExportIncidentReport; the body is CSV.
message ExportIncidentReportResponse {
  google.api.HttpBody file = 1;
}
