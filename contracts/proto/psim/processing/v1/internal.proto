syntax = "proto3";

package psim.processing.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "psim/common/v1/envelope.proto";
import "psim/processing/v1/event.proto";
import "psim/processing/v1/rules.proto";

// NormalizerStateRecord is the value of internal compacted topic psim.normalizer.state.v1
// (key: tenant_id/source_id:epoch). Not a public contract.
message NormalizerStateRecord {
  psim.common.v1.Envelope envelope = 1 [(buf.validate.field).required = true];
  oneof payload {
    option (buf.validate.oneof).required = true;
    SourceSequenceState source_state = 2;
  }
}

// SourceSequenceState is the deduplication tracker of one source epoch.
message SourceSequenceState {
  string source_id = 1;
  uint32 source_epoch = 2;
  uint64 max_sequence = 3;
  // Bitmap of the last 4096 sequence numbers below max_sequence; bit i set = max_sequence - i seen.
  bytes window = 4;
  google.protobuf.Timestamp last_confirmed_at = 5;
}

// CorrelationChangelogRecord is the value of internal compacted topic
// psim.correlation.changelog.v1 (key: rule_id:correlation_key). Not a public contract.
message CorrelationChangelogRecord {
  psim.common.v1.Envelope envelope = 1 [(buf.validate.field).required = true];
  oneof payload {
    option (buf.validate.oneof).required = true;
    CorrelationStateEntry state = 2;
  }
}

// CorrelationStateEntry is the opaque state of one rule for one correlation key.
message CorrelationStateEntry {
  string rule_id = 1;
  uint32 rule_version = 2;
  string correlation_key = 3;
  // Engine-defined encoding, versioned by state_format.
  bytes state = 4;
  uint32 state_format = 5;
}

// RepartitionRecord is the value of internal topic psim.correlation.repartition.v1
// (key: correlation_key). Not a public contract.
message RepartitionRecord {
  psim.common.v1.Envelope envelope = 1 [(buf.validate.field).required = true];
  oneof payload {
    option (buf.validate.oneof).required = true;
    RepartitionedEvent repartitioned_event = 2;
  }
}

// RepartitionedEvent carries one immutable rule and its selected event.
message RepartitionedEvent {
  string rule_id = 1;
  uint32 rule_version = 2;
  string correlation_key = 3;
  Event event = 4;
  // Immutable compiled input; a configuration change cannot reinterpret queued events.
  CorrelationRule rule = 5;
  uint64 rule_set_version = 6;
  // Inventory observations initialize periodic absence without fabricating an event.
  bool inventory = 7;
}

// LiveKeyState is the versioned local and changelog encoding of a correlation key.
message LiveKeyState {
  repeated LiveCandidate candidates = 1;
  repeated LivePending pending = 2;
  EventRecord subject = 3;
  int64 next_deadline_ms = 4;
  optional int64 last_signal_ms = 5;
  bool seen = 6;
  repeated EventRecord buffered = 7;
  int64 watermark_ms = 8;
  repeated LiveSource sources = 9;
  CorrelationRule rule = 10;
  uint64 rule_set_version = 11;
  int64 last_activity_ms = 12;
}

// LiveCandidate retains the evidence and matched parts of an open window.
message LiveCandidate {
  EventRecord event = 1;
  uint32 mask = 2;
}

// LivePending retains an absence trigger until its event-time deadline.
message LivePending {
  EventRecord trigger = 1;
  int64 deadline_ms = 2;
}

// LiveSource tracks event time and the bounded sequence cursor of a source epoch.
message LiveSource {
  string source_id = 1;
  int64 maximum_ms = 2;
  // Processing arrival time used only for idle detection.
  int64 received_ms = 3;
  SourceSequenceState sequence = 4;
}
