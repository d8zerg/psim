syntax = "proto3";

package psim.connector.v1;

import "google/protobuf/timestamp.proto";
import "psim/catalog/v1/catalog.proto";

// ConnectorAdministrationService manages registrations over mTLS and delegated operator JWTs.
service ConnectorAdministrationService {
  // Manage commits a versioned change and waits until live gateways enforce it.
  rpc Manage(ManageRequest) returns (ManageResponse);
}

// RegistrationAction selects a credential or registration change.
enum RegistrationAction {
  REGISTRATION_ACTION_UNSPECIFIED = 0;
  REGISTRATION_ACTION_REGISTER = 1;
  REGISTRATION_ACTION_ROTATE = 2;
  REGISTRATION_ACTION_REVOKE = 3;
  REGISTRATION_ACTION_RECOVER = 4;
  REGISTRATION_ACTION_DISABLE = 5;
  REGISTRATION_ACTION_INSPECT = 6;
}

// ManageRequest is idempotent per tenant, operator and request_id.
message ManageRequest {
  string request_id = 1;
  RegistrationAction action = 2;
  // Only registration uses name, connector_type and limits; credentials are derived from PEM.
  psim.catalog.v1.Connector connector = 3;
  uint64 expected_version = 4;
  // Public certificate only; the private key never leaves the connector.
  string certificate_pem = 5;
  // Required for revocation, ignored for other actions.
  string fingerprint = 6;
  // Optional shortened validity of previous certificates during rotation.
  google.protobuf.Timestamp previous_not_after = 7;
  // Operator explanation, included in audit when supplied.
  string reason = 8;
  // Optional assertion binding the public certificate to an expected fingerprint.
  string expected_fingerprint = 9;
}

// ManageResponse returns the committed registration and global enforcement revision.
// A deadline error can mean that the change committed but enforcement is still pending;
// retry the exact request with its original request_id to resolve that outcome.
message ManageResponse {
  psim.catalog.v1.Connector connector = 1;
  uint64 revision = 2;
}
