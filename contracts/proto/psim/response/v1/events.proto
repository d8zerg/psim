syntax = "proto3";

package psim.response.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "psim/common/v1/envelope.proto";
import "psim/response/v1/command.proto";
import "psim/response/v1/notification.proto";
import "psim/response/v1/plan.proto";
import "psim/response/v1/run.proto";

// ResponseEventRecord is the value of topic psim.response.events.v1
// (key: incident_id; command_id or notification_id when there is no incident).
// Events carry the aggregate state after the change; envelope.sequence = aggregate version.
message ResponseEventRecord {
  psim.common.v1.Envelope envelope = 1 [(buf.validate.field).required = true];
  oneof payload {
    option (buf.validate.oneof).required = true;
    RunUpdated run_updated = 2;
    CommandUpdated command_updated = 3;
    NotificationUpdated notification_updated = 4;
    SlaBreached sla_breached = 5;
    EscalationLevelTriggered escalation_level_triggered = 6;
    CommandRequested command_requested = 7;
    NotificationRequested notification_requested = 8;
    PlanUnavailable plan_unavailable = 9;
    SlaPolicyPinned sla_policy_pinned = 10;
  }
}

// PlanUnavailable reports that no published plan matched a newly created incident.
message PlanUnavailable {
  string incident_id = 1;
}

// CommandRequested crosses the durable response -> command boundary. Only Response Engine
// produces these requests; command criticality and device authorization remain server-owned.
message CommandRequested {
  // requested_by preserves the verified user for manual steps and the service for automatic steps.
  Command command = 1;
  string site_id = 2;
  string zone_id = 3;
}

// NotificationRequested records intent; channel delivery belongs to Notification Service.
message NotificationRequested {
  string request_id = 1;
  string incident_id = 2;
  string run_id = 3;
  string step_id = 4;
  NotifyParams params = 5;
  string site_id = 6;
  string zone_id = 7;
}

// RunUpdated reports a change of a response run.
message RunUpdated {
  RunChange change = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Step affected by the change, if any.
  string step_id = 2;
  ResponseRun run = 3;
}

// RunChange maps to domain events ResponseRunStarted, StepActivated, StepCompleted, StepSkipped,
// StepFailed, MandatoryStepsChanged, ResponseRunCompleted, ResponseRunCancelled.
enum RunChange {
  RUN_CHANGE_UNSPECIFIED = 0;
  RUN_CHANGE_RUN_STARTED = 1;
  RUN_CHANGE_STEP_ACTIVATED = 2;
  RUN_CHANGE_STEP_COMPLETED = 3;
  RUN_CHANGE_STEP_SKIPPED = 4;
  RUN_CHANGE_STEP_FAILED = 5;
  RUN_CHANGE_MANDATORY_STEPS_CHANGED = 6;
  RUN_CHANGE_RUN_COMPLETED = 7;
  RUN_CHANGE_RUN_CANCELLED = 8;
}

// CommandUpdated reports a change of a command; the change equals the new state.
message CommandUpdated {
  Command command = 1;
}

// NotificationUpdated reports a change of a notification; the change equals the new state.
message NotificationUpdated {
  Notification notification = 1;
}

// SlaBreached reports that an incident missed its SLA.
message SlaBreached {
  string incident_id = 1;
  // "ack" or "resolve".
  string sla_kind = 2;
  string policy_id = 3;
}

// EscalationLevelTriggered reports that an escalation level fired for an incident.
message EscalationLevelTriggered {
  string incident_id = 1;
  uint32 level = 2;
  string policy_id = 3;
  repeated string notification_ids = 4;
  // The independent SLA dimension that triggered the level.
  string sla_kind = 5;
}

// SlaPolicyPinned preserves the original SLA targets for analytical projections.
// Published atomically with the first tracked incident, independent of later policy edits.
message SlaPolicyPinned {
  string incident_id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Duration acknowledge_within = 3;
  google.protobuf.Duration resolve_within = 4;
}
