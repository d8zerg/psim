# Error code catalog - single source of truth for REST (Problem.code), connector protocol
# (google.rpc.ErrorInfo.reason, EventRejection.code), DLQ headers (psim-dlq-error-code),
# command results (Command.result_code) and realtime frames (ErrorFrame.code).
# Format: <DOMAIN>_<ESSENCE>. Codes are never renamed or reused.
#
# Fields: http - REST status (null if not used in REST); grpc - gRPC status;
# retryable - the client may retry the same request; used_in - where the code appears;
# used_in values: rest, connector, dlq, command_result, notification, realtime.
# title - English, returned in Problem.title; ru - description for documentation.

version: 1
domains: [COMMON, AUTH, CATALOG, INGEST, PROCESSING, INCIDENT, RESPONSE, COMMAND, NOTIFICATION, REALTIME]
codes:
  # --- COMMON ---------------------------------------------------------------
  - code: COMMON_INVALID_ARGUMENT
    http: 400
    grpc: INVALID_ARGUMENT
    retryable: false
    used_in: [rest, connector]
    title: Invalid argument
    ru: Запрос не прошёл валидацию; подробности в errors[]
  - code: COMMON_NOT_FOUND
    http: 404
    grpc: NOT_FOUND
    retryable: false
    used_in: [rest]
    title: Resource not found
    ru: Ресурс не найден или недоступен в области доступа
  - code: COMMON_CONCURRENT_MODIFICATION
    http: 412
    grpc: ABORTED
    retryable: false
    used_in: [rest]
    title: Resource was modified
    ru: Версия в If-Match не совпадает с текущей версией ресурса
  - code: COMMON_PRECONDITION_REQUIRED
    http: 428
    grpc: FAILED_PRECONDITION
    retryable: false
    used_in: [rest]
    title: If-Match header required
    ru: Изменение версионированного ресурса без заголовка If-Match
  - code: COMMON_IDEMPOTENCY_KEY_REUSED
    http: 422
    grpc: ALREADY_EXISTS
    retryable: false
    used_in: [rest]
    title: Idempotency key reused with a different request
    ru: Ключ идемпотентности уже использован для другого запроса
  - code: COMMON_RATE_LIMITED
    http: 429
    grpc: RESOURCE_EXHAUSTED
    retryable: true
    used_in: [rest]
    title: Too many requests
    ru: Превышен лимит частоты запросов
  - code: COMMON_INTERNAL
    http: 500
    grpc: INTERNAL
    retryable: true
    used_in: [rest, connector, dlq, realtime]
    title: Internal error
    ru: Непредвиденная ошибка; подробности в журнале по trace_id
  - code: COMMON_UNAVAILABLE
    http: 503
    grpc: UNAVAILABLE
    retryable: true
    used_in: [rest, connector, realtime]
    title: Service unavailable
    ru: Сервис или его зависимость временно недоступны
  - code: COMMON_DEADLINE_EXCEEDED
    http: 504
    grpc: DEADLINE_EXCEEDED
    retryable: true
    used_in: [rest]
    title: Deadline exceeded
    ru: Запрос не выполнен за отведённое время

