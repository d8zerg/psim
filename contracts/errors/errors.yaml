    en: The access token has expired; obtain a new token
    ru: Срок действия токена истёк; нужен новый токен
  - code: AUTH_FORBIDDEN
    http: 403
    grpc: PERMISSION_DENIED
    retryable: false
    used_in: [rest, realtime]
    title: Action not allowed for the role
    en: The user role does not permit the action (RBAC)
    ru: Роль пользователя не разрешает действие (RBAC)
  - code: AUTH_SCOPE_DENIED
    http: 403
    grpc: PERMISSION_DENIED
    retryable: false
    used_in: [rest, realtime]
    title: Object outside the access scope
    en: The object is outside the user's access scope (ABAC)
    ru: Объект вне области доступа пользователя (ABAC)

