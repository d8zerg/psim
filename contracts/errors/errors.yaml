    retryable: false
    used_in: [rest, realtime]
    title: Action not allowed for the role
    ru: Роль пользователя не разрешает действие (RBAC)
  - code: AUTH_SCOPE_DENIED
    http: 403
    grpc: PERMISSION_DENIED
    retryable: false
    used_in: [rest, realtime]
    title: Object outside the access scope
    ru: Объект вне области доступа пользователя (ABAC)

