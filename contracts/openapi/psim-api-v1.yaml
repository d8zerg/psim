          type: array
          items:
            $ref: '#/components/schemas/psim.catalog.v1.SourceTemplate'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/psim.catalog.v1.Capability'
        state:
          enum:
          - RESOURCE_STATE_UNSPECIFIED
          - RESOURCE_STATE_ACTIVE
          - RESOURCE_STATE_DISABLED
          - RESOURCE_STATE_ARCHIVED
          type: string
          format: enum
        version:
          type: string
      description: DeviceType describes a class of devices, its sources and capabilities (aggregates.md, 1.2).
    psim.catalog.v1.FloorPlan:
      type: object
      properties:
        imageRef:
          type: string
          description: Reference to the stored image, served by GET /v1/locations/{id}/floor-plan.
        contentType:
          type: string
        width:
          type: number
          format: double
        height:
          type: number
          format: double
      description: FloorPlan is an image of a floor with a coordinate system for device positions.
    psim.catalog.v1.Location:
      type: object
      properties:
        locationId:
          type: string
        kind:
          enum:
          - LOCATION_KIND_UNSPECIFIED
          - LOCATION_KIND_SITE
          - LOCATION_KIND_BUILDING
          - LOCATION_KIND_FLOOR
          - LOCATION_KIND_ZONE
          type: string
          format: enum
        parentId:
          type: string
          description: Empty only for sites.
        siteId:
          type: string
        name:
          type: string
        code:
          type: string
          description: Unique among siblings.
        timezone:
          type: string
          description: IANA time zone, sites only.
        floorPlan:
          allOf:
          - $ref: '#/components/schemas/psim.catalog.v1.FloorPlan'
          description: Floors only.
        state:
          enum:
          - RESOURCE_STATE_UNSPECIFIED
          - RESOURCE_STATE_ACTIVE
          - RESOURCE_STATE_DISABLED
          - RESOURCE_STATE_ARCHIVED
          type: string
          format: enum
        version:
          type: string
        updatedAt:
          type: string
          format: date-time
      description: Location is a site, building, floor or zone (aggregates.md, 1.1).
    psim.catalog.v1.ParameterSpec:
      type: object
      properties:
        name:
          type: string
        type:
          enum:
          - PARAMETER_TYPE_UNSPECIFIED
          - PARAMETER_TYPE_STRING
          - PARAMETER_TYPE_INTEGER
          - PARAMETER_TYPE_NUMBER
          - PARAMETER_TYPE_BOOLEAN
          - PARAMETER_TYPE_DURATION
          type: string
          format: enum
        required:
          type: boolean
        allowedValues:
          type: array
          items:
            type: string
      description: ParameterSpec describes one command parameter.
    psim.catalog.v1.Source:
      type: object
      properties:
        sourceId:
          type: string
          description: 'Deterministic: UUIDv5(connector_id, external_ref), see ADR-029.'
        externalRef:
          type: string
          description: Reference used by the connector, unique per connector (D2).
        kind:
          type: string
        name:
          type: string
      description: Source is an event channel of a device.
    psim.catalog.v1.SourceTemplate:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
      description: SourceTemplate describes a source every device of the type has.
    psim.common.v1.Actor:
      type: object
      properties:
        kind:
          enum:
          - ACTOR_KIND_UNSPECIFIED
          - ACTOR_KIND_USER
          - ACTOR_KIND_SERVICE
          - ACTOR_KIND_CONNECTOR
          - ACTOR_KIND_SYSTEM
          type: string
          format: enum
        id:
          type: string
          description: User id, service name, connector id or "system".
        displayName:
          type: string
      description: Actor identifies the subject that performed an action.
    psim.common.v1.Position:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
      description: Position is a point on a floor plan in plan units.
    psim.config.v1.ProcessingSettings:
      type: object
      properties:
        significanceThreshold:
          enum:
          - SEVERITY_UNSPECIFIED
          - SEVERITY_INFO
          - SEVERITY_LOW
          - SEVERITY_MEDIUM
          - SEVERITY_HIGH
          - SEVERITY_CRITICAL
          type: string
          description: Events at or above this severity are significant (E3).
          format: enum
        maxClockSkew:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        maxBufferReplayAge:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        sourceIdleTimeout:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        version:
          type: string
      description: ProcessingSettings are tenant-wide processing parameters.
    psim.config.v1.RetentionSettings:
      type: object
      properties:
        eventHistoryAll:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        eventHistorySignificant:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        incidents:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        audit:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        version:
          type: string
      description: RetentionSettings are data retention periods of a tenant.
    psim.incident.v1.Incident:
      type: object
      properties:
        incidentId:
          type: string
        incidentTypeId:
          type: string
        siteId:
          type: string
        zoneId:
          type: string
        state:
          enum:
          - INCIDENT_STATE_UNSPECIFIED
          - INCIDENT_STATE_NEW
          - INCIDENT_STATE_ACKNOWLEDGED
          - INCIDENT_STATE_IN_PROGRESS
          - INCIDENT_STATE_RESOLVED
          - INCIDENT_STATE_CLOSED
          type: string
          format: enum
        priority:
          enum:
          - PRIORITY_UNSPECIFIED
          - PRIORITY_P1
          - PRIORITY_P2
          - PRIORITY_P3
          - PRIORITY_P4
          type: string
          format: enum
        prioritySource:
          enum:
          - PRIORITY_SOURCE_UNSPECIFIED
          - PRIORITY_SOURCE_COMPUTED
          - PRIORITY_SOURCE_MANUAL
          type: string
          format: enum
        groupingKey:
          type: string
        groupUntil:
          type: string
          format: date-time
        signalIds:
          type: array
          items:
            type: string
        title:
          type: string
        assigneeId:
          type: string
          description: User id of the responsible operator.
        escalationLevel:
          type: integer
          description: 0 means not escalated.
          format: uint32
        blockingSteps:
          type: array
          items:
            $ref: '#/components/schemas/psim.incident.v1.StepRef'
          description: Unfinished mandatory steps of the active response run (I7).
        responseRunVersion:
          type: string
          description: Version of the response run applied to blocking_steps.
        resolution:
          enum:
          - RESOLUTION_UNSPECIFIED
          - RESOLUTION_CONFIRMED
          - RESOLUTION_FALSE_ALARM
          - RESOLUTION_TEST
          - RESOLUTION_DUPLICATE
          type: string
          format: enum
        resolutionNote:
          type: string
        relatedIncidentId:
          type: string
          description: Previous incident with the same grouping key, if any (I4).
        createdAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        version:
          type: string
          description: Aggregate version, used as ETag.
      description: Incident is the central aggregate (aggregates.md, 4.2; state-models.md, 1; ADR-027).
    psim.incident.v1.IncidentType:
      type: object
      properties:
        incidentTypeId:
          type: string
        code:
          type: string
        name:
          type: string
        defaultPriority:
          enum:
          - PRIORITY_UNSPECIFIED
          - PRIORITY_P1
          - PRIORITY_P2
          - PRIORITY_P3
          - PRIORITY_P4
          type: string
          format: enum
        groupingWindow:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        escalationPolicyId:
          type: string
        responseRequired:
          type: boolean
          description: When set, an incident without a matching response plan is flagged.
        autoCloseAfter:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: Delay between resolved and automatic close.
        version:
          type: string
      description: IncidentType is a class of situations that defines response plan and SLA (aggregates.md, 4.1).
    psim.incident.v1.Link:
      type: object
      properties:
        linkId:
          type: string
        url:
          type: string
        title:
          type: string
      description: Link is an external reference attached to an incident (video clip, document).
    psim.incident.v1.StepRef:
      type: object
      properties:
        runId:
          type: string
        stepId:
          type: string
        title:
          type: string
      description: StepRef points to a step of a response run.
    psim.incident.v1.TimelineEntry:
      type: object
      properties:
        entryId:
          type: string
        incidentId:
          type: string
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/psim.common.v1.Actor'
        kind:
          enum:
          - TIMELINE_ENTRY_KIND_UNSPECIFIED
          - TIMELINE_ENTRY_KIND_STATE_CHANGED
          - TIMELINE_ENTRY_KIND_SIGNAL_ATTACHED
          - TIMELINE_ENTRY_KIND_PRIORITY_CHANGED
          - TIMELINE_ENTRY_KIND_ASSIGNED
          - TIMELINE_ENTRY_KIND_ESCALATED
          - TIMELINE_ENTRY_KIND_COMMENT
          - TIMELINE_ENTRY_KIND_LINK
          - TIMELINE_ENTRY_KIND_STEP
          - TIMELINE_ENTRY_KIND_COMMAND
          - TIMELINE_ENTRY_KIND_NOTIFICATION
          type: string
          format: enum
        text:
          type: string
        refId:
          type: string
          description: 'Id of the related object: signal, step, command, notification, link.'
        details:
          type: object
          additionalProperties:
            type: string
      description: TimelineEntry is one record of an incident timeline.
    psim.processing.v1.AbsenceSpec:
      type: object
      properties:
        trigger:
          $ref: '#/components/schemas/psim.processing.v1.EventFilter'
        expected:
          $ref: '#/components/schemas/psim.processing.v1.EventFilter'
      description: "AbsenceSpec fires when an expected event does not follow a trigger within the window.\n Without a trigger\
        \ it fires when no expected event occurs within each window (heartbeat)."
    psim.processing.v1.ConjunctionSpec:
      type: object
      properties:
        parts:
          type: array
          items:
            $ref: '#/components/schemas/psim.processing.v1.EventFilter'
      description: ConjunctionSpec fires when every part matched within the window, in any order.
    psim.processing.v1.CorrelationRule:
      type: object
      properties:
        ruleId:
          type: string
        version:
          type: integer
          format: uint32
        name:
          type: string
        description:
          type: string
        state:
          enum:
          - RULE_STATE_UNSPECIFIED
          - RULE_STATE_DRAFT
          - RULE_STATE_TESTING
          - RULE_STATE_ACTIVE
          - RULE_STATE_ARCHIVED
          type: string
          format: enum
        filter:
          allOf:
          - $ref: '#/components/schemas/psim.processing.v1.EventFilter'
          description: Events considered by the rule at all.
        correlationScope:
          enum:
          - CORRELATION_SCOPE_UNSPECIFIED
          - CORRELATION_SCOPE_SOURCE
          - CORRELATION_SCOPE_DEVICE
          - CORRELATION_SCOPE_ZONE
          - CORRELATION_SCOPE_FLOOR
          - CORRELATION_SCOPE_BUILDING
          - CORRELATION_SCOPE_SITE
          type: string
          format: enum
        window:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        allowedLateness:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        suppression:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: Suppress repeated signals for the same correlation key for this interval.
        single:
          $ref: '#/components/schemas/psim.processing.v1.SingleSpec'
        conjunction:
          $ref: '#/components/schemas/psim.processing.v1.ConjunctionSpec'
        sequence:
          $ref: '#/components/schemas/psim.processing.v1.SequenceSpec'
        threshold:
          $ref: '#/components/schemas/psim.processing.v1.ThresholdSpec'
        absence:
          $ref: '#/components/schemas/psim.processing.v1.AbsenceSpec'
        output:
          $ref: '#/components/schemas/psim.processing.v1.RuleOutput'
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/psim.common.v1.Actor'
      description: CorrelationRule is one immutable version of a correlation rule (aggregates.md, 3.3; ADR-011).
    psim.processing.v1.Event:
      type: object
      properties:
        type:
          type: string
          description: Taxonomy type code, for example "intrusion.zone.alarm".
        taxonomyVersion:
          type: string
          description: Taxonomy version used for normalization, for example "1".
        eventClass:
          enum:
          - EVENT_CLASS_UNSPECIFIED
          - EVENT_CLASS_ALARM
          - EVENT_CLASS_WARNING
          - EVENT_CLASS_FAULT
          - EVENT_CLASS_RESTORE
          - EVENT_CLASS_STATE
          - EVENT_CLASS_INFO
          type: string
          format: enum
        severity:
          enum:
          - SEVERITY_UNSPECIFIED
          - SEVERITY_INFO
          - SEVERITY_LOW
          - SEVERITY_MEDIUM
          - SEVERITY_HIGH
          - SEVERITY_CRITICAL
          type: string
          format: enum
        siteId:
          type: string
        zoneId:
          type: string
        deviceId:
          type: string
        sourceId:
          type: string
        connectorId:
          type: string
        sourceEpoch:
          type: integer
          format: uint32
        rawCode:
          type: string
          description: Vendor event code, always preserved.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Standard attributes (event-taxonomy.md, section 6) and connector attributes prefixed with "x.".
        significant:
          type: boolean
          description: Significant events are stored long-term in Event History (ADR-028).
        clockSkewCorrected:
          type: boolean
          description: Event time was corrected because of source clock skew (ADR-010).
      description: "Event is a normalized event. envelope.message_id equals the raw event_id,\n envelope.sequence equals the\
        \ source sequence number."
    psim.processing.v1.EventFilter:
      type: object
      properties:
        types:
          type: array
          items:
            type: string
          description: Taxonomy codes or prefixes ending with ".*", for example "intrusion.*".
        minSeverity:
          enum:
          - SEVERITY_UNSPECIFIED
          - SEVERITY_INFO
          - SEVERITY_LOW
          - SEVERITY_MEDIUM
          - SEVERITY_HIGH
          - SEVERITY_CRITICAL
          type: string
          format: enum
        siteIds:
          type: array
          items:
            type: string
        zoneIds:
          type: array
          items:
            type: string
        condition:
          type: string
          description: Optional CEL expression over the variable "event".
      description: EventFilter selects events by taxonomy type, severity, location and a CEL condition.
    psim.processing.v1.MappingRule:
      type: object
      properties:
        rawCode:
          type: string
          description: Exact vendor code or prefix ending with "*".
        condition:
          type: string
          description: Optional CEL condition over the variable "raw".
        type:
          type: string
          description: Target taxonomy type code.
        severity:
          enum:
          - SEVERITY_UNSPECIFIED
          - SEVERITY_INFO
          - SEVERITY_LOW
          - SEVERITY_MEDIUM
          - SEVERITY_HIGH
          - SEVERITY_CRITICAL
          type: string
          description: Overrides the default severity of the type when set.
          format: enum
        attributeMap:
          type: object
          additionalProperties:
            type: string
          description: 'Attribute renames: raw attribute name -> normalized attribute name.'
      description: MappingRule maps a raw event to a taxonomy type.
    psim.processing.v1.MappingRuleSet:
      type: object
      properties:
        mappingRuleSetId:
          type: string
        version:
          type: integer
          format: uint32
        connectorType:
          type: string
        taxonomyVersion:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/psim.processing.v1.MappingRule'
          description: Ordered; the first matching rule wins.
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          $ref: '#/components/schemas/psim.common.v1.Actor'
      description: "MappingRuleSet is a published version of mapping rules for one connector type\n (aggregates.md, 3.1).\
        \ Published in psim.config.v1 under key \"mapping/<tenant_id>/<connector_type>\"."
    psim.processing.v1.RuleOutput:
      type: object
      properties:
        incidentTypeId:
          type: string
        priority:
          enum:
          - PRIORITY_UNSPECIFIED
          - PRIORITY_P1
          - PRIORITY_P2
          - PRIORITY_P3
          - PRIORITY_P4
          type: string
          description: Fixed priority, used when priority_expression is empty.
          format: enum
        priorityExpression:
          type: string
          description: Optional CEL expression returning 1..4.
        groupingScope:
          enum:
          - CORRELATION_SCOPE_UNSPECIFIED
          - CORRELATION_SCOPE_SOURCE
          - CORRELATION_SCOPE_DEVICE
          - CORRELATION_SCOPE_ZONE
          - CORRELATION_SCOPE_FLOOR
          - CORRELATION_SCOPE_BUILDING
          - CORRELATION_SCOPE_SITE
          type: string
          description: Scope of the grouping key; defaults to the correlation scope.
          format: enum
        summaryTemplate:
          type: string
          description: Summary template, may reference event and rule fields.
      description: RuleOutput describes the signal produced by a rule.
    psim.processing.v1.RuleSet:
      type: object
      properties:
        ruleSetId:
          type: string
        version:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/psim.processing.v1.CorrelationRule'
        activatedAt:
          type: string
          format: date-time
        activatedBy:
          $ref: '#/components/schemas/psim.common.v1.Actor'
      description: "RuleSet is the set of rule versions active for a tenant (aggregates.md, 3.4).\n Published in psim.config.v1\
        \ under key \"ruleset/<tenant_id>\"."
    psim.processing.v1.SequenceSpec:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/psim.processing.v1.EventFilter'
      description: SequenceSpec fires when the steps matched within the window in the given order.
    psim.processing.v1.Signal:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/psim.processing.v1.SignalOrigin'
        correlationKey:
          type: string
        groupingKey:
          type: string
          description: Key used by Incident Service to attach the signal to an open incident.
        incidentTypeId:
          type: string
        priority:
          enum:
          - PRIORITY_UNSPECIFIED
          - PRIORITY_P1
          - PRIORITY_P2
          - PRIORITY_P3
          - PRIORITY_P4
          type: string
          format: enum
        siteId:
          type: string
        zoneId:
          type: string
          description: Empty for signals of rules wider than a zone.
        eventIds:
          type: array
          items:
            type: string
        firstEventAt:
          type: string
          format: date-time
        lastEventAt:
          type: string
          format: date-time
        summary:
          type: string
        explanationRef:
          type: string
          description: Optional reference to an explanation produced by an external module.
      description: "Signal is the result of a correlation rule firing or of an external producer (ADR-025).\n envelope.message_id\
        \ is the deterministic signal_id (ADR-005)."
    psim.processing.v1.SignalOrigin:
      type: object
      properties:
        kind:
          enum:
          - SIGNAL_ORIGIN_KIND_UNSPECIFIED
          - SIGNAL_ORIGIN_KIND_RULE
          - SIGNAL_ORIGIN_KIND_EXTERNAL
          type: string
          format: enum
        ruleId:
          type: string
          description: Correlation rule id for SIGNAL_ORIGIN_KIND_RULE.
        ruleVersion:
          type: integer
          format: uint32
        producer:
          type: string
          description: Registered external producer name for SIGNAL_ORIGIN_KIND_EXTERNAL.
      description: SignalOrigin identifies what produced a signal.
    psim.processing.v1.SingleSpec:
      type: object
      properties: {}
      description: SingleSpec fires on every matching event.
    psim.processing.v1.ThresholdSpec:
      type: object
      properties:
        count:
          type: integer
          format: uint32
        distinctBy:
          type: string
          description: Count distinct values of this field ("device_id", "source_id" or an attribute) instead of events.
      description: ThresholdSpec fires when at least count matching events occur within the window.
    psim.response.v1.AutomatedParams:
      type: object
      properties:
        webhookUrl:
          type: string
        timeout:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
      description: AutomatedParams calls an external handler (ADR-025).
    psim.response.v1.ChecklistItem:
      type: object
      properties:
        itemId:
          type: string
        text:
          type: string
        required:
          type: boolean
      description: ChecklistItem is one checklist entry.
    psim.response.v1.ChecklistParams:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.ChecklistItem'
      description: ChecklistParams is a list of items to check.
    psim.response.v1.Command:
      type: object
      properties:
        commandId:
          type: string
        deviceId:
          type: string
        connectorId:
          type: string
        capability:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        incidentId:
          type: string
        runId:
          type: string
        stepId:
          type: string
        critical:
          type: boolean
        state:
          enum:
          - COMMAND_STATE_UNSPECIFIED
          - COMMAND_STATE_REQUESTED
          - COMMAND_STATE_AWAITING_APPROVAL
          - COMMAND_STATE_SENT
          - COMMAND_STATE_ACKNOWLEDGED
          - COMMAND_STATE_EXECUTED
          - COMMAND_STATE_FAILED
          - COMMAND_STATE_REJECTED
          - COMMAND_STATE_TIMED_OUT
          - COMMAND_STATE_CANCELLED
          type: string
          format: enum
        requestedBy:
          $ref: '#/components/schemas/psim.common.v1.Actor'
        approvedBy:
          $ref: '#/components/schemas/psim.common.v1.Actor'
        requestedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        resultCode:
          type: string
          description: Error code from the catalog for failed, rejected, timed out or cancelled commands.
        resultMessage:
          type: string
        version:
          type: string
      description: Command is a request to act on a device (aggregates.md, 5.3; state-models.md, 3).
    psim.response.v1.CommandParams:
      type: object
      properties:
        capability:
          type: string
        deviceId:
          type: string
        targetExpression:
          type: string
          description: Target expression, for example "zone.devices(type == 'access.door')".
        parameters:
          type: object
          additionalProperties:
            type: string
        automatic:
          type: boolean
          description: Execute without operator confirmation.
      description: CommandParams sends a command to devices (P3).
    psim.response.v1.DecisionOption:
      type: object
      properties:
        optionId:
          type: string
        label:
          type: string
        nextStepId:
          type: string
        suggestedResolution:
          type: string
          description: Resolution suggested when this option leads to the end of the plan, for example false alarm.
      description: DecisionOption is one branch of a decision.
    psim.response.v1.DecisionParams:
      type: object
      properties:
        question:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.DecisionOption'
      description: DecisionParams branches the plan by the operator choice (P2).
    psim.response.v1.EscalateParams:
      type: object
      properties:
        level:
          type: integer
          format: uint32
      description: EscalateParams escalates the incident to the given level.
    psim.response.v1.EscalationLevel:
      type: object
      properties:
        level:
          type: integer
          format: uint32
        delay:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: Delay after the SLA breach.
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.Recipient'
        channels:
          type: array
          items:
            enum:
            - NOTIFICATION_CHANNEL_UNSPECIFIED
            - NOTIFICATION_CHANNEL_IN_APP
            - NOTIFICATION_CHANNEL_EMAIL
            - NOTIFICATION_CHANNEL_WEBHOOK
            type: string
            format: enum
      description: EscalationLevel is one level of escalation.
    psim.response.v1.EscalationPolicy:
      type: object
      properties:
        policyId:
          type: string
        name:
          type: string
        sla:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.SlaTarget'
        levels:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.EscalationLevel'
          description: Strictly increasing delays (EP1).
        version:
          type: string
      description: EscalationPolicy defines SLA and escalation levels (aggregates.md, 5.4).
    psim.response.v1.InstructionParams:
      type: object
      properties:
        text:
          type: string
      description: InstructionParams shows text the operator must read and confirm.
    psim.response.v1.Notification:
      type: object
      properties:
        notificationId:
          type: string
        recipientUserId:
          type: string
        channel:
          enum:
          - NOTIFICATION_CHANNEL_UNSPECIFIED
          - NOTIFICATION_CHANNEL_IN_APP
          - NOTIFICATION_CHANNEL_EMAIL
          - NOTIFICATION_CHANNEL_WEBHOOK
          type: string
          format: enum
        state:
          enum:
          - NOTIFICATION_STATE_UNSPECIFIED
          - NOTIFICATION_STATE_PENDING
          - NOTIFICATION_STATE_SENT
          - NOTIFICATION_STATE_DELIVERED
          - NOTIFICATION_STATE_FAILED
          - NOTIFICATION_STATE_AGGREGATED
          type: string
          format: enum
        template:
          type: string
        data:
          type: object
          additionalProperties:
            type: string
        attempts:
          type: integer
          format: uint32
        incidentId:
          type: string
        aggregatedNotificationIds:
          type: array
          items:
            type: string
          description: Set for aggregated notifications (N3).
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        read:
          type: boolean
          description: In-app notifications only.
        version:
          type: string
      description: Notification is a message to a recipient over a channel (aggregates.md, 5.6).
    psim.response.v1.NotifyParams:
      type: object
      properties:
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.Recipient'
        channels:
          type: array
          items:
            enum:
            - NOTIFICATION_CHANNEL_UNSPECIFIED
            - NOTIFICATION_CHANNEL_IN_APP
            - NOTIFICATION_CHANNEL_EMAIL
            - NOTIFICATION_CHANNEL_WEBHOOK
            type: string
            format: enum
        template:
          type: string
      description: NotifyParams sends notifications.
    psim.response.v1.PlanBinding:
      type: object
      properties:
        incidentTypeId:
          type: string
        siteIds:
          type: array
          items:
            type: string
        zoneIds:
          type: array
          items:
            type: string
        priorities:
          type: array
          items:
            enum:
            - PRIORITY_UNSPECIFIED
            - PRIORITY_P1
            - PRIORITY_P2
            - PRIORITY_P3
            - PRIORITY_P4
            type: string
            format: enum
        bindingPriority:
          type: integer
          description: Tie-breaker among bindings with equal specificity.
          format: int32
      description: PlanBinding selects incidents a plan applies to; the most specific binding wins (P5).
    psim.response.v1.Recipient:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
      description: 'Recipient is a notification recipient: a user or a role within the incident scope.'
    psim.response.v1.ResponsePlan:
      type: object
      properties:
        planId:
          type: string
        version:
          type: integer
          format: uint32
        name:
          type: string
        state:
          enum:
          - PLAN_STATE_UNSPECIFIED
          - PLAN_STATE_DRAFT
          - PLAN_STATE_PUBLISHED
          - PLAN_STATE_ARCHIVED
          type: string
          format: enum
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.PlanBinding'
        startStepId:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.Step'
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          $ref: '#/components/schemas/psim.common.v1.Actor'
      description: ResponsePlan is one immutable version of a response plan (aggregates.md, 5.1).
    psim.response.v1.ResponseRun:
      type: object
      properties:
        runId:
          type: string
        incidentId:
          type: string
        planId:
          type: string
        planVersion:
          type: integer
          format: uint32
        state:
          enum:
          - RUN_STATE_UNSPECIFIED
          - RUN_STATE_RUNNING
          - RUN_STATE_COMPLETED
          - RUN_STATE_CANCELLED
          type: string
          format: enum
        steps:
          type: array
          items:
            $ref: '#/components/schemas/psim.response.v1.StepExecution'
        activeStepIds:
          type: array
          items:
            type: string
        blockingStepIds:
          type: array
          items:
            type: string
          description: Unfinished mandatory steps (RR5).
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        version:
          type: string
      description: ResponseRun is the execution of a plan version for an incident (aggregates.md, 5.2).
    psim.response.v1.SlaTarget:
      type: object
      properties:
        priority:
          enum:
          - PRIORITY_UNSPECIFIED
          - PRIORITY_P1
          - PRIORITY_P2
          - PRIORITY_P3
          - PRIORITY_P4
          type: string
          format: enum
        acknowledgeWithin:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
        resolveWithin:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
      description: SlaTarget is the SLA for one priority.
    psim.response.v1.Step:
      type: object
      properties:
        stepId:
          type: string
        title:
          type: string
        mandatory:
          type: boolean
        nextStepId:
          type: string
          description: Next step for all kinds except decision; empty for a final step.
        instruction:
          $ref: '#/components/schemas/psim.response.v1.InstructionParams'
        checklist:
          $ref: '#/components/schemas/psim.response.v1.ChecklistParams'
        decision:
          $ref: '#/components/schemas/psim.response.v1.DecisionParams'
        command:
          $ref: '#/components/schemas/psim.response.v1.CommandParams'
        notify:
          $ref: '#/components/schemas/psim.response.v1.NotifyParams'
        wait:
          $ref: '#/components/schemas/psim.response.v1.WaitParams'
        escalate:
          $ref: '#/components/schemas/psim.response.v1.EscalateParams'
        automated:
          $ref: '#/components/schemas/psim.response.v1.AutomatedParams'
      description: Step is a node of a plan graph.
    psim.response.v1.StepExecution:
      type: object
      properties:
        stepId:
          type: string
        state:
          enum:
          - STEP_STATE_UNSPECIFIED
          - STEP_STATE_PENDING
          - STEP_STATE_ACTIVE
          - STEP_STATE_COMPLETED
          - STEP_STATE_SKIPPED
          - STEP_STATE_FAILED
          - STEP_STATE_CANCELLED
          type: string
          format: enum
        attempt:
          type: integer
          format: uint32
        actor:
          $ref: '#/components/schemas/psim.common.v1.Actor'
        activatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/psim.response.v1.StepResult'
      description: StepExecution is the execution state of one step.
    psim.response.v1.StepResult:
      type: object
      properties:
        checkedItemIds:
          type: array
          items:
            type: string
        decisionOptionId:
          type: string
        commandIds:
          type: array
          items:
            type: string
        note:
          type: string
          description: Reason for skip or override, or a free note.
        overridden:
          type: boolean
          description: Set when a supervisor completed a failed step (Override).
      description: StepResult is what the step produced.
    psim.response.v1.WaitParams:
      type: object
      properties:
        duration:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
      description: WaitParams pauses the plan.
    Problem:
      type: object
      description: Error body (RFC 9457), see psim.api.v1.Problem.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
      required:
      - type
      - title
      - status
      - code
    FieldViolation:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by Keycloak (OIDC Authorization Code + PKCE).
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected resource version (ETag). Required for updates of versioned resources.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID; repeated requests with the same key return the first result.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
tags:
- name: AuditService
  description: 'AuditService searches and verifies the audit chain (ADR-021). Owner: Audit Service. Scenario S10.'
- name: CatalogService
  description: "CatalogService manages sites, buildings, floors, zones, device types, devices and connectors.\n Owner: Resource\
    \ Catalog. Scenarios S1, S2."
- name: CommandService
  description: 'CommandService manages commands to devices. Owner: Command Service. Scenario S8.'
- name: CorrelationRuleService
  description: "CorrelationRuleService manages correlation rules and the active rule set.\n Owner: Correlation Engine (rule\
    \ management module). Scenario S4."
- name: EscalationPolicyService
  description: 'EscalationPolicyService manages SLA and escalation policies. Owner: Response Engine. Scenario S9.'
- name: EventHistoryService
  description: 'EventHistoryService searches stored events (ADR-028). Owner: Event History. Scenario S7.'
- name: FeedService
  description: 'FeedService serves console read models. Owner: Projection Service. Scenarios S6, S11.'
- name: IncidentService
  description: "IncidentService manages incidents and incident types. Owner: Incident Service.\n Scenarios S5-S7, S9. State\
    \ transitions follow state-models.md, section 1."
- name: MappingService
  description: 'MappingService manages mapping rules of connector types. Owner: Normalizer. Scenario S1.'
- name: MeService
  description: 'MeService describes the caller. Owner: API Gateway (from the access token and the policy table).'
- name: NotificationService
  description: 'NotificationService serves in-app notifications of the caller. Owner: Notification Service. Scenario S9.'
- name: ReportService
  description: "ReportService builds incident reports (ADR-028: analytics in ClickHouse).\n Owner: Projection Service. Scenario\
    \ S13."
- name: ResponsePlanService
  description: 'ResponsePlanService manages response plans. Owner: Response Engine. Scenario S7.'
- name: ResponseRunService
  description: 'ResponseRunService executes plan steps. Owner: Response Engine. Scenario S7.'
- name: SettingsService
  description: "SettingsService manages tenant-wide retention and processing settings.\n Owner: Resource Catalog; changes\
    \ are published to psim.config.v1."
servers:
- url: https://{host}
  variables:
    host:
      default: psim.local
security:
- oidc: []
