# OpenAPI Overlay 1.0 applied to the generated REST API v1 description (ADR-026).
# Adds what google.api.http annotations cannot express: security, conditional and idempotency
# headers, RFC 9457 errors, binary bodies. Applied by tools/contracts/openapi_overlay.py.
overlay: 1.0.0
info:
  title: PSIM REST API v1 overlay
  version: 1.0.0
actions:
  - target: $
    update:
      openapi: 3.0.3
      info:
        license:
          name: MIT
          url: https://opensource.org/licenses/MIT
        description: |
          PSIM Platform REST API v1. Generated from contracts/proto/psim/api/v1 and this overlay.
          JSON is the canonical protobuf JSON mapping. Lists use cursor pagination
          (pageSize, pageToken -> nextPageToken). Errors are application/problem+json (RFC 9457).
      servers:
        - url: https://{host}
          variables:
            host:
              default: psim.local
      security:
        - oidc: []

  - target: $.components
    update:
      securitySchemes:
        oidc:
          type: http
          scheme: bearer
          bearerFormat: JWT
          description: Access token issued by Keycloak (OIDC Authorization Code + PKCE).
      parameters:
        IfMatch:
          name: If-Match
          in: header
          required: false
          description: Expected resource version (ETag). Required for updates of versioned resources.
          schema:
            type: string
        IdempotencyKey:
          name: Idempotency-Key
          in: header
          required: false
          description: UUID; repeated requests with the same key return the first result.
          schema:
            type: string
            format: uuid
      schemas:
        Problem:
          type: object
          description: Error body (RFC 9457), see psim.api.v1.Problem.
          properties:
            type:
              type: string
            title:
              type: string
            status:
              type: integer
              format: int32
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
            traceId:
              type: string
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldViolation'
          required: [type, title, status, code]
        FieldViolation:
          type: object
          properties:
            field:
              type: string
            code:
              type: string
            message:
              type: string
      responses:
        Problem:
          description: Error (RFC 9457).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # Every operation can fail with these errors.
  - target: $.paths.*.*
    update:
      responses:
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  # Mutations: optimistic concurrency, state conflicts, idempotency.
  - target: $.paths.*.post
    update:
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  - target: $.paths.*.put
    update:
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'

  # Binary bodies (google.api.HttpBody).
  - target: $.paths['/v1/locations/{locationId}/floor-plan'].put.requestBody.content
    remove: true
  - target: $.paths['/v1/locations/{locationId}/floor-plan'].put.requestBody
    update:
      content:
        image/png:
          schema: {type: string, format: binary}
        image/jpeg:
          schema: {type: string, format: binary}
        image/svg+xml:
          schema: {type: string, format: binary}
  - target: $.paths['/v1/locations/{locationId}/floor-plan'].get.responses['200'].content
    remove: true
  - target: $.paths['/v1/locations/{locationId}/floor-plan'].get.responses['200']
    update:
      content:
        image/*:
          schema: {type: string, format: binary}
  - target: $.paths['/v1/imports'].post.requestBody.content
    remove: true
  - target: $.paths['/v1/imports'].post.requestBody
    update:
      content:
        text/csv:
          schema: {type: string, format: binary}
        application/json:
          schema: {type: string, format: binary}
  - target: $.paths['/v1/devices:export'].get.responses['200'].content
    remove: true
  - target: $.paths['/v1/devices:export'].get.responses['200']
    update:
      content:
        text/csv:
          schema: {type: string, format: binary}
        application/json:
          schema: {type: string, format: binary}
  - target: $.paths['/v1/reports/incidents:export'].get.responses['200'].content
    remove: true
  - target: $.paths['/v1/reports/incidents:export'].get.responses['200']
    update:
      content:
        text/csv:
          schema: {type: string, format: binary}
  - target: $.paths['/v1/audit/records:export'].get.responses['200'].content
    remove: true
  - target: $.paths['/v1/audit/records:export'].get.responses['200']
    update:
      content:
        application/x-ndjson:
          schema: {type: string, format: binary}
