    severity: high
    restore: fire.extinguishing.unblocked
  - code: fire.extinguishing.unblocked
    name:
      ru: Автоматика пожаротушения включена
      en: Extinguishing unblocked
    class: restore
    severity: info
  - code: fire.panel.reset
    name:
      ru: Сброс пожарной панели
      en: Panel reset
    class: state
    severity: info
