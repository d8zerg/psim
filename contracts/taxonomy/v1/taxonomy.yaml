    class: alarm
    severity: critical
    restore: fire.manual_call_point.restore
  - code: fire.manual_call_point.restore
    name:
      ru: Ручной извещатель в норме
      en: Manual call point restore
    class: restore
    severity: info
  - code: fire.loop.fault
    name:
      ru: Неисправность шлейфа
      en: Loop fault
    class: fault
    severity: medium
    restore: fire.loop.restore
  - code: fire.loop.restore
    name:
      ru: Шлейф в норме
      en: Loop restore
    class: restore
    severity: info
  - code: fire.extinguishing.started
    name:
      ru: Пуск автоматического пожаротушения
      en: Extinguishing started
    class: alarm
    severity: critical
  - code: fire.extinguishing.blocked
    name:
      ru: Автоматика пожаротушения отключена
