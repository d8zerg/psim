# Event taxonomy v1 - single source of truth (docs/domain/event-taxonomy.md describes it).
# Rules: codes are only added; removal goes through deprecated: true until the next major version.
version: '1'
classes:
- alarm
- warning
- fault
- restore
- state
- info
severities:
- info
- low
- medium
- high
- critical
priority_by_severity:
  critical: P1
  high: P2
  medium: P3
  low: P4
significance_threshold: medium
standard_attributes:
- credential_id
- person_ref
- direction
- object_class
- confidence
- track_id
- snapshot_url
- clip_url
- loop
- value
- unit
- raw_code
domains:
- code: intrusion
  name:
    ru: охранная сигнализация
    en: Intrusion
  types:
  - code: intrusion.zone.alarm
    name:
      ru: Тревога в охранной зоне
      en: Zone alarm
    class: alarm
    severity: high
    restore: intrusion.zone.restore
  - code: intrusion.zone.restore
    name:
      ru: Зона в норме
      en: Zone restore
    class: restore
    severity: info
  - code: intrusion.zone.armed
    name:
      ru: Постановка на охрану
      en: Zone armed
    class: state
    severity: info
  - code: intrusion.zone.disarmed
    name:
      ru: Снятие с охраны
      en: Zone disarmed
    class: state
    severity: info
  - code: intrusion.zone.arm_failed
    name:
      ru: Отказ постановки на охрану
      en: Zone arm failed
    class: warning
    severity: medium
  - code: intrusion.zone.bypassed
    name:
      ru: Зона исключена из охраны
      en: Zone bypassed
    class: warning
    severity: low
    restore: intrusion.zone.unbypassed
  - code: intrusion.zone.unbypassed
    name:
      ru: Зона возвращена в охрану
      en: Zone unbypassed
    class: restore
    severity: info
  - code: intrusion.panic.alarm
    name:
      ru: Тревожная кнопка
      en: Panic alarm
    class: alarm
    severity: critical
  - code: intrusion.duress.alarm
    name:
      ru: Код принуждения
      en: Duress alarm
    class: alarm
    severity: critical
  - code: intrusion.device.tamper
    name:
      ru: Вскрытие корпуса
      en: Device tamper
    class: alarm
    severity: high
    restore: intrusion.device.tamper_restore
  - code: intrusion.device.tamper_restore
    name:
      ru: Корпус закрыт
      en: Device tamper restore
    class: restore
    severity: info
- code: fire
