# PSIM Platform: single entry point for build, generation and checks (ADR-030).
# Install Task: https://taskfile.dev. Run `task` to list tasks.
version: '3'

vars:
  CACHE: '{{.ROOT_DIR}}/.cache'
  UID:
    sh: id -u
  GID:
    sh: id -g
  PYTHON: python3 -I
  # Parallel build jobs; override: task cpp:build JOBS=4.
  JOBS:
    sh: echo $(( $(nproc) / 2 ))
  # C++ toolchain (ADR-032): built on the oldest target glibc (Debian 12, 2.36); the tag follows
  # the Dockerfile content. Target platforms run the artifacts as plain OS images.
  TOOLCHAIN_IMAGE:
    sh: echo "psim/toolchain:debian12-$(sha256sum {{.ROOT_DIR}}/tools/toolchain/Dockerfile | cut -c1-12)"
  TOOLCHAIN_BASE: debian:bookworm@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
  # Build platform of the toolchain; build directories are build/<PLATFORM>/<preset>.
  PLATFORM: debian12
  RUNTIME_IMAGES:
    map:
      debian12: debian:bookworm@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
      astra18: registry.astralinux.ru/library/astra/ubi18@sha256:b62fb94cf64384778d8c0c0da04a06a30f4ad0abbe18de969caf102e34faf065
  # Contract tooling image built locally from tools/contracts/image (buf + protoc plugins);
  # the tag follows the Dockerfile content, so a changed Dockerfile gives a new image.
  # Redoc bundled into the portal image (tools/docs/portal/Dockerfile) for the offline REST reference;
  # must equal the version the pinned Redocly CLI references (checked by docs:portal).
  REDOC_VERSION: 2.5.4
  # Documentation portal image built locally from tools/docs/portal (MkDocs + Material, ADR-038).
  PORTAL_IMAGE:
    sh: echo "psim/docs-portal:$(cat {{.ROOT_DIR}}/tools/docs/portal/Dockerfile {{.ROOT_DIR}}/tools/docs/portal/requirements.txt | sha256sum | cut -c1-12)"
  CONTRACTS_TOOLS_IMAGE:
    sh: echo "psim/contracts-tools:$(sha256sum {{.ROOT_DIR}}/tools/contracts/image/Dockerfile | cut -c1-12)"
  # Pinned tool and base images: tag for readability, digest for integrity (SR-23). Change here only.
  REDOCLY_IMAGE: redocly/cli:2.58.2@sha256:02511945b4d6dbc1e51138f1c8fcc532ba269bb61aea30d3dcbc9978af61af42
  ASYNCAPI_IMAGE: asyncapi/cli:6.1.0@sha256:2240534054590b3d41d691fdf88e1f7a1e581b9cc4fb1d4af65ca93434aa681b
  MERMAID_IMAGE: minlag/mermaid-cli:12.0.0@sha256:fa995339034aae7e5cd4f61482248b7f5c51be355b1a6f6eda11a2bbf8401f5f
  STRUCTURIZR_IMAGE: structurizr/structurizr:2026.09.19@sha256:721136283c2f9cf1ba69037bc9de136c579d66fdcb2d771cb60546ec68def1a5
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  # Base of the container images (ADR-034): glibc only (executables link libc++ and libgcc statically),
  # no OpenSSL, no shell, non-root user.
  DISTROLESS_IMAGE: gcr.io/distroless/base-nossl-debian12:nonroot@sha256:be40c00dfabd86576d92666e87e406714d5618342de1a0c213ad232de255172e
  # Product version (CMakeLists.txt project VERSION) and container images (deploy/images/<name>).
  VERSION:
    sh: sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' {{.ROOT_DIR}}/CMakeLists.txt
  IMAGES: psimctl
  # Scope of the last `task ci` run (tools/ci/scope.py).
  CI_SCOPE: build/{{.PLATFORM}}/ci-scope.json

includes:
  toolchain:
    taskfile: ./tools/taskfiles/toolchain.yml
    dir: .
  cpp:
    taskfile: ./tools/taskfiles/cpp.yml
    dir: .
  arch:
    taskfile: ./tools/taskfiles/arch.yml
    dir: .
  bench:
    taskfile: ./tools/taskfiles/bench.yml
    dir: .
  release:
    taskfile: ./tools/taskfiles/release.yml
    dir: .
  env:
    taskfile: ./tools/taskfiles/env.yml
    dir: .
  web:
    taskfile: ./tools/taskfiles/web.yml
    dir: .
  security:
    taskfile: ./tools/taskfiles/security.yml
    dir: .
  contracts:
    taskfile: ./contracts/Taskfile.yml
    dir: ./contracts
  docs:
    taskfile: ./docs/Taskfile.yml
    dir: ./docs

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - "{{.TASK_EXE}} --list"

  check:
    desc: Run every code check (contracts, architecture, C++ quality gates and tests, documentation)
    cmds:
      - task: contracts:check
      - task: arch:check
      - task: cpp:format
      - task: cpp:lint
      - task: cpp:test
      - task: cpp:test:sanitizers
      - task: cpp:coverage
      - task: cpp:runtime-test
      - task: web:check
      - task: docs:check

  ci:
    desc: 'Local CI pipeline, run before every commit (ADR-034, ADR-036); checks what changed against origin/master (FULL=true: all)'
    vars:
      FULL: '{{.FULL | default "false"}}'
    cmds:
      - task: cpp:configure
        vars: {PRESET: debug}
      - '{{.PYTHON}} tools/ci/scope.py compute . build/{{.PLATFORM}}/debug {{.CI_SCOPE}} {{.FULL}}'
      - task: _ci_stages
      - task: _ci_record

  _ci_stages:
    internal: true
    vars:
      CPP: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} cpp'}
      CONTRACTS: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} contracts'}
      DOCS: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} docs'}
      DEPS: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} deps'}
      RELEASE: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} release'}
      BENCH: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} bench'}
      ENV: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} env'}
      WEB: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} web'}
      LABELS: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} labels'}
      TIDY: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} tidy'}
      MODULES: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} modules'}
      BENCHES: {sh: '{{.PYTHON}} tools/ci/scope.py get {{.CI_SCOPE}} benches'}
    cmds:
      - task: contracts:check                 # TS-04
        if: '[ "{{.CONTRACTS}}" = true ]'
      - task: arch:check                      # FF-01, FF-02, FF-07, FF-17
      - task: cpp:format                      # FF-16
      - task: cpp:lint                        # FF-10, SEC-01 (affected translation units)
        vars: {FILES: '{{.TIDY}}'}
        if: '[ "{{.CPP}}" = true ]'
      - task: cpp:test                        # TS-01 (affected targets)
        vars: {LABELS: '{{.LABELS}}'}
        if: '[ "{{.CPP}}" = true ]'
      - task: cpp:test:sanitizers             # FF-11
        vars: {LABELS: '{{.LABELS}}'}
        if: '[ "{{.CPP}}" = true ]'
      - task: cpp:coverage                    # FF-12 (affected modules)
        vars: {LABELS: '{{.LABELS}}', MODULES: '{{.MODULES}}'}
        if: '[ "{{.CPP}}" = true ]'
      - task: cpp:runtime-test                # FF-15
        if: '[ "{{.CPP}}" = true ]'
      - task: env:ci-test                     # step 1.4: fresh environment, startup budget, smoke tests
        if: '[ "{{.ENV}}" = true ]'
      # Component tests of adapters (TS-03) run in this environment from steps 2.3-2.8.
      - task: web:check                       # step 1.5: format, generated clients, lint, types, tests, budgets
        if: '[ "{{.WEB}}" = true ]'
      - task: web:e2e                         # Playwright smoke of the built console
        if: '[ "{{.WEB}}" = true ]'
      - task: docs:check                      # FF-08
        if: '[ "{{.DOCS}}" = true ]'
      - task: security:deps                   # SEC-02
        if: '[ "{{.DEPS}}" = true ]'
      - task: bench:compare                   # B-05
        vars: {BENCHES: '{{.BENCHES}}'}
        if: '[ "{{.BENCH}}" = true ]'
      - task: release:package:test            # FF-18
        if: '[ "{{.RELEASE}}" = true ]'
      - task: release:images:test             # FF-19
        if: '[ "{{.RELEASE}}" = true ]'

  ci:nightly:
    desc: Nightly pipeline - ci over the full scope plus reproducibility and image scanning
    cmds:
      - task: ci
        vars: {FULL: 'true'}
      - task: cpp:reproducible                # FF-13
      - task: security:images                 # SEC-03

  release:
    desc: Release pipeline - nightly checks, signed release directory, verification (FF-14)
    preconditions:
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: release from a clean working tree only
    cmds:
      - task: ci:nightly
      - task: release:dist
      - task: release:verify

  _ci_record:
    internal: true
    desc: Record that the pipeline passed for a commit on a clean tree (task ci:status)
    cmds:
      - mkdir -p {{.CACHE}}/ci
      - cmd: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ci: passed on a working tree with uncommitted changes - not recorded for push"
          else
            sha=$(git rev-parse HEAD)
            date -u +%Y-%m-%dT%H:%M:%SZ > "{{.CACHE}}/ci/$sha.ok"
            echo "ci: passed for $sha"
          fi

  ci:run:
    desc: 'Run the pipeline on the committed content of a commit in a clean clone: task ci:run SHA=<commit> (default HEAD)'
    cmds:
      - sh tools/ci/runner.sh {{.SHA | default "HEAD"}}

  ci:status:
    desc: 'Pipeline state of a commit - passed, FAILED, running or none; exit 0 only when passed (SHA, default HEAD)'
    silent: true
    vars:
      SHA:
        sh: git rev-parse {{.SHA | default "HEAD"}}
    cmds:
      - cmd: |
          ci={{.CACHE}}/ci; sha={{.SHA}}
          if [ -f "$ci/$sha.running" ] && kill -0 "$(cat "$ci/$sha.running")" 2>/dev/null; then echo "$sha: running"; exit 1
          elif [ -f "$ci/$sha.ok" ]; then echo "$sha: $(cat "$ci/$sha.ok")"
          elif [ -f "$ci/$sha.failed" ]; then echo "$sha: $(cat "$ci/$sha.failed")"; exit 1
          else echo "$sha: no pipeline record"; exit 1; fi

  ci:log:
    desc: 'Follow the pipeline log of a commit (SHA, default HEAD)'
    interactive: true
    vars:
      SHA:
        sh: git rev-parse {{.SHA | default "HEAD"}}
    cmds:
      - tail -n 50 -F {{.CACHE}}/ci/{{.SHA}}.log

  gen:
    desc: Regenerate all committed generated artifacts
    cmds:
      - task: contracts:gen
      - task: docs:threats:gen
      - task: docs:verification:gen

  tools:pull:
    desc: Pull pinned tool images
    cmds:
      - for: [REDOCLY_IMAGE, ASYNCAPI_IMAGE, MERMAID_IMAGE, STRUCTURIZR_IMAGE]
        cmd: docker pull --quiet {{index . .ITEM}}
      - task: tools:build

  tools:build:
    desc: Build the contract tooling image (buf + local protoc plugins)
    status:
      - docker image inspect {{.CONTRACTS_TOOLS_IMAGE}} >/dev/null 2>&1
    cmds:
      - docker build --quiet -t {{.CONTRACTS_TOOLS_IMAGE}} {{.ROOT_DIR}}/tools/contracts/image

  _publish:
    internal: true
    desc: Compare a generated file with the committed one, or copy it when UPDATE=true
    requires:
      vars: [SRC, DST]
    cmds:
      - cmd: |
          rel="$(realpath -m --relative-to="{{.ROOT_DIR}}" "{{.DST}}")"
          if [ "{{.UPDATE}}" = "true" ]; then
            cp "{{.SRC}}" "{{.DST}}" && echo "updated: $rel"
          elif ! diff -q "{{.SRC}}" "{{.DST}}" >/dev/null 2>&1; then
            echo "STALE: $rel differs from generated output; run: task gen" >&2
            exit 1
          else
            echo "ok: $rel"
          fi

  _publish_dir:
    internal: true
    desc: Compare a generated directory with the committed one, or replace it when UPDATE=true
    requires:
      vars: [SRC, DST]
    cmds:
      - cmd: |
          rel="$(realpath -m --relative-to="{{.ROOT_DIR}}" "{{.DST}}")"
          if [ "{{.UPDATE}}" = "true" ]; then
            rm -rf "{{.DST}}" && mkdir -p "$(dirname "{{.DST}}")" && cp -r "{{.SRC}}" "{{.DST}}" && echo "updated: $rel/"
          elif ! diff -r -q "{{.SRC}}" "{{.DST}}" >/dev/null 2>&1; then
            echo "STALE: $rel/ differs from generated output; run: task gen" >&2
            exit 1
          else
            echo "ok: $rel/"
          fi

  clean:
    desc: Remove generated caches (.cache/contracts, .cache/mermaid)
    cmds:
      - rm -rf {{.CACHE}}/contracts {{.CACHE}}/mermaid
