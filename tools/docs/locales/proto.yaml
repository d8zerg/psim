Error code from contracts/errors/errors.yaml: Код ошибки из contracts/errors/errors.yaml
Error code from the catalog, for example "INGEST_INVALID_EVENT": Код ошибки из каталога, например "INGEST_INVALID_EVENT"
Error code from the catalog, for example "REALTIME_SLOW_CONSUMER": Код ошибки из каталога, например "REALTIME_SLOW_CONSUMER"
Error code when success is false: Код ошибки при success = false
ErrorFrame reports an error; the connection is closed after fatal errors: ErrorFrame сообщает ошибку; после фатальных ошибок
