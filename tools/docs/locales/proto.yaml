Catalog configuration version the connector already has: Версия конфигурации каталога, уже имеющаяся у коннектора
CatalogRecord is the value of compacted topic psim.catalog.v1: CatalogRecord - значение компактируемого топика psim.catalog.v1
CatalogService manages sites, buildings, floors, zones, device types, devices and connectors: CatalogService управляет площадками,
