Published in psim.config.v1 under key "ruleset/<tenant_id>": Публикуется в psim.config.v1 с ключом "ruleset/<tenant_id>"
Raw request or response content: Исходное содержимое запроса или ответа
RawEvent is an event as delivered by a connector, before normalization: RawEvent - событие в виде, полученном от коннектора,
