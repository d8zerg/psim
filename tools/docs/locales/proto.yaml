CommandResult reports the outcome of a command: CommandResult сообщает исход команды
'CommandResultRecord is the value of topic psim.commands.results.v1 (key: command_id)': CommandResultRecord - значение топика
  psim.commands.results.v1 с ключом command_id
CommandState is the lifecycle state of a command: CommandState - состояние жизненного цикла команды
CommandUpdated reports a change of a command; the change equals the new state: CommandUpdated сообщает изменение команды;
