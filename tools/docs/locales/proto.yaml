Always eight bytes: Всегда восемь байтов
Always eight bytes. More efficient than uint64 if values are often greater than 2^56: Всегда восемь байтов. Эффективнее uint64,
  если значения часто превышают 2^56
Always four bytes: Всегда четыре байта
Always four bytes. More efficient than uint32 if values are often greater than 2^28: Всегда четыре байта. Эффективнее uint32,
  если значения часто превышают 2^28
AuditEntry is an action to be recorded in the audit chain: AuditEntry - действие для записи в цепочку аудита
'AuditEventRecord is the value of topic psim.audit.v1 (key: tenant_id)': AuditEventRecord - значение топика psim.audit.v1
