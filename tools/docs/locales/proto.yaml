ConnectorDevice is a device served by the connector: ConnectorDevice - устройство, обслуживаемое коннектором
ConnectorEvent is one event from a source: ConnectorEvent - одно событие источника
ConnectorGatewayService is the connector protocol v1 (ADR-017): ConnectorGatewayService - протокол коннектора v1 (ADR-017)
CorrelationChangelogRecord is the value of internal compacted topic: CorrelationChangelogRecord - значение внутреннего компактируемого
