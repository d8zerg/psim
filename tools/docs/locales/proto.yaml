A string must always contain UTF-8 encoded or 7-bit ASCII text: Строка должна содержать текст UTF-8 или 7-битный ASCII
AbsenceSpec fires when an expected event does not follow a trigger within the window: AbsenceSpec срабатывает, если ожидаемое
