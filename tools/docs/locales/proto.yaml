CommandAck confirms that the connector received a command: CommandAck подтверждает получение команды коннектором
CommandDelivery is a command routed to the connector session: CommandDelivery - команда, направленная в сессию коннектора
'CommandDeliveryRecord is the value of topic psim.commands.v1 (key: connector_id)': CommandDeliveryRecord - значение топика
