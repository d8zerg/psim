AuditOutcome is the result of the audited action: AuditOutcome - результат аудируемого действия
AuditQuery selects audit records: AuditQuery выбирает записи аудита
Authenticate authenticates the connection; also sent on token refresh: Authenticate аутентифицирует соединение; также отправляется
