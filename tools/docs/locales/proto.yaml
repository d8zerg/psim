CreateDeviceRequest is the request of CreateDevice: CreateDeviceRequest - запрос операции CreateDevice
CreateDeviceTypeRequest is the request of CreateDeviceType: CreateDeviceTypeRequest - запрос операции CreateDeviceType
CreateEscalationPolicyRequest is the request of CreateEscalationPolicy: CreateEscalationPolicyRequest - запрос операции CreateEscalationPolicy
CreateIncidentTypeRequest is the request of CreateIncidentType: CreateIncidentTypeRequest - запрос операции CreateIncidentType
CreateLocationRequest is the request of CreateLocation: CreateLocationRequest - запрос операции CreateLocation
CreateMaintenanceWindowRequest carries the desired interval: CreateMaintenanceWindowRequest содержит желаемый интервал
Creation, acknowledgement and resolution metrics use their respective timestamps: Показатели создания, принятия и решения
