Monotonic within the session; echoed in BatchAck: Монотонно возрастает в пределах сессии; повторяется в BatchAck
Name: Имя
Nanosecond fraction, from 0 through 999999999: Дробная часть секунды в наносекундах, от 0 до 999999999
