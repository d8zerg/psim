Changes of one incident (filter.incident_id required): Изменения одного инцидента; требуется filter.incident_id
Client-chosen id echoed in replies: Идентификатор, выбранный клиентом и повторяемый в ответах
ClientFrame is a frame sent by the browser: ClientFrame - кадр, отправленный браузером
Command asks the connector to act on a device. Execute at most once per command_id: Command запрашивает действие коннектора
