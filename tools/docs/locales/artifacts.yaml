      /methods/79/name:
        source: Web client quality
        ru: Качество веб-клиента
      /methods/78/purpose:
        source: Reproducible environment and requirement SR-02 (ADR-035)
        ru: Воспроизводимое окружение и требование SR-02 (ADR-035)
      /methods/78/criteria:
        source: Start a fresh environment within 5 minutes with 1 and 3 Kafka brokers; all component and inter-component smoke
          tests pass; Keycloak realm enforces SR-02
        ru: Окружение поднимается с нуля не дольше 5 минут (1 и 3 брокера Kafka); смоук-тесты всех компонентов и путей между
          ними проходят; SR-02 в realm Keycloak
      /methods/78/name:
        source: Local environment from scratch
        ru: Локальное окружение с нуля
      /methods/77/purpose:
        source: Requirement SR-24 (ADR-034)
        ru: Требование SR-24 (ADR-034)
      /methods/77/criteria:
        source: Every image runs as a non-root user with a read-only filesystem, no capabilities and no-new-privileges
        ru: Каждый образ запускается не под root, с файловой системой только для чтения, без capabilities и с no-new-privileges
      /methods/77/name:
        source: Images without root or unnecessary privileges
        ru: Образы без root и лишних прав
      /methods/76/purpose:
        source: Debian 13 x86_64 distribution (F-PLT-06, ADR-034)
        ru: Поставка для Debian 13 x86_64 (F-PLT-06, ADR-034)
      /methods/76/criteria:
        source: Each DEB package installs, runs and uninstalls in a clean Debian 13 x86_64 image; dpkg-shlibdeps derives dependencies
          from actual executable symbols
        ru: Каждый пакет DEB ставится, запускается и удаляется в чистом образе Debian 13 x86_64; зависимости вычислены dpkg-shlibdeps
          по фактическим символам исполняемых файлов
      /methods/1/criteria:
        source: Compare the original build, static modules, deferred editors, language dictionaries and separate entry points;
          ru/en, real cold and warm HTTP caches, complete graphs including dynamic imports and dictionary data, no premature
          loading of restricted routes, chunk failure, artifact replacement and translation reload with input preserved
        ru: Сравнение исходной сборки, статических модулей, отложенных редакторов, языковых словарей и отдельных входов; ru/en,
          реальные холодный и прогретый HTTP-кэш, полные графы с динамическими imports и данными словарей, запрет преждевременной
          загрузки закрытого маршрута, ошибка чанка, обновление артефакта и повтор загрузки перевода с сохранением ввода
      /methods/76/name:
        source: Package installation on the target platform
        ru: Установка пакетов на целевой платформе
      /methods/75/purpose:
        source: Verify architecture checks even with an empty domain core (ADR-033)
        ru: Достоверность архитектурных проверок при пустом доменном ядре (ADR-033)
      /methods/1/name:
        source: Web module loading and recovery
        ru: Загрузка и восстановление веб-модулей
      /methods/75/criteria:
        source: For every arch:deps, arch:domain-purity and arch:sql rule, a violating fixture fails
        ru: Для каждого правила arch:deps, arch:domain-purity, arch:sql тест с нарушением даёт отказ
      /methods/75/name:
        source: Architecture check self-tests
        ru: Самопроверка fitness functions
      /methods/74/purpose:
        source: Coding standard (ADR-033)
        ru: Стандарт кодирования (ADR-033)
      /methods/74/criteria:
        source: clang-format with .clang-format changes no project files
        ru: clang-format по .clang-format не меняет ни одного файла проекта
      /methods/1/purpose:
        source: Compare loading strategies and verify current limits before changing the distribution
        ru: Сравнение способов загрузки и проверка действующих пределов до изменения поставки
      /methods/74/name:
        source: C++ formatting
        ru: Формат кода C++
      /methods/73/criteria:
        source: Test executables and psimctl pass on Debian 13 x86_64 without the toolchain; all system shared-library dependencies
