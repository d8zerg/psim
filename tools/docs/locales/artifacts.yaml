      /methods/105/purpose:
        source: Incident lifecycle, shared authorization and responsibility preservation
        ru: Жизненный цикл инцидентов, общая авторизация и сохранение ответственности
      /methods/58/name:
        source: Reference simulator event generator
        ru: Генератор эталонного симулятора
      /methods/29/name:
        source: Consoles and REST under load
        ru: Консоли и REST под нагрузкой
      /methods/105/criteria:
        source: Two HTTPS instances, real Kafka, PostgreSQL and Keycloak; transitions, versions, retries, grouping window,
          history, access scope and confirmed handover preserve invariants; SIGKILL and repeated signals cause no lost or
          duplicate effects
        ru: Два HTTPS-экземпляра, настоящие Kafka, PostgreSQL и Keycloak; переходы, версии, повторы, окно группировки, история,
          область доступа и подтверждённая передача сохраняют инварианты; SIGKILL и повтор сигналов не теряют и не дублируют
          эффекты
      /methods/57/criteria:
        source: Compare all benchmarks against the master baseline; regression greater than 5% blocks merging
        ru: Сравнение всех бенчмарков с базовой линией master; ухудшение > 5% блокирует слияние
      /methods/28/criteria:
        source: 0 losses; lag returns to normal within 5 minutes after the peak
        ru: 0 потерь; лаг возвращается к норме ≤ 5 мин после пика
      /methods/105/name:
        source: Incident Service and authorization
        ru: Incident Service и авторизация
      /methods/57/name:
        source: Performance regression gate
        ru: Барьер регрессии производительности
      /methods/28/name:
        source: 1.5x peak (75 000 events/s) for 10 minutes
        ru: Пик ×1,5 (75 000 событий/с), 10 мин
      /methods/104/purpose:
        source: Notification delivery and SSRF protection
        ru: Доставка уведомлений и защита от SSRF
      /methods/56/criteria:
        source: Throughput for every rule type and cost of CEL expression evaluation
        ru: Пропускная способность правил всех видов, стоимость выражений CEL
      /methods/27/criteria:
        source: The L-02 thresholds hold throughout the interval; memory use, lag and latency do not grow
        ru: Те же пороги, что L-02, на всём интервале; нет роста памяти, лагов и задержек
      /methods/104/criteria:
        source: Email and webhooks reach test SMTP and HTTP receivers; receiver failure and recovery cause no notification
          loss or duplication; reject prohibited and internal webhook addresses; audit delivery
        ru: Email и webhook доставляются через тестовые SMTP и приёмник; отказ и восстановление получателя не теряют и не
          дублируют уведомления; запрещённые и внутренние адреса webhook отклоняются; доставка фиксируется в аудите
      /methods/56/name:
        source: Correlation rule evaluation
        ru: Вычисление правил корреляции
      /methods/27/name:
        source: LOAD-50K soak test for 24 hours
        ru: Длительная нагрузка LOAD-50K, 24 ч
      /methods/104/name:
        source: Notification delivery and webhook protection
        ru: Доставка уведомлений и защита webhook
      /methods/55/criteria:
        source: Record per-core throughput and stage p99 <= 30 ms as the baseline
        ru: Пропускная способность на ядро и p99 этапа ≤ 30 мс на базовой линии
      /methods/26/criteria:
        source: 50 000 events/s; event -> signal p99 <= 300 ms; event -> console p99 <= 1 s; reconciliation finds no loss
          or duplicates
        ru: 50 000 событий/с; событие -> сигнал p99 ≤ 300 мс; событие -> консоль p99 ≤ 1 с; сверка без потерь и дубликатов
      /methods/6/criteria:
        source: PKCE, ID token validation, a single concurrent refresh, cleanup on logout, direct entry, role boundaries and
          late responses
        ru: PKCE, проверка ID token, одиночный refresh, очистка при выходе, прямой вход, ролевые границы и поздние ответы
      /methods/103/purpose:
        source: Reproducibility of read models from Kafka
        ru: Воспроизводимость read-моделей из Kafka
      /methods/55/name:
        source: Normalizer per CPU core
        ru: Normalizer на ядро
      /methods/26/name:
        source: Sustained LOAD-50K for 1 hour
        ru: Устойчивая нагрузка LOAD-50K, 1 ч
      /methods/103/criteria:
        source: Projections rebuilt by Kafka replay match production projections; old events cannot produce false online or
          actual state; the end-to-end event scenario passes after API Gateway projection migration
        ru: Проекции, перестроенные проигрыванием Kafka, совпадают с рабочими; старые события не дают ложного online или actual;
          сквозной сценарий событий проходит после переноса проекции API Gateway
      /methods/54/criteria:
        source: Record overhead as the baseline
        ru: Накладные расходы зафиксированы как базовая линия
      /methods/6/name:
        source: Shell session and role-based routes
        ru: Сессия и ролевые маршруты оболочки
      /methods/25/criteria:
        source: Lag does not grow; stage latency regresses by no more than 5% against baseline; reconciliation finds no loss
        ru: Лаг не растёт; задержки этапов не хуже базовой линии более чем на 5%; сверка без потерь
      /methods/103/name:
        source: Projection rebuild from Kafka
        ru: Перестроение проекций из Kafka
      /methods/54/name:
        source: Asynchronous primitives
        ru: Асинхронные примитивы
      /methods/25/name:
        source: Nightly LOAD-5K test
        ru: Ночная нагрузка LOAD-5K
      /methods/102/purpose:
        source: Two real instances, PostgreSQL, Kafka and S3; backup and suppression application are tested separately
