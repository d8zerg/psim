artifacts:
  docs/quality/verification.yaml:
    kind: quality
    strings:
      /methods/83/purpose:
        source: Requirements SR-23, SR-24
        ru: Требования SR-23, SR-24
      /methods/83/criteria:
        source: Trivy scans release images; critical and high vulnerabilities block the pipeline
        ru: Trivy по образам выпуска; критичные и высокие уязвимости блокируют
      /methods/83/name:
        source: Image vulnerability scanning
        ru: Сканирование образов
      /methods/82/criteria:
        source: Trivy scans lockfiles and SBOMs; critical and high vulnerabilities and prohibited licenses block the pipeline
        ru: Trivy по lock-файлам и SBOM; критичные и высокие уязвимости и запрещённые лицензии блокируют
      /methods/82/name:
        source: Dependency vulnerabilities and licenses
        ru: Уязвимости и лицензии зависимостей
      /methods/81/purpose:
        source: Security requirements verified by scanning
        ru: Требования безопасности, проверка scan
      /methods/0/name:
        source: Observability package
        ru: Пакет наблюдаемости
      /methods/81/criteria:
        source: clang-tidy profile with bugprone, cert and security checks; 0 findings
        ru: Профиль clang-tidy с проверками bugprone, cert, security; 0 замечаний
      /methods/81/name:
        source: Static security analysis
        ru: Статический анализ безопасности
      /methods/80/purpose:
        source: Shared RBAC/ABAC implementation and mandatory identity freshness checks
        ru: Единая реализация RBAC/ABAC и обязательная проверка актуальности идентичности
      /methods/80/criteria:
        source: Services contain neither custom scope checks nor JWT validation without shared introspection configuration;
          negative self-tests detect violations
        ru: В сервисах нет собственных проверок областей и JWT-проверок без общей конфигурации introspection; негативные самопроверки
          выявляют нарушения
      /methods/80/name:
        source: Shared service authorization
        ru: Общая авторизация сервисов
      /methods/79/purpose:
        source: TypeScript standard and web client checks (ADR-037)
        ru: Стандарт TypeScript и проверки веб-клиента (ADR-037)
      /methods/79/criteria:
        source: Formatting, ESLint without warnings, strict type checks, Vitest coverage >= 80% per package, bundle budgets,
