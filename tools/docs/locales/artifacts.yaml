      /methods/60/name:
        source: Domain core purity
        ru: Чистота доменного ядра
      /methods/59/purpose:
        source: Architecture rules (ADR-001)
        ru: Архитектурные правила (ADR-001)
      /methods/59/criteria:
        source: libs/domain has no infrastructure dependencies; services do not depend on each other (ADR-001)
        ru: libs/domain не зависит от инфраструктуры; сервисы не зависят друг от друга (ADR-001)
      /methods/59/name:
        source: Module dependency directions
        ru: Направления зависимостей модулей
      /methods/30/criteria:
        source: 50 000 events/s through 2 Connector Gateway instances up to Kafka acknowledgement; other application processes
