        ru: Тестовые исполняемые файлы и psimctl проходят на Debian 13 x86_64 без toolchain; все зависимости от системных
          разделяемых библиотек разрешаются (ADR-032)
      /methods/73/name:
        source: Artifact execution on the target platform
        ru: Запуск артефактов на целевой платформе
      /methods/72/criteria:
        source: Every release artifact has a CycloneDX SBOM and a signature verified by the installer
        ru: Каждый артефакт выпуска имеет SBOM CycloneDX и подпись, проверяемую установщиком
      /methods/72/name:
        source: SBOM and artifact signatures
        ru: SBOM и подписи артефактов
      /methods/2/criteria:
        source: Real PKCE with TOTP, audit search and pagination, independent verification of downloaded JSONL, exact detection
          of modified and deleted PostgreSQL records, denial of access to another site, role revocation with the previous
          JWT, reference metrics for 30 days in under three seconds and matching CSV
        ru: Реальный PKCE с TOTP, поиск и страницы аудита, независимая проверка скачанного JSONL, точное обнаружение изменения
