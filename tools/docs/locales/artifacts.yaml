          removed materials; record elapsed time and findings
        ru: По каждой полной версии EN и RU независимо, с английским по умолчанию, без помощи разработчиков и без доступа
          к плану, прогрессу и стартовым диаграммам разработки; проверяются конечное состояние платформы и отсутствие прямых
          и косвенных ссылок на удалённые материалы; время и замечания фиксируются
      /methods/37/criteria:
        source: Command request -> connector delivery p99 <= 200 ms; every command reaches a final status
        ru: p99 от запроса команды до доставки коннектору ≤ 200 мс; каждая команда получает финальный статус
      /methods/37/name:
        source: Command delivery to the connector
        ru: Доставка команд коннектору
      /methods/90/name:
        source: Installation and connector integration by an independent engineer
        ru: Установка и подключение коннектора сторонним инженером
      /methods/89/purpose:
        source: Platform mechanisms for SR-01, SR-03, SR-04, SR-08, SR-09; the complete service lifecycle remains in TS-22
        ru: Платформенные механизмы SR-01, SR-03, SR-04, SR-08, SR-09; полный сервисный цикл остаётся в TS-22
      /methods/36/purpose:
        source: Incident stage latency budget (signal processing)
        ru: Бюджет задержки этапа инцидентов (Обработка сигналов)
      /methods/89/criteria:
        source: JWT/JWKS and key rotation, rejection of incorrect issuer/audience/algorithm, TLS/mTLS with CA/name/CRL verification,
          renewal without losing test events, revocation of an active stream, expiry and protected secret files; real Keycloak,
          Kafka, PostgreSQL and Valkey; ASan/UBSan and TSan
        ru: JWT/JWKS и ротация, отказ чужому issuer/audience/алгоритму, TLS/mTLS с проверкой CA/имени/CRL, продление без потери
          тестовых событий, отзыв открытого потока, истечение и защищённые файлы секретов; реальные Keycloak, Kafka, PostgreSQL
          и Valkey; ASan/UBSan и TSan
      /methods/36/criteria:
        source: Two instances; signal processing p99 <= 50 ms; signal and incident reconciliation finds no loss or duplicates
          after an instance receives SIGKILL
        ru: Два экземпляра; p99 обработки сигнала ≤ 50 мс; сверка сигналов и инцидентов без потерь и дубликатов после SIGKILL
          экземпляра
      /methods/89/name:
        source: Platform trust and authentication
        ru: Платформенное доверие и аутентификация
      /methods/36/name:
        source: Incident Service signal processing
        ru: Обработка сигналов Incident Service
      /methods/88/purpose:
        source: Requirement SR-08
        ru: Требование SR-08
      /methods/35/purpose:
        source: Target load for the single-machine topology (scaling.md, 5.4)
        ru: Целевая нагрузка топологии «одна машина» (scaling.md, 5.4)
      /methods/88/criteria:
        source: testssl.sh checks external ports; only TLS 1.3 on TB1 and TB2, with no weak cipher suites
        ru: testssl.sh по внешним портам - только TLS 1.3 на TB1 и TB2, без слабых наборов
      /methods/35/criteria:
        source: 10 000 events/s on the reference server with cluster latency SLOs
        ru: 10 000 событий/с на эталонном сервере с SLO задержек кластера
      /methods/88/name:
        source: TLS configuration
        ru: Конфигурация TLS
      /methods/35/name:
        source: Single-machine LOAD-10K
        ru: Нагрузка одной машины LOAD-10K
      /methods/87/purpose:
        source: Security requirements verified by penetration testing and scanning
        ru: Требования безопасности, проверка pentest и scan
      /methods/34/criteria:
        source: Report generation takes <= 3 s; values match the reference
        ru: Отчёт строится ≤ 3 с; значения совпадают с эталоном
      /methods/5/criteria:
        source: 10000 incidents, scrolling at least 50 frames/s, realtime -> DOM p99 at most 1 s; raw measurement series and
          one browser worker
        ru: 10000 инцидентов, прокрутка не ниже 50 кадров/с, realtime -> DOM не выше 1 с p99; сырые серии и один браузерный
          worker
      /methods/34/name:
        source: Report covering 30 days
        ru: Отчёт за 30 суток
      /methods/87/criteria:
        source: OWASP ZAP scans OpenAPI and realtime; no high-severity findings
        ru: OWASP ZAP по OpenAPI и realtime; нет находок высокого уровня
      /methods/87/name:
        source: REST and WebSocket DAST
        ru: DAST REST и WebSocket
      /methods/33/criteria:
        source: Metrics match reference values; retries and recomputation preserve results; roles and access scopes are enforced
        ru: Метрики совпадают с эталоном; повторы и пересчёт не меняют результат; роли и области соблюдены
      /methods/108/purpose:
        source: Compatible change delivery, node-independent resumption and bounded queues
        ru: Совместимая доставка изменений, независимое от узла возобновление и ограничение очередей
      /methods/86/criteria:
        source: Rule DSL parser and validator run for 10 minutes without crashes or sanitizer findings; retain the corpus
          and report
        ru: Парсер и валидатор DSL правил проходят 10 минут без падений и ошибок санитайзеров; корпус и отчёт сохранены
      /methods/33/purpose:
        source: Metrics, authorization, retries and fact recomputation for the reporting API
        ru: Метрики, авторизация, повторы и пересчёт фактов для API отчётов
      /methods/7/name:
        source: Server operations for the operational interface
        ru: Серверные операции оперативного интерфейса
      /methods/108/criteria:
        source: Two Gateways, 500 WSS clients and 10000 deliveries without loss; local p99 <= 200 ms; restore 500 subscriptions
          after a node restart without a new snapshot; filters, JWT, old clients, multiple subscriptions, private variants,
          current state after lease expiry and slow-consumer disconnection
        ru: Два Gateway, 500 WSS-клиентов и 10000 доставок без потерь; локальный p99 не выше 200 мс; восстановление 500 подписок
          после перезапуска узла без нового снимка; фильтры, JWT, старый клиент, несколько подписок, приватные варианты, актуальное
          состояние после lease expiry и отключение медленного получателя
      /methods/86/name:
        source: Rule parser and validator fuzzing for 10 minutes
        ru: Фаззинг парсера и валидатора правил, 10 мин
      /methods/33/name:
        source: Incident facts and reporting
        ru: Факты инцидентов и отчётность
      /methods/6/purpose:
        source: Verify session isolation and the shared shell without mixing users' operational data
        ru: Проверить изоляцию сессий и общую оболочку без смешивания рабочих данных пользователей
      /methods/108/name:
        source: Realtime subscriptions, recovery and 500 clients
        ru: Realtime подписки, восстановление и 500 клиентов
      /methods/85/criteria:
        source: Every untrusted-data parser and the rule DSL run for 24 hours without crashes
        ru: Все разборщики недоверенных данных и DSL правил 24 ч без падений
      /methods/32/criteria:
        source: Search one day of data for a zone within 500 ms while writing 50 000 events/s to ClickHouse
        ru: Поиск за сутки по зоне ≤ 500 мс при записи 50 000 событий/с в ClickHouse
      /methods/107/purpose:
        source: Consistent console snapshots, state freshness and safe recovery
        ru: Согласованные снимки консоли, актуальность состояния и безопасное восстановление
      /methods/85/name:
        source: Fuzzing for 24 hours
        ru: Фаззинг, 24 ч
      /methods/32/name:
        source: Event history search under write load
        ru: Поиск по истории событий под нагрузкой записи
      /methods/107/criteria:
        source: Real Kafka, PostgreSQL, Valkey and HTTPS; access scopes, independent observation and report cursors, duty,
          maintenance, PostgreSQL fallback, rebuild equality and rejection of incomplete history; local update p99 <= 100
          ms
        ru: Настоящие Kafka, PostgreSQL, Valkey и HTTPS; области доступа, независимые курсоры наблюдений и отчётов, дежурство,
          обслуживание, fallback к PostgreSQL, равенство перестроения и отказ неполной истории; локальный p99 обновления не
          выше 100 мс
      /methods/31/criteria:
        source: Import completes within 5 minutes; consumers receive catalog changes within 2 s
        ru: Импорт ≤ 5 мин; изменения каталога у потребителей ≤ 2 с
      /methods/84/criteria:
        source: Every fuzz target runs for 1 hour without crashes; new crashing inputs are added to the corpus
        ru: Каждая цель фаззинга 1 ч без падений; новые падения сохраняются в корпус
      /methods/107/name:
        source: Shared console models and Kafka recovery
        ru: Общие модели консоли и восстановление Kafka
      /methods/84/name:
        source: Nightly fuzzing
        ru: Фаззинг, ночной
      /methods/31/name:
        source: Import of 50 000 devices
        ru: Импорт 50 000 устройств
      /methods/106/purpose:
        source: Complete incident context, search and durable retention extension
        ru: Полный контекст инцидента, поиск и долговечное продление хранения
      /methods/4/name:
        source: Operator console
        ru: Рабочая консоль оператора
      /methods/5/name:
        source: Virtualized operator feed
        ru: Виртуализированная лента оператора
  docs/security/threat-model.yaml:
    kind: security
    strings:
      /threats/43/title:
        source: Alarm concealment through maintenance mode
        ru: Сокрытие тревог через режим обслуживания
      /threats/21/residual:
        source: Compromise of an application node exposes the keys of services running on that node.
        ru: Компрометация узла приложений даёт доступ к ключам сервисов этого узла.
      /threats/42/residual:
        source: Sources without snapshots remain unknown until a confirmed observation.
        ru: Источники без снимка остаются unknown до подтверждённого наблюдения.
      /threats/21/scenario:
        source: An unauthorized process calls service APIs while bypassing API Gateway.
        ru: Посторонний процесс вызывает API сервисов, минуя API Gateway.
      /threats/42/scenario:
        source: Old buffered events or a snapshot overwrite a recent alarm and incorrectly show the device as healthy.
        ru: Старые события из буфера или снимок перезаписывают свежую тревогу и показывают оператору устройство как исправное.
      /threats/21/title:
        source: Service impersonation on the internal network
        ru: Подмена сервиса во внутренней сети
      /threats/42/title:
        source: Incorrect current state after reconnection
        ru: Ложное актуальное состояние после восстановления связи
      /threats/20/residual:
        source: An external URL with an allowed scheme may still point to a malicious site.
        ru: Ссылка на внешний ресурс с допустимой схемой может вести на вредоносный сайт.
      /threats/41/residual:
        source: None with validation, limits and private storage access.
        ru: Нет при валидации, лимитах и закрытом доступе к хранилищу.
      /threats/20/scenario:
        source: An incident receives a link to a phishing site or a URL using the javascript scheme.
        ru: Ссылка на фишинговый ресурс или со схемой javascript добавлена к инциденту.
      /threats/41/scenario:
        source: An uploaded image causes excessive memory consumption, or an attacker bypasses the API to read another site's
          floor plan through a public bucket.
        ru: Загрузка изображения с чрезмерным расходом памяти либо обход API для чтения плана другой площадки через публичный
          bucket.
      /threats/20/title:
        source: Malicious links in incident attachments
        ru: Вредоносные ссылки во вложениях инцидентов
      /threats/41/title:
        source: Malicious floor plan file or access to another site's object
        ru: Вредоносный файл плана или доступ к чужому объекту
      /threats/19/residual:
        source: Collusion between two employees remains possible and is detectable through audit.
        ru: Сговор двух сотрудников; обнаруживается аудитом.
      /threats/40/residual:
        source: Address OS kernel vulnerabilities through distribution updates.
        ru: Уязвимости ядра ОС - через обновления дистрибутива.
      /threats/19/scenario:
        source: An operator or shift supervisor unlocks many doors or disarms a site.
        ru: Оператор или старший смены массово разблокирует двери или снимает объект с охраны.
      /threats/40/scenario:
        source: A service vulnerability grants root access on the node.
        ru: Уязвимость сервиса даёт root на узле.
      /threats/19/title:
        source: Abuse of critical commands by one employee
        ru: Злоупотребление критичными командами одним сотрудником
      /threats/40/title:
        source: Container escape and excessive process privileges
        ru: Выход из контейнера и избыточные привилегии процессов
      /threats/18/residual:
        source: Return RFC 9457 errors without stack traces or internal addresses.
        ru: Ошибки в формате RFC 9457 без стеков и внутренних адресов.
      /threats/39/residual:
        source: None when signatures are verified.
        ru: Нет при проверке подписи.
      /threats/18/scenario:
        source: API responses or errors disclose data outside the access scope or internal details.
        ru: Ответы API или ошибки содержат данные вне области доступа или внутренние подробности.
      /threats/39/scenario:
        source: Modified images or packages are installed instead of released artifacts.
        ru: Изменённые образы или пакеты устанавливаются вместо выпущенных.
      /threats/18/title:
        source: Excessive data disclosure
        ru: Избыточное раскрытие данных
      /threats/39/title:
        source: Release artifact substitution at the customer site
        ru: Подмена артефактов поставки у заказчика
      /threats/17/residual:
        source: Protection against a distributed attack from user networks is limited by the load balancer's capacity.
        ru: Распределённая атака из сети пользователей ограничивается возможностями балансировщика.
      /threats/38/residual:
        source: Compromise of a pinned version before its publication.
        ru: Компрометация закреплённой версии до её публикации.
      /threats/17/scenario:
        source: Excessive requests, expensive queries or numerous WebSocket connections overload the service.
        ru: Массовые запросы, тяжёлые выборки, множество соединений WebSocket.
      /threats/38/scenario:
        source: A malicious library version or tooling image enters the build.
        ru: Вредоносная версия библиотеки или образа инструмента попадает в сборку.
      /threats/17/title:
        source: API and realtime channel overload
        ru: Перегрузка API и realtime-канала
      /threats/38/title:
        source: Compromise of dependencies and build tools
        ru: Компрометация зависимостей и инструментов сборки
      /threats/16/residual:
        source: Actions performed under another person's compromised account (see T11).
        ru: Действия под чужой учётной записью при её компрометации (см. T11).
      /threats/37/residual:
        source: New sign-ins remain unavailable until Keycloak recovers; existing sessions work until their refresh tokens
          expire.
        ru: Новый вход невозможен до восстановления Keycloak; уже открытые сессии работают до истечения refresh-токена.
      /threats/16/scenario:
        source: An operator denies accepting an incident, skipping a step or sending a command.
        ru: Оператор отрицает, что принял инцидент, пропустил шаг или отправил команду.
      /threats/37/scenario:
        source: An IdP failure blocks sign-in and token refresh during an incident.
        ru: Отказ IdP блокирует вход и обновление токенов во время инцидента.
      /threats/16/title:
        source: Operator repudiation of performed actions
        ru: Отказ оператора от выполненных действий
      /threats/37/title:
        source: Keycloak unavailability
        ru: Недоступность Keycloak
      /threats/15/residual:
        source: None when output rendering rules are followed.
        ru: Нет при соблюдении правил вывода.
      /threats/36/residual:
        source: Compromise of Keycloak itself is outside the platform's scope.
        ru: Компрометация самого Keycloak - вне платформы.
      /threats/15/scenario:
        source: Event attributes, device names or comments contain HTML or scripts that execute in the console.
        ru: Атрибуты событий, названия устройств, комментарии содержат HTML или скрипт, исполняемый в консоли.
      /threats/36/scenario:
        source: The platform accepts substituted JWKS or tokens with alg none or an incorrect issuer.
        ru: Подмена JWKS, токены с alg none или чужим issuer принимаются платформой.
      /threats/15/title:
        source: Script injection through connector and user data
        ru: Внедрение скрипта через данные коннекторов и пользователей
      /threats/36/title:
        source: Token forgery through the IdP
        ru: Подделка токенов через IdP
      /threats/14/residual:
        source: None; the browser does not send the token automatically.
        ru: Нет, токен не передаётся браузером автоматически.
      /threats/35/residual:
        source: Content of administrator-defined templates.
        ru: Содержимое шаблонов, заданных администратором.
      /threats/14/scenario:
        source: A third-party site sends a request on behalf of an authenticated user.
        ru: Сторонний сайт отправляет запрос от имени вошедшего пользователя.
      /threats/35/scenario:
        source: Emails and webhooks contain personal data and incident details.
        ru: Электронные письма и webhook содержат персональные данные и подробности инцидентов.
      /threats/14/title:
        source: Cross-site request forgery
        ru: Подделка межсайтовых запросов
      /threats/35/title:
        source: Data leakage in notifications
        ru: Утечка данных в уведомлениях
      /threats/13/residual:
        source: None with a complete authorization test matrix.
        ru: Нет при полной матрице тестов прав.
      /threats/34/residual:
        source: An allowlisted destination may be compromised on the recipient's side.
        ru: Разрешённые адреса из списка могут быть скомпрометированы на стороне получателя.
      /threats/13/scenario:
        source: Administration methods are called with an operator role token.
        ru: Вызов методов администрирования с токеном роли operator.
      /threats/34/scenario:
        source: An administrator or an attacker with administrator privileges specifies an internal service or metadata address
          and gains access to the internal network.
        ru: Администратор или злоумышленник с его правами указывает адрес внутреннего сервиса или метаданных и получает доступ
          во внутреннюю сеть.
      /threats/13/title:
        source: Operator execution of administrator actions
        ru: Выполнение действий администратора оператором
      /threats/34/title:
        source: SSRF through webhook and automatic step addresses
        ru: SSRF через адреса webhook и автоматических шагов
      /threats/12/residual:
        source: None with a complete authorization test matrix.
        ru: Нет при полной матрице тестов прав.
      /threats/33/residual:
        source: The node's OS administrator can access secrets in process memory.
        ru: Секреты в памяти процессов доступны администратору ОС узла.
      /threats/12/scenario:
        source: An operator supplies the identifier of an incident, device or zone outside their access scope.
        ru: Оператор подставляет идентификатор инцидента, устройства или зоны вне своей области доступа.
      /threats/33/scenario:
        source: Passwords and keys appear in logs, traces or support bundles.
        ru: Пароли и ключи попадают в журналы, трассировки или пакет для поддержки.
      /threats/12/title:
        source: Access to another site's incidents
        ru: Доступ к инцидентам чужой площадки
      /threats/33/title:
        source: Secret leakage through configuration, logs and diagnostic bundles
        ru: Утечка секретов из конфигурации, логов и диагностических пакетов
      /threats/11/residual:
        source: A stolen token is valid for no longer than 5 minutes.
        ru: Украденный токен действует не дольше 5 мин.
      /threats/32/residual:
        source: None.
        ru: Нет.
      /threats/11/scenario:
        source: A token is extracted through XSS, proxy logs or browser history.
        ru: Токен извлекается через XSS, журналы прокси или историю браузера.
      /threats/32/scenario:
        source: DLQ reprocessing or event replay creates false incidents while bypassing authorization.
        ru: Повторная обработка DLQ или проигрывание событий для создания ложных инцидентов в обход прав.
      /threats/11/title:
        source: Access token theft
        ru: Кража токена доступа
      /threats/32/title:
        source: Abuse of administration tools
        ru: Злоупотребление инструментами администрирования
      /threats/10/residual:
        source: MFA is optional for the operator role and configured by the customer.
        ru: Для роли operator MFA не обязательна (настраивается заказчиком).
      /threats/31/residual:
        source: None.
        ru: Нет.
      /threats/10/scenario:
        source: An operator, administrator or shift supervisor password is phished or guessed.
        ru: Фишинг или подбор пароля оператора, администратора или старшего смены.
      /threats/31/scenario:
        source: An administrator denies changing rules, scenarios or permissions.
        ru: Администратор отрицает изменение правил, сценариев или прав.
      /threats/10/title:
        source: Credential theft or guessing
        ru: Кража или подбор учётных данных
      /threats/31/title:
        source: Repudiation of configuration changes
        ru: Отказ от изменений конфигурации
      /threats/9/residual:
        source: The integrator is responsible for protecting the connector node; the SDK creates files accessible only to
          its own user.
        ru: Защита узла коннектора - ответственность интегратора; SDK создаёт файлы с правами только для своего пользователя.
      /threats/30/residual:
        source: Subtle rule condition changes without disabling the rule are detectable only by reviewing audited changes.
        ru: Тонкие изменения условий правил без отключения обнаруживаются только ревью изменений в аудите.
      /threats/9/scenario:
        source: A local user on the connector node reads or modifies the buffer file.
        ru: Локальный пользователь узла коннектора читает или меняет файл буфера.
      /threats/30/scenario:
        source: An administrator disables a fire alarm rule or changes a mapping so that alarms become info events.
        ru: Администратор отключает правило пожарной тревоги или меняет отображение так, что тревоги становятся info.
      /threats/9/title:
        source: Reading or modifying the SDK buffer on a connector node
        ru: Чтение или изменение буфера SDK на узле коннектора
      /threats/30/title:
        source: Suppressing response through configuration changes
        ru: Подавление реакции изменением конфигурации
      /threats/8/residual:
        source: Replays with new identifiers and sequence numbers cannot be distinguished from new events (see T02).
        ru: Повтор с новыми идентификаторами и номерами не отличим от новых событий (см. T02).
      /threats/29/residual:
        source: Customer firewall misconfiguration; checked by the installer.
        ru: Ошибка конфигурации межсетевого экрана у заказчика; проверяется установщиком.
      /threats/8/scenario:
        source: Previously recorded events are resent to create false incidents.
        ru: Повторная отправка записанных ранее событий для создания ложных инцидентов.
      /threats/29/scenario:
        source: Redis, ClickHouse, Kafka or PostgreSQL are reachable from user or site networks.
        ru: Redis, ClickHouse, Kafka или PostgreSQL доступны из сетей пользователей или объектов.
      /threats/8/title:
        source: Replay of old events
        ru: Повтор старых событий
      /threats/29/title:
        source: Exposed storage without authentication
        ru: Открытые хранилища без аутентификации
      /threats/7/residual:
        source: None; the protocol accepts no commands initiated by connectors, and delivery targets only the session serving
          the device.
        ru: Нет, протокол не содержит команд от коннектора, а доставка идёт только в сессию обслуживающего коннектора.
      /threats/28/residual:
        source: None when write access is restricted.
        ru: Нет при закрытой записи.
      /threats/7/scenario:
        source: A connector attempts to initiate commands or receive commands for another connector's devices.
        ru: Коннектор пытается инициировать команды или получить команды для устройств другого коннектора.
      /threats/28/scenario:
        source: Registering an incompatible schema breaks consumers.
        ru: Регистрация несовместимой схемы ломает потребителей.
      /threats/7/title:
        source: Connector control of another connector's devices
        ru: Коннектор управляет чужими устройствами
      /threats/28/title:
        source: Schema tampering in Schema Registry
        ru: Подмена схем в Schema Registry
      /threats/6/residual:
        source: Address parsing vulnerabilities in third-party libraries (gRPC, protobuf) by updating dependencies.
        ru: Ошибки разбора в сторонних библиотеках (gRPC, protobuf) - через обновление зависимостей.
      /threats/27/residual:
        source: Incorrect sizing requires operations staff to intervene before disks fill.
        ru: Ошибка сайзинга требует вмешательства эксплуатации до заполнения.
      /threats/6/scenario:
        source: Oversized or malformed messages crash the gateway.
        ru: Сообщения огромного размера или с некорректной структурой роняют шлюз.
      /threats/27/scenario:
        source: Event traffic or growing history fills Kafka, PostgreSQL or ClickHouse disks and stops the pipeline.
        ru: Поток событий или рост истории заполняет диски Kafka, PostgreSQL или ClickHouse и останавливает конвейер.
      /threats/6/title:
        source: Malicious protocol messages
        ru: Вредоносные сообщения протокола
      /threats/27/title:
        source: Storage disk exhaustion
        ru: Исчерпание дисков хранилищ
      /threats/5/residual:
        source: Each connector's throughput remains bounded by its configured limit.
        ru: Пропускная способность одного коннектора ограничена его лимитом.
      /threats/26/residual:
        source: None when parameterized query rules are followed.
        ru: Нет при соблюдении правила параметризованных запросов.
      /threats/5/scenario:
        source: A faulty or malicious connector exceeds event limits and displaces other sources.
        ru: Неисправный или злонамеренный коннектор отправляет события сверх лимитов и вытесняет другие источники.
      /threats/26/scenario:
        source: Search filters or event attributes alter query semantics.
        ru: Фильтры поиска или атрибуты событий меняют смысл запроса.
      /threats/5/title:
        source: Connector event flood
        ru: Поток событий от коннектора
      /threats/26/title:
        source: Injection into PostgreSQL and ClickHouse queries
        ru: Инъекция в запросы к PostgreSQL и ClickHouse
      /threats/4/residual:
        source: None with correct TLS configuration.
        ru: Нет при корректной настройке TLS.
      /threats/25/residual:
        source: If the customer declines disk encryption, data on the media remains in plaintext.
        ru: При отказе заказчика от шифрования дисков - открытые данные на носителях.
      /threats/4/scenario:
        source: An attacker reads access-control events containing personal data on the site's network.
        ru: Чтение событий СКУД с персональными данными в сети объекта.
      /threats/25/scenario:
        source: Storage node disks or backup files are copied.
        ru: Копирование дисков узлов хранилищ или файлов резервных копий.
      /threats/4/title:
        source: Eavesdropping on the event stream
        ru: Прослушивание потока событий
      /threats/25/title:
        source: Data theft from storage media and backups
        ru: Хищение данных с носителей и резервных копий
      /threats/3/residual:
        source: Individual event signatures by connectors are not included in the MVP.
        ru: Подписи отдельных событий коннектором не вводятся в MVP.
      /threats/24/residual:
        source: Integrity verification detects changes but cannot prevent them.
        ru: Изменение не предотвращается, но обнаруживается проверкой целостности.
      /threats/3/scenario:
        source: A dispute arises over whether a connector sent an event or a command result.
        ru: Спор о том, присылал ли коннектор событие или результат команды.
      /threats/24/scenario:
        source: An administrator with superuser privileges changes or deletes audit records.
        ru: Администратор с правами суперпользователя меняет или удаляет записи аудита.
      /threats/3/title:
        source: Integrator repudiation of sent events and command results
        ru: Отказ интегратора от отправленных событий и результатов команд
      /threats/24/title:
        source: Database administrator modification of the audit log
        ru: Изменение журнала аудита администратором БД
      /threats/2/residual:
        source: None with correct TLS configuration.
        ru: Нет при корректной настройке TLS.
      /threats/23/residual:
        source: Services with broad read access (Projection Service, API Gateway) legitimately see most data.
        ru: Сервисы с широким чтением (Projection Service, API Gateway) видят большую часть данных по назначению.
      /threats/2/scenario:
        source: An attacker in the site's network modifies events or commands in transit.
        ru: Атакующий в сети объекта изменяет события или команды в канале.
      /threats/23/scenario:
        source: A compromised service reads topics and database schemas it does not need.
        ru: Скомпрометированный сервис читает топики и схемы БД, не нужные ему.
      /threats/2/title:
        source: Interception and modification of connector traffic
        ru: Перехват и изменение трафика коннектора
      /threats/23/title:
        source: Service access to unrelated data
        ru: Чтение чужих данных сервисом
      /threats/1/residual:
        source: Plausible false events cannot be distinguished at the protocol level; correlate multiple sources and monitor
          sequence gaps to reduce the risk.
        ru: Правдоподобные ложные события не отличимы на уровне протокола; снижается корреляцией нескольких источников и контролем
          разрывов номеров.
      /threats/22/residual:
        source: A service can forge messages in its own topics.
        ru: Сервис может подделывать сообщения в своих топиках.
      /threats/1/scenario:
        source: A connector generates false alarms to distract operators or suppresses real events.
        ru: Коннектор генерирует ложные тревоги для отвлечения или подавляет реальные события.
      /threats/22/scenario:
        source: A compromised service publishes forged signals, incidents or commands.
        ru: Скомпрометированный сервис публикует поддельные сигналы, инциденты или команды.
      /threats/1/title:
        source: False events from a compromised connector
        ru: Ложные события скомпрометированного коннектора
      /threats/22/title:
        source: Writing to another service's topics
        ru: Запись в чужие топики
      /threats/0/residual:
        source: Until revocation, the attacker can send events for the connector's sources; session audits and anomaly detection
          help identify this.
        ru: До отзыва сертификата атакующий может слать события источников этого коннектора; обнаруживается по аудиту сессий
          и аномалиям.
      /threats/0/scenario:
        source: An attacker with a connector certificate connects and sends events on behalf of that connector.
        ru: Злоумышленник с сертификатом коннектора подключается и отправляет события от его имени.
      /threats/0/title:
        source: Connector impersonation with a stolen certificate
        ru: Подмена коннектора украденным сертификатом
      /requirements/37/text:
        source: The shell validates PKCE state, nonce and the configured issuer's ID token, stores tokens only in memory,
          coalesces concurrent refreshes and clears data on logout. Role-specific navigation does not replace server authorization.
          When scope changes, acquiring a new cursor clears the previous snapshot before reading a new one.
        ru: Оболочка проверяет PKCE state, nonce и ID token настроенного issuer, хранит токены только в памяти, объединяет
          конкурентные refresh и очищает данные при выходе. Ролевые ссылки не заменяют серверную авторизацию; восстановление
          нового курсора при изменении области очищает прежний снимок до чтения нового.
      /requirements/36/text:
        source: Exercises have separate state, owner, version and expiry. Training actions cannot create production commands,
          incidents or notifications. Presence grants no business permissions; leases are bounded by time and generation identifier.
          Alarm suppression requires shift supervisor permission, a reason and an end time.
        ru: Учения имеют отдельное состояние, владельца, версию и срок; учебное действие не создаёт рабочие команды, инциденты
          и уведомления. Присутствие не предоставляет бизнес-права, lease ограничен временем и идентификатором поколения;
          подавление тревоги требует права старшего смены, причины и окончания.
      /requirements/35/text:
        source: The assistant receives only server-provided facts within the user's current scope, without bearer tokens or
          tools. An administrator configures the endpoint and model. Enforce response time and size limits and server-provided
          source links. Recheck permissions and source version after the response; failure preserves the original authorized
          facts.
        ru: Ассистент получает только серверные факты текущей области пользователя, не получает bearer и инструменты; адрес
          и модель задаёт администратор. Ответ ограничен сроком, размером и серверными ссылками на источники. После ответа
          повторно проверяются права и версия источника; отказ сохраняет исходные разрешённые факты.
      /requirements/34/text:
        source: Diagnostic replay is restricted to the requester's scope and isolated through separate ACLs, topics, consumer
          groups and storage. Its executor cannot write production signals, incidents, commands or notifications, or call
          HTTP, SMTP or devices. Audit every run. Projection recovery and production DLQ processing are separate authorized
          operations.
        ru: Диагностический replay ограничен областью инициатора и изолирован отдельными ACL, топиками, consumer groups и
          хранилищами. Исполнитель не может писать рабочие сигналы, инциденты, команды и уведомления и вызывать HTTP/SMTP/устройства.
          Запуск аудируется. Восстановление проекции и рабочий DLQ - отдельные авторизованные операции.
      /requirements/33/text:
        source: Incident handover requires recipient confirmation and checks of role, scope and version. The previous operator
          remains responsible until confirmation. Retries are idempotent; SLA and response scenario are preserved. Only a
          shift supervisor within the relevant scope may assign duty or force reassignment. Audit every action.
        ru: Передача инцидента требует подтверждения получателя, проверки роли, области и версии; до подтверждения отвечает
          прежний оператор. Повторы идемпотентны, SLA и сценарий сохраняются. Назначение дежурного и принудительное переназначение
          выполняет старший смены своей области; все действия аудируются.
      /requirements/32/text:
        source: Maintenance is available to administrators within their scope and requires an end time, reason, owner and
          explicit policy. Fire events and P1 are never suppressed. History is retained; open incidents and SLAs remain unchanged.
          Automatic completion survives restarts and is audited.
        ru: Обслуживание доступно администратору своей области, имеет обязательный срок окончания, причину, ответственного
          и явную политику. Пожарные события и P1 не подавляются; история не удаляется; открытые инциденты и SLA не меняются.
          Автоматическое завершение переживает перезапуск и отражается в аудите.
      /requirements/31/text:
        source: Device state is separate from connectivity and actual/stale/unknown quality. Loss of connectivity requires
          fresh confirmation; old events and snapshots cannot improve freshness. Reconciliation considers source sequence
          and epoch. Filter snapshots and deltas by access scope.
        ru: Состояние устройства отделено от связи и качества actual/stale/unknown. Потеря связи требует нового подтверждения;
          старые события и снимки не повышают свежесть. Сверка учитывает последовательность и эпоху источника. Снимки и дельты
          фильтруются по области доступа.
      /requirements/30/text:
        source: Accept floor plans only as PNG/JPEG up to 20 MB, checking file signatures, decoding and pixel limits. The
          platform generates object names; the bucket is private. Reads and writes enforce RBAC and access scope. Independent
          backups include versions and SHA-256.
        ru: Поэтажные планы принимаются только как PNG/JPEG до 20 МБ с проверкой сигнатуры, декодирования и предела пикселей.
          Имена объектов генерируются платформой; bucket закрыт. Чтение и запись проходят RBAC и область доступа; версии и
          SHA-256 входят в независимое резервное копирование.
      /requirements/29/text:
        source: Security monitoring alerts on spikes in failed logins, connector rejections and access denials, disabled rules,
          failed periodic audit integrity checks and certificates expiring within 30 days.
        ru: 'Мониторинг безопасности: алерты на всплески неудачных входов, отказов коннекторам и отказов в доступе, отключение
          правил, ошибки периодической проверки целостности аудита, истечение сертификатов (за 30 дней).'
      /requirements/28/text:
        source: Harden the deployment with a minimal OS package set, dedicated service users and systemd restrictions (NoNewPrivileges,
          ProtectSystem and PrivateTmp). Do not use privileged containers. The Keycloak administration console must be inaccessible
          from user networks.
        ru: 'Усиление защиты: минимальный набор пакетов ОС; сервисы под выделенными пользователями с ограничениями systemd
          (NoNewPrivileges, ProtectSystem, PrivateTmp); контейнеры без privileged; административная консоль Keycloak недоступна
          из сетей пользователей.'
      /requirements/27/text:
        source: Sign release artifacts (images and packages). The installer verifies signatures before installation and upgrades.
          Run containers without root, with a read-only filesystem where possible and without unnecessary capabilities.
        ru: Артефакты выпуска (образы, пакеты) подписываются; установщик проверяет подписи перед установкой и обновлением;
          контейнеры работают без root, с файловой системой только для чтения где возможно и без лишних capabilities.
      /requirements/26/text:
        source: Pin dependencies in lockfiles (Conan, pnpm and buf.lock), and base and tooling images by digest. Produce a
          CycloneDX SBOM. CI checks licenses and vulnerabilities, blocking critical and high findings. Builds must be reproducible.
        ru: Зависимости зафиксированы lock-файлами (Conan, pnpm, buf.lock); базовые образы и образы инструментов закреплены
          по дайджесту; SBOM CycloneDX; проверка лицензий и уязвимостей в CI блокирует критичные и высокие; воспроизводимые
          сборки.
      /requirements/25/text:
        source: Recommend full-disk encryption on storage nodes; the installer checks it and warns when absent. Encrypt PostgreSQL,
          ClickHouse and configuration backups.
        ru: 'Шифрование хранимых данных: полнодисковое шифрование узлов хранилищ рекомендуется и проверяется установщиком
          с предупреждением; резервные копии PostgreSQL, ClickHouse и конфигурации шифруются.'
      /requirements/24/text:
        source: Minimize personal data. By default, replace access-control card identifiers with a keyed HMAC during normalization.
          Exclude personal data from logs, apply RetentionSettings, use notification templates without personal data and audit
          data exports.
        ru: 'Минимизация персональных данных: идентификаторы карт СКУД по умолчанию заменяются ключевым HMAC при нормализации;
          персональные данные не пишутся в логи; сроки хранения по RetentionSettings; шаблоны уведомлений без персональных
          данных; экспорт данных - в аудите.'
      /requirements/23/text:
        source: Only the installer and CI may write schemas to Schema Registry. Services have read-only access. Configure
          compatibility rules for every subject.
        ru: Запись схем в Schema Registry - только установщик и CI; сервисы имеют права только на чтение; правила совместимости
          заданы на всех subject.
      /requirements/22/text:
        source: Outbound calls (webhooks, automatic steps and SMTP) may target only addresses in the administrator's allowlist.
          Reject private, loopback, link-local and metadata addresses by default, checking after DNS resolution. Verify TLS,
          sign webhooks with HMAC-SHA256, and enforce timeouts and response size limits.
        ru: Исходящие вызовы (webhook, автоматические шаги, SMTP) - только на адреса из списка, заданного администратором;
          частные, loopback, link-local диапазоны и адреса метаданных запрещены по умолчанию, проверка после разрешения DNS;
          проверка TLS; подпись webhook HMAC-SHA256; тайм-ауты и ограничение размера ответа.
      /requirements/21/text:
        source: Storage and internal ports are reachable only within the platform network. The installer provides a firewall
          rule template. Kafka, PostgreSQL, Redis-compatible storage and ClickHouse require authentication and TLS. Generate
          service-specific Kafka ACLs from the topic registry, allowing writes only to the service's own topics. Use separate
          PostgreSQL roles and ClickHouse users per service with minimum permissions.
        ru: Хранилища и внутренние порты доступны только во внутренней сети платформы; установщик выдаёт шаблон правил межсетевого
          экрана; Kafka, PostgreSQL, Redis-совместимое хранилище и ClickHouse требуют аутентификации и TLS; ACL Kafka по сервисам
          генерируются из реестра топиков (запись - только в свои топики); роли PostgreSQL и пользователи ClickHouse - по
          сервисам с минимальными правами.
      /requirements/20/text:
        source: Protect alarm response availability with alerts on pipeline lag and event -> console latency SLO violations.
          The console indicates loss of connectivity. Per-connector limits prevent a source from displacing others. Runbooks
          describe degraded operation.
        ru: 'Доступность реакции на тревоги: алерты на лаг конвейера и нарушение SLO задержки событие -> консоль; консоль
          показывает потерю связи; лимиты на коннектор не дают одному источнику вытеснить остальные; поведение при деградации
          описано в runbook.'
      /requirements/19/text:
        source: Prevent resource exhaustion through bounded queues and backpressure, Kafka client quotas, disk utilization
          monitoring for Kafka, PostgreSQL and ClickHouse with alerts at 70% and 85%, and enforced retention.
        ru: 'Защита от исчерпания ресурсов: ограниченные очереди и противодавление вместо неограниченного роста; квоты клиентов
          Kafka; контроль заполнения дисков Kafka, PostgreSQL, ClickHouse с алертами на 70% и 85%; принудительный retention.'
      /requirements/18/text:
        source: Protect the API and realtime channel with per-user and per-endpoint rate limits, a maximum page size of 1000,
          request deadlines, at most 5 WebSocket connections per user, disconnection of slow clients and export size limits.
        ru: 'Защита API и realtime: лимиты частоты на пользователя и эндпоинт, размер страницы не больше 1000, дедлайны запросов,
          не больше 5 WebSocket-соединений на пользователя, отключение медленных клиентов, ограничение размера экспорта.'
      /requirements/17/text:
        source: Protect ingestion with credits, per-connector event rate limits, batch and message limits, one active session
          per connector and a connection limit per gateway. On SDK buffer overflow, evict info events first and emit system.connector.buffer_overflow.
          Never evict alarm or fault events.
        ru: 'Защита ввода: кредиты, лимит событий в секунду на коннектор, ограничения пакета и сообщения, одна активная сессия
          на коннектор, лимит соединений на шлюз; при переполнении буфера SDK первыми вытесняются события info и порождается
          system.connector.buffer_overflow; события классов alarm и fault не вытесняются.'
      /requirements/16/text:
        source: Prevent replay through event_id and source sequence deduplication, command deadlines and idempotent command_id,
          signed webhooks with a timestamp and a 5-minute acceptance window, and expiring realtime resume tokens bound to
          the user.
        ru: 'Защита от повторов: дедупликация по event_id и порядковым номерам источников; дедлайн и идемпотентный command_id
          у команд; подпись webhook с меткой времени и окном приёма 5 мин; токены возобновления realtime привязаны к пользователю
          и имеют срок действия.'
      /requirements/15/text:
        source: Render user and connector data as text in the web client, without inserting HTML. Use a strict CSP without
          inline scripts, X-Content-Type-Options, frame-ancestors 'none', and Referrer-Policy. Incident links allow only http
          and https with rel="noopener noreferrer".
        ru: 'Безопасный вывод в веб-клиенте: данные пользователей и коннекторов отображаются только как текст, без вставки
          HTML; строгий CSP без inline-скриптов; заголовки X-Content-Type-Options, frame-ancestors ''none'', Referrer-Policy;
          ссылки из инцидентов - только http и https с rel="noopener noreferrer".'
      /requirements/14/text:
        source: Access PostgreSQL and ClickHouse only through parameterized queries. Concatenating user input into query text
          is prohibited and checked by static analysis in CI.
        ru: Доступ к PostgreSQL и ClickHouse только параметризованными запросами; конкатенация пользовательского ввода в текст
          запроса запрещена и проверяется статическим анализом в CI.
      /requirements/13/text:
        source: Fuzz all parsers of untrusted data, including connector protocol decoding, CSV and JSON imports, rule and
          mapping expressions, and realtime frames. CI requires 10 crash-free minutes for the rule parser and validator. Release
          qualification requires a complete 24-hour run of every target.
        ru: 'Фаззинг всех разборщиков недоверенных данных: декодирование протокола коннекторов, импорт CSV и JSON, выражения
          правил и отображений, кадры realtime. Для парсера и валидатора правил в CI требуется 10 минут без падений; квалификация
          выпуска требует полного прогона всех целей по 24 ч.'
      /requirements/12/text:
        source: Validate all incoming messages with protovalidate at the boundary (Connector Gateway and API Gateway). Limit
          gRPC messages to 4 MB, event batches to 1 MB and 1000 events, and REST bodies to 1 MB (imports up to 100 MB, floor
          plans up to 20 MB). Reject unknown REST fields.
        ru: 'Все входящие сообщения проверяются правилами protovalidate на границе (шлюз коннекторов, API Gateway); ограничения
          размера: сообщение gRPC до 4 МБ, пакет событий до 1 МБ и 1000 событий, тело REST до 1 МБ (импорт до 100 МБ, план
          этажа до 20 МБ); неизвестные поля в REST отклоняются.'
      /requirements/11/text:
        source: Audit all user actions, access denials, configuration changes, connector session events (opening, rejection
          and revocation) and command lifecycle events. Maintain a hash chain and signed checkpoints outside the database.
          Database permissions prohibit UPDATE, DELETE and TRUNCATE (ADR-021).
        ru: Аудит всех действий пользователей, отказов в доступе, изменений конфигурации, событий сессий коннекторов (открытие,
          отказ, отзыв), жизненного цикла команд; цепочка хэшей и подписанные контрольные точки вне БД; права БД запрещают
          UPDATE, DELETE, TRUNCATE (ADR-021).
      /requirements/10/text:
        source: Secrets must not appear in plaintext configuration or environment variables accessible to other processes.
          Use files owned by the service user with mode 0400, or a secret store. Exclude secrets from logs, traces and diagnostic
          bundles. Store CA private keys and audit checkpoint signing keys separately with restricted access. Document rotation
          procedures. An automated test starts services with known test secrets, then verifies that their values are absent
          from logs, traces and the diagnostic bundle.
        ru: 'Секреты не хранятся открыто в конфигурации и переменных окружения, доступных другим процессам: только файлы с
          правами 0400 пользователя сервиса или хранилище секретов; секреты не попадают в логи, трассировки и диагностические
          пакеты; закрытые ключи УЦ и подписи контрольных точек аудита хранятся отдельно с ограниченным доступом; процедуры
          ротации документированы. Автоматический тест: сервисы запускаются с известными тестовыми секретами, затем логи,
          трассировки и диагностический пакет проверяются на отсутствие их значений.'
      /requirements/9/text:
        source: Require TLS 1.3 at external boundaries (TB1, TB2), and at least TLS 1.2 with AEAD suites inside the platform.
          Certificate verification is always enabled. No exposed port permits plaintext traffic. Enable HSTS for the web interface.
        ru: TLS 1.3 на внешних границах (TB1, TB2); внутри платформы - не ниже TLS 1.2 только с AEAD- наборами; проверка сертификатов
          всегда включена; открытых портов без TLS нет; HSTS для веб.
      /requirements/8/text:
        source: Administration tools (psimctl) authenticate as users through OIDC device flow and follow the same authorization
          model. No service account bypasses permissions. The emergency Keycloak account requires MFA; its use is audited
          and notifies administrators.
        ru: Инструменты администрирования (psimctl) аутентифицируются как пользователи (OIDC device flow) и подчиняются той
          же модели прав; служебных учётных записей в обход прав нет; аварийная учётная запись Keycloak защищена MFA, её использование
          в аудите и оповещает администраторов.
      /requirements/7/text:
        source: Response configuration changes (activating rule sets, publishing mappings and scenarios, escalation policies
          and archiving rules) require the admin role and an audit record describing the change. Disabling or archiving rules
          for incident types with default priority P1 or P2 immediately notifies shift supervisors.
        ru: Изменения конфигурации реакции (активация набора правил, публикация отображений и сценариев, политики эскалации,
          архивирование правил) доступны только роли admin, фиксируются в аудите с описанием изменения; отключение или архивирование
          правил для типов инцидентов с приоритетом по умолчанию P1 или P2 немедленно оповещает старших смены.
      /requirements/6/text:
        source: Commands require checks of device capabilities and the requester's access scope. Critical commands execute
          only after approval by a different shift supervisor (CM3). The connector protocol does not allow connectors to initiate
          commands. The gateway delivers a command only to the session of the connector serving that device.
        ru: 'Команды: проверка возможности устройства и области доступа инициатора; критичные команды исполняются только после
          подтверждения старшим смены, отличным от инициатора (CM3); протокол коннекторов не позволяет коннектору инициировать
          команды; шлюз доставляет команду только в сессию коннектора, обслуживающего устройство.'
      /requirements/5/text:
        source: Deny by default. Apply RBAC + ABAC in API Gateway and again in the owning service. Filter lists, search, realtime
          streams, reports and exports by access scope. Every denial produces an audit record (ADR-020).
        ru: 'Запрет по умолчанию: решение RBAC + ABAC в API Gateway и повторно в сервисе-владельце; фильтрация по области
          доступа в списках, поиске, realtime-потоке, отчётах и экспорте; каждый отказ - запись аудита (ADR-020).'
      /requirements/4/text:
        source: Store browser tokens only in memory, never in localStorage or sessionStorage, and never include them in URLs.
          Authenticate the realtime channel with its first frame. Allow CORS only for approved origins. Send tokens in the
          Authorization header to prevent CSRF.
        ru: Токены в браузере хранятся только в памяти (не в localStorage и sessionStorage) и никогда не передаются в URL;
          realtime-канал аутентифицируется первым кадром; CORS только для разрешённых источников; токен передаётся в заголовке
          Authorization, что исключает CSRF.
      /requirements/3/text:
        source: Service calls require mTLS with an internal CA and a service token (client credentials) or delegated user
          token. Each service independently validates the token and permissions.
        ru: 'Межсервисные вызовы: mTLS на внутреннем УЦ и токен сервиса (client credentials) или делегированный токен пользователя;
          каждый сервис сам проверяет токен и права.'
      /requirements/2/text:
        source: Token validation uses a fixed issuer, checks audience, permits only RS256 and ES256, and checks exp and nbf
          with at most 30 seconds of clock tolerance. JWKS is fetched only from the configured address over TLS and cached
          with key rotation. Access token lifetime is 5 minutes; refresh tokens rotate.
        ru: 'Проверка токенов: фиксированный issuer, проверка audience, разрешённые алгоритмы только RS256 и ES256, проверка
          exp и nbf с допуском не более 30 с; JWKS загружается только с настроенного адреса по TLS и кэшируется с ротацией
          ключей; срок токена доступа 5 мин, ротация refresh-токена.'
      /requirements/1/text:
        source: Users sign in only through Keycloak (OIDC Authorization Code + PKCE). Enforce a password policy with at least
          12 characters and lockout against guessing. MFA is mandatory for admin and supervisor roles. The session idle timeout
          is 30 minutes and maximum duration is 12 hours (configurable).
        ru: Пользователи входят только через Keycloak (OIDC Authorization Code + PKCE). Политика паролей (не короче 12 символов),
          блокировка при подборе, многофакторная аутентификация обязательна для ролей admin и supervisor; тайм-аут бездействия
          сессии 30 мин, максимальная длительность 12 ч (настраивается).
      /requirements/0/text:
        source: The connector authenticates only with an mTLS client certificate issued by the deployment operator's or organization's
          CA. Its fingerprint is bound to the connector registration in the catalog. Revocation immediately closes active
          sessions. Certificate lifetime is at most 1 year; rotation uses an overlap period (C1, C2).
        ru: Коннектор аутентифицируется только клиентским сертификатом mTLS, выпущенным УЦ оператора установки или организации;
          отпечаток сертификата привязан к регистрации коннектора в каталоге; отзыв закрывает открытые сессии немедленно;
          срок сертификата не более 1 года; ротация с перекрытием (C1, C2).
