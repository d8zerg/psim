      /methods/69/criteria:
        source: Unit, property and component tests pass under ASan+UBSan and TSan without findings
        ru: Unit, property, component тесты под ASan+UBSan и TSan без срабатываний
      /methods/69/name:
        source: Sanitizers
        ru: Санитайзеры
      /methods/68/criteria:
        source: Build with -Werror; clang-tidy reports no findings under the project profile
        ru: Сборка с -Werror; clang-tidy по профилю проекта без замечаний
      /methods/68/name:
