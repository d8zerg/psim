        ru: Алерты относятся к выбранной поставке; предупреждения и критические отказы имеют прямые ссылки на инструкции.
      /panels/17/title:
        source: Active Alerts
        ru: Активные алерты
      /panels/17/description:
        source: Pending alerts await the configured duration. Firing alerts require investigation. Watchdog confirms the notification
          pipeline is running.
        ru: Pending ещё ожидают выдержки. Firing требуют проверки. Watchdog подтверждает работу конвейера уведомлений.
      /panels/17/fieldConfig/defaults/noValue:
        source: '-'
        ru: '-'
      /panels/17/fieldConfig/overrides/0/properties/0/value/0/title:
        source: Remediation instructions
        ru: Инструкция устранения
      /panels/17/options/sortBy/0/displayName:
        source: Severity
        ru: Уровень
      /annotations/list/0/name:
        source: Alerts
        ru: Алерты
      /panels/17/fieldConfig/overrides/0/properties/1/value:
        source: Alert
        ru: Алерт
      /panels/17/fieldConfig/overrides/1/properties/0/value:
        source: Severity
        ru: Уровень
      /panels/17/fieldConfig/overrides/2/properties/0/value:
        source: State
        ru: Состояние
      /panels/17/fieldConfig/overrides/3/properties/0/value:
        source: Node
        ru: Узел
      /panels/17/fieldConfig/overrides/4/properties/0/value:
        source: Context
        ru: Контекст
      /links/7/title:
        source: RU
        ru: EN
  deploy/observability/rules.json:
    kind: alerts
    strings:
      /groups/0/rules/1/annotations/summary:
        source: The service instance is unavailable.
        ru: Экземпляр сервиса недоступен
      /groups/0/rules/1/annotations/description:
        source: Check the node, its readiness, dependencies, and any recent errors of the selected instance.
        ru: Проверить узел, readiness, зависимости и последние ошибки выбранного экземпляра.
      /groups/0/rules/2/annotations/summary:
        source: The infrastructure component is unavailable.
        ru: Компонент инфраструктуры недоступен
      /groups/0/rules/2/annotations/description:
        source: Check the component, node, TLS, and request duration. Compare the status of other replicas.
        ru: Проверить component, node, TLS и длительность запроса. Сравнить состояние остальных реплик.
      /groups/0/rules/3/annotations/summary:
        source: Node diagnostic collection is unavailable
        ru: Сбор диагностики узла недоступен
      /groups/0/rules/3/annotations/description:
        source: Check the agent, certificate, port 19443, and the availability of the node.
        ru: Проверить агент, сертификат, порт 19443 и доступность узла.
      /groups/0/rules/4/annotations/summary:
        source: Kafka replication is degraded
        ru: Нарушена репликация Kafka
      /groups/0/rules/4/annotations/description:
        source: Check the availability of brokers, ISRs, disks, and network errors.
        ru: Проверить доступность брокеров, ISR, диски и сетевые ошибки.
      /groups/0/rules/5/annotations/summary:
        source: Kafka consumer lag is increasing
        ru: Растёт отставание потребителя Kafka
      /groups/0/rules/5/annotations/description:
        source: Compare the input speed, processing speed, data age, and stopped partitions.
        ru: Сравнить входную скорость, скорость обработки, возраст данных и остановленные партиции.
      /groups/0/rules/6/annotations/summary:
        source: New records are being added to DLQ.
        ru: В DLQ поступают новые записи
      /groups/0/rules/6/annotations/description:
        source: Determine the stage, code, or topic; check the schema and errors of the original service.
        ru: Определить stage, code или topic; проверить схему и ошибки исходного сервиса.
      /groups/0/rules/7/annotations/summary:
        source: Processing of the partition has been stopped
        ru: Обработка партиции остановлена
      /groups/0/rules/7/annotations/description:
        source: Check the stage and recurring processing errors.
        ru: Проверить stage и повторяющиеся ошибки обработки.
      /groups/0/rules/8/annotations/summary:
        source: Event -> incident commit p99 exceeds 1 s
        ru: p99 событие -> фиксация инцидента превышает 1 с
      /groups/0/rules/8/annotations/description:
        source: Compare Kafka lag, Normalizer and Correlation Engine durations, incident transaction duration and PostgreSQL
          state.
        ru: Сравнить лаг Kafka, длительности Normalizer, Correlation Engine, транзакций инцидента и состояние PostgreSQL.
      /groups/0/rules/9/annotations/summary:
        source: Signals are published without recording incidents
        ru: Сигналы публикуются без фиксации инцидентов
      /groups/0/rules/9/annotations/description:
        source: Check signal consumer lag, Incident Service and PostgreSQL. Normal event traffic without rule matches does
          not trigger this alert.
        ru: Проверить lag потребителя сигналов, Incident Service и PostgreSQL. Обычный поток событий без срабатываний правил
          не вызывает этот алерт.
      /groups/0/rules/10/annotations/summary:
        source: ClickHouse loading is lagging
        ru: Загрузка ClickHouse отстаёт
      /groups/0/rules/10/annotations/description:
        source: Check pending batches, insertion errors, replication queue, parts and disks. Latest-record age alone does
          not indicate failure when there is no backlog.
        ru: Проверить pending batches, ошибки вставки, replication queue, parts и диски. Возраст последней записи без очереди
          не означает отказ.
      /groups/0/rules/11/annotations/summary:
        source: ClickHouse replication is interrupted
        ru: Нарушена репликация ClickHouse
      /groups/0/rules/11/annotations/description:
        source: Check Keeper, the availability of the second replica, queue errors, and available space.
        ru: Проверить Keeper, доступность второй реплики, ошибки очереди и свободное место.
      /groups/0/rules/12/annotations/summary:
        source: Too many active parts in ClickHouse
        ru: Слишком много активных частей ClickHouse
      /groups/0/rules/12/annotations/description:
        source: Check the table, partition, batch size, and merge speed.
        ru: Проверить table, partition, размер batch и скорость merges.
      /groups/0/rules/13/annotations/summary:
        source: There is no single primary PostgreSQL
        ru: Нет единственного primary PostgreSQL
      /groups/0/rules/13/annotations/description:
        source: Check Patroni, etcd, watchdog, and the synchronous replication.
        ru: Проверить Patroni, etcd, watchdog и синхронную реплику.
      /groups/0/rules/14/annotations/summary:
        source: There is no single primary Valkey
        ru: Нет единственного primary Valkey
      /groups/0/rules/14/annotations/description:
        source: Check the Sentinel, availability of the primary, and the status of the replicas.
        ru: Проверить Sentinel, доступность primary и состояние реплик.
      /groups/0/rules/15/annotations/summary:
        source: Less than 15% of the disk is free
        ru: Свободно менее 15% диска
      /groups/0/rules/15/annotations/description:
        source: Determine the node and volume. Check the growth of Kafka, ClickHouse, SeaweedFS, and telemetry.
        ru: Определить node и volume. Проверить рост Kafka, ClickHouse, SeaweedFS и телеметрии.
      /groups/0/rules/16/annotations/summary:
        source: Less than 5% of the disk is free
        ru: Свободно менее 5% диска
      /groups/0/rules/16/annotations/description:
        source: Check for backpressure and the presence of acknowledged data. Determine the fastest-growing volume.
        ru: Проверить противодавление и наличие подтверждённых данных. Определить самый быстро растущий volume.
      /groups/0/rules/17/annotations/summary:
        source: Less than 30 days until the certificate expires
        ru: До истечения сертификата менее 30 суток
      /groups/0/rules/17/annotations/description:
        source: Check the owner and certificate, as well as the chain of trust and CA authority.
        ru: Проверить owner и certificate, цепочку доверия и полномочия CA.
      /groups/0/rules/18/annotations/summary:
        source: No successful backup available in the last 24 hours
        ru: Нет успешной резервной копии за 24 часа
      /groups/0/rules/18/annotations/description:
        source: Check the backup, task log, independent target storage, and the last acknowledged completion time.
        ru: Проверить backup, журнал задания, независимое целевое хранилище и время последнего подтверждённого завершения.
      /groups/0/rules/19/annotations/summary:
        source: The status of the backup copies is unknown.
        ru: Состояние резервных копий неизвестно
      /groups/0/rules/19/annotations/description:
        source: Check the agent’s state file, its format, permissions, and update it with copying tasks.
        ru: Проверить файл состояния агента, его формат, права и обновление заданиями копирования.
      /groups/0/rules/20/annotations/summary:
        source: Sites have no current duty assignee
        ru: На площадках отсутствует текущий дежурный
      /groups/0/rules/20/annotations/description:
        source: Check tenant, the number of sites without assignments and duty assignments in the console.
        ru: Проверить tenant, число площадок без назначения и раздел дежурств в консоли.
      /groups/0/rules/21/annotations/summary:
        source: There are disconnected connectors
        ru: Есть отключённые коннекторы
      /groups/0/rules/21/annotations/description:
        source: Compare the number of registrations with active sessions; check the network, certificate expiration, and SDK
          buffer.
        ru: Сравнить число регистраций с живыми сессиями; проверить сеть, срок сертификата и буфер SDK.
      /groups/0/rules/22/annotations/summary:
        source: Node clock skew exceeds 1 s
        ru: Часы узла расходятся более чем на 1 с
      /groups/0/rules/22/annotations/description:
        source: Check the availability of the time source, chrony, and system clocks. The metric compares the agent’s time
          with the Prometheus time.
        ru: Проверить доступность источника времени, chrony и системные часы. Метрика сравнивает часы агента с часами Prometheus.
      /groups/0/rules/23/annotations/summary:
        source: Correlation recovery exceeds 30 s
        ru: Восстановление корреляции превышает 30 с
      /groups/0/rules/23/annotations/description:
        source: Check the state size, changelog lag, disk status, and Kafka availability.
        ru: Проверить размер состояния, changelog lag, диск и доступность Kafka.
      /groups/0/rules/24/annotations/summary:
        source: The error rate of API proxying exceeds 5% of incoming requests
        ru: Доля ошибок проксирования API превышает 5% входных запросов
      /groups/0/rules/24/annotations/description:
        source: Check operation, upstream, TLS, Valkey, and proxy errors.
        ru: Проверить operation, upstream, TLS, Valkey и ошибки проксирования.
      /groups/0/rules/25/annotations/summary:
        source: The Collector does not deliver telemetry.
        ru: Collector не доставляет телеметрию
      /groups/0/rules/25/annotations/description:
        source: Check Loki, Tempo, queues, disks, and Collector errors.
        ru: Проверить Loki, Tempo, очереди, диски и ошибки Collector.
      /groups/0/rules/26/annotations/summary:
        source: Failed to obtain detailed metrics
        ru: Не удалось получить подробные метрики
      /groups/0/rules/26/annotations/description:
        source: Check the collector, components, monitoring rights, TLS, and protocol compatibility. TCP availability does
          not guarantee the receipt of metrics.
        ru: Проверить collector, component, права мониторинга, TLS и совместимость протокола. Доступность TCP не подтверждает
          получение метрик.
      /groups/0/rules/27/annotations/summary:
        source: No failure notifications are delivered
        ru: Не доставляются уведомления об отказах
      /groups/0/rules/27/annotations/description:
        source: Check the receiver, TLS, webhook availability, and the Alertmanager log.
        ru: Проверить receiver, TLS, доступность webhook и журнал Alertmanager.
      /groups/0/rules/28/annotations/summary:
        source: Observability notification channel health
        ru: Контроль работы канала наблюдаемости
      /groups/0/rules/28/annotations/description:
        source: Check for regular receipt of notifications by external monitoring.
        ru: Проверить регулярное получение уведомления внешним мониторингом.
      /groups/0/rules/29/annotations/summary:
        source: The duration of requests to the dependency exceeds 150 ms
        ru: Длительность запросов к зависимости превышает 150 мс
      /groups/0/rules/29/annotations/description:
        source: Compare the target with different nodes, check RTT, packet losses, and load.
        ru: Сравнить target с разных узлов, проверить RTT, потери пакетов и нагрузку.
      /groups/0/rules/30/annotations/summary:
        source: The last attempt at backup failed.
        ru: Последняя попытка резервного копирования завершилась ошибкой
      /groups/0/rules/30/annotations/description:
        source: Run psimctl diagnose and check the independent storage. Repeat psimctl backup create; do not manually change
          the time of the last successful backup.
        ru: Выполнить psimctl diagnose и проверить независимое хранилище. Повторить psimctl backup create; не изменять время
          последней успешной копии вручную.
      /groups/0/rules/31/annotations/summary:
        source: WAL Archiving Errors in PostgreSQL
        ru: Ошибки архивирования WAL PostgreSQL
      /groups/0/rules/31/annotations/description:
        source: Check psimctl backup wal-push, PostgreSQL configuration and the separate backup writer account. Do not delete
          WAL manually.
        ru: Проверить psimctl backup wal-push, конфигурацию PostgreSQL и отдельную учётную запись записи копий. Не удалять
          WAL вручную.
  contracts/openapi/psim-api-v1.yaml:
    kind: openapi
    strings:
      /info/title:
        source: Open-Source PSIM Platform REST API
        ru: Open-Source PSIM Platform REST API
      /info/description:
        source: 'Open-Source PSIM Platform REST API v1. Generated from contracts/proto/psim/api/v1 and this overlay.

          JSON is the canonical protobuf JSON mapping. Lists use cursor pagination

          (pageSize, pageToken -> nextPageToken). Errors are application/problem+json (RFC 9457).

          '
        ru: Open-Source PSIM Platform REST API v1. Сформирован из contracts/proto/psim/api/v1 и этого overlay. JSON соответствует
          каноническому отображению Protobuf в JSON. Для списков с пагинацией используются курсоры (pageSize, pageToken ->
          nextPageToken). Ошибки имеют формат application/problem+json (RFC 9457).
      /paths/~1v1~1audit~1records/get/description:
        source: SearchAuditRecords searches audit records; newest first.
        ru: SearchAuditRecords ищет записи аудита, начиная с самых новых.
      /paths/~1v1~1audit~1records/get/parameters/3/description:
        source: Action prefix, for example "incident.".
        ru: Префикс действия, например "incident.".
      /paths/~1v1~1audit~1records/get/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1audit~1records/get/summary:
        source: SearchAuditRecords searches audit records; newest first
        ru: SearchAuditRecords ищет записи аудита, начиная с самых новых
      /paths/~1v1~1audit~1records:export/get/description:
        source: ExportAuditRecords exports records with neighbouring hashes and checkpoints (JSON lines).
        ru: ExportAuditRecords экспортирует записи с соседними хэшами и контрольными точками в формате JSON lines.
      /paths/~1v1~1audit~1records:export/get/parameters/3/description:
        source: Action prefix, for example "incident.".
        ru: Префикс действия, например "incident.".
      /paths/~1v1~1audit~1records:export/get/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1audit~1records:export/get/summary:
        source: ExportAuditRecords exports records with neighbouring hashes and checkpoints (JSON lines)
        ru: ExportAuditRecords экспортирует записи с соседними хэшами и контрольными точками в формате JSON lines
      /paths/~1v1~1audit:verify/post/description:
        source: VerifyAuditIntegrity recomputes the chain over a range of records.
        ru: VerifyAuditIntegrity пересчитывает цепочку для диапазона записей.
      /paths/~1v1~1audit:verify/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1audit:verify/post/summary:
        source: VerifyAuditIntegrity recomputes the chain over a range of records
        ru: VerifyAuditIntegrity пересчитывает цепочку для диапазона записей
      /paths/~1v1~1commands/get/description:
        source: ListCommands lists commands by incident, device or state.
        ru: ListCommands возвращает команды по инциденту, устройству или состоянию.
      /paths/~1v1~1commands/get/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1commands/get/summary:
        source: ListCommands lists commands by incident, device or state
        ru: ListCommands возвращает команды по инциденту, устройству или состоянию
      /paths/~1v1~1commands/post/description:
        source: RequestCommand requests a command; Idempotency-Key header equals command_id.
        ru: RequestCommand запрашивает команду; заголовок Idempotency-Key равен command_id.
      /paths/~1v1~1commands/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1commands/post/summary:
        source: RequestCommand requests a command; Idempotency-Key header equals command_id
        ru: RequestCommand запрашивает команду; заголовок Idempotency-Key равен command_id
      /paths/~1v1~1commands~1{commandId}/get/description:
        source: GetCommand returns one command.
        ru: GetCommand возвращает одну команду.
      /paths/~1v1~1commands~1{commandId}/get/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1commands~1{commandId}/get/summary:
        source: GetCommand returns one command
        ru: GetCommand возвращает одну команду
      /paths/~1v1~1commands~1{commandId}:approve/post/description:
        source: ApproveCommand approves a critical command; approver must differ from requester (CM3).
        ru: ApproveCommand одобряет критичную команду; подтверждающий должен отличаться от инициатора (CM3).
      /paths/~1v1~1commands~1{commandId}:approve/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1commands~1{commandId}:approve/post/summary:
        source: ApproveCommand approves a critical command; approver must differ from requester (CM3)
        ru: ApproveCommand одобряет критичную команду; подтверждающий должен отличаться от инициатора (CM3)
      /paths/~1v1~1commands~1{commandId}:cancel/post/description:
        source: CancelCommand cancels a command before it is sent.
        ru: CancelCommand отменяет команду до её отправки.
      /paths/~1v1~1commands~1{commandId}:cancel/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1commands~1{commandId}:cancel/post/summary:
        source: CancelCommand cancels a command before it is sent
        ru: CancelCommand отменяет команду до её отправки
      /paths/~1v1~1commands~1{commandId}:reject/post/description:
        source: RejectCommand rejects a critical command.
        ru: RejectCommand отклоняет критичную команду.
      /paths/~1v1~1commands~1{commandId}:reject/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1commands~1{commandId}:reject/post/summary:
        source: RejectCommand rejects a critical command
        ru: RejectCommand отклоняет критичную команду
      /paths/~1v1~1commands:preview/post/description:
        source: PreviewCommand validates scope, parameters and device capability without dispatch.
        ru: PreviewCommand проверяет область доступа, параметры и capability устройства без отправки команды.
      /paths/~1v1~1commands:preview/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1commands:preview/post/summary:
        source: PreviewCommand validates scope, parameters and device capability without dispatch
        ru: PreviewCommand проверяет область доступа, параметры и capability устройства без отправки команды
      /paths/~1v1~1connectors/get/description:
        source: ListConnectors lists registered connectors with their status.
        ru: ListConnectors возвращает зарегистрированные коннекторы и их состояния.
      /paths/~1v1~1connectors/get/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1connectors/get/summary:
        source: ListConnectors lists registered connectors with their status
        ru: ListConnectors возвращает зарегистрированные коннекторы и их состояния
      /paths/~1v1~1connectors/post/description:
        source: RegisterConnector registers a connector and binds its certificate.
        ru: RegisterConnector регистрирует коннектор и привязывает его сертификат.
      /paths/~1v1~1connectors/post/parameters/0/description:
        source: Public client certificate; its fingerprint and validity are verified by the gateway.
        ru: Клиентский сертификат без закрытого ключа; шлюз проверяет отпечаток и срок действия.
      /paths/~1v1~1connectors/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1connectors/post/summary:
        source: RegisterConnector registers a connector and binds its certificate
        ru: RegisterConnector регистрирует коннектор и привязывает его сертификат
      /paths/~1v1~1connectors~1{connectorId}/get/description:
        source: GetConnector returns the latest projected registration.
        ru: GetConnector возвращает последнее состояние регистрации из проекции.
      /paths/~1v1~1connectors~1{connectorId}/get/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1connectors~1{connectorId}/get/summary:
        source: GetConnector returns the latest projected registration
        ru: GetConnector возвращает последнее состояние регистрации из проекции
      /paths/~1v1~1connectors~1{connectorId}:revoke/post/description:
        source: RevokeConnector revokes a connector and closes its sessions (C2).
        ru: RevokeConnector отзывает коннектор и закрывает его сессии (C2).
      /paths/~1v1~1connectors~1{connectorId}:revoke/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1connectors~1{connectorId}:revoke/post/summary:
        source: RevokeConnector revokes a connector and closes its sessions (C2)
        ru: RevokeConnector отзывает коннектор и закрывает его сессии (C2)
      /paths/~1v1~1connectors~1{connectorId}:rotate-certificate/post/description:
        source: RotateConnectorCertificate adds a new certificate and sets expiry of the old one (C1).
        ru: RotateConnectorCertificate добавляет новый сертификат и задаёт срок истечения прежнего (C1).
      /paths/~1v1~1connectors~1{connectorId}:rotate-certificate/post/responses/200/description:
        source: OK
        ru: OK
      /paths/~1v1~1connectors~1{connectorId}:rotate-certificate/post/summary:
        source: RotateConnectorCertificate adds a new certificate and sets expiry of the old one (C1)
        ru: RotateConnectorCertificate добавляет новый сертификат и задаёт срок истечения прежнего (C1)
