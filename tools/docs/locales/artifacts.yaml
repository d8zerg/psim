      /methods/66/criteria:
        source: task docs:check passes; links, typography, PlantUML, C4, threat and verification registries are current; both
          language versions are complete and reviewed
        ru: task docs:check проходит; ссылки, типографика, PlantUML, C4, реестры угроз и верификации актуальны; обе языковые
          версии полны и проверены
      /methods/66/name:
        source: Documentation as code
        ru: Документация как код
      /methods/65/purpose:
        source: Security requirement SR-13
        ru: Требование безопасности SR-13
      /methods/65/criteria:
        source: Static analysis (requirement SR-13)
        ru: Статическая проверка (требование SR-13)
      /methods/65/name:
        source: Prohibit concatenation of user input into queries
        ru: Запрет конкатенации пользовательского ввода в запросах
      /methods/64/purpose:
        source: Metrics, logs and traces for every service
        ru: Метрики, логи и трассы каждого сервиса
      /methods/64/criteria:
        source: After startup, each service serves /health/live, /health/ready and /metrics and exports traces
        ru: После старта каждый сервис отдаёт /health/live, /health/ready, /metrics и экспортирует трассировки
      /methods/64/name:
        source: Service observability
        ru: Наблюдаемость каждого сервиса
      /methods/63/criteria:
        source: Each stage's p99 in load tests stays within its budget in quality.md, section 4
        ru: В нагрузочных тестах p99 каждого этапа не превышает бюджет quality.md, раздел 4
