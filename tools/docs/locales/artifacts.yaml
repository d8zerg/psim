      /methods/61/purpose:
        source: Multitenancy (ADR-022)
        ru: Мультитенантность (ADR-022)
      /methods/61/criteria:
        source: Static checks of repository SQL and ClickHouse queries (ADR-022)
        ru: Статическая проверка SQL репозиториев и запросов ClickHouse (ADR-022)
      /methods/61/name:
        source: tenant_id in all storage queries
        ru: tenant_id во всех запросах к хранилищам
      /methods/60/purpose:
        source: Deterministic domain core
        ru: Детерминированное доменное ядро
      /methods/60/criteria:
        source: libs/domain prohibits system clocks, randomness, input/output and exceptions as the domain error mechanism
