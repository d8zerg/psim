          менее чем за три секунды и совпадающий CSV
      /methods/71/criteria:
        source: Two independent builds of the same commit produce identical artifacts
        ru: Две независимые сборки одного коммита дают идентичные артефакты
      /methods/71/name:
        source: Build reproducibility
        ru: Воспроизводимость сборки
      /methods/2/name:
        source: Audit and supervisor reporting through the public interface
        ru: Аудит и отчёт руководителя через публичный интерфейс
      /methods/7/purpose:
        source: Verify server operations for the operational interface without a read-model simulator
        ru: Проверить серверные операции оперативного интерфейса без использования имитатора витрины
      /methods/70/criteria:
        source: Domain core coverage >= 90% of lines and >= 80% of branches; infrastructure coverage >= 75% of lines
        ru: Доменное ядро ≥ 90% строк и ≥ 80% ветвей; инфраструктура ≥ 75% строк
      /methods/70/name:
        source: Coverage thresholds
        ru: Пороги покрытия
      /methods/7/criteria:
        source: Independent alarm, permissions, versions, retries, leases across instances, history, exercise isolation and
