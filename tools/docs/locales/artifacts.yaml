        source: ValidateRuleRequest is the request of ValidateRule.
        ru: ValidateRuleRequest - запрос операции ValidateRule.
      /components/schemas/psim.api.v1.ValidateRuleResponse/description:
        source: ValidateRuleResponse is the response of ValidateRule.
        ru: ValidateRuleResponse - ответ операции ValidateRule.
      /components/schemas/psim.api.v1.VerifyAuditIntegrityRequest/properties/fromSeq/description:
        source: 0 means from the first record.
        ru: 0 означает начало с первой записи.
      /components/schemas/psim.api.v1.VerifyAuditIntegrityRequest/properties/toSeq/description:
        source: 0 means up to the last record.
        ru: 0 означает конец на последней записи.
      /components/schemas/psim.api.v1.VerifyAuditIntegrityRequest/description:
        source: VerifyAuditIntegrityRequest is the request of VerifyAuditIntegrity.
        ru: VerifyAuditIntegrityRequest - запрос операции VerifyAuditIntegrity.
      /components/schemas/psim.api.v1.VerifyAuditIntegrityResponse/properties/firstBrokenSeq/description:
        source: First record where the chain is broken; 0 when intact.
        ru: Первая запись с нарушением цепочки; 0, если цепочка цела.
      /components/schemas/psim.api.v1.VerifyAuditIntegrityResponse/description:
        source: VerifyAuditIntegrityResponse is the response of VerifyAuditIntegrity.
        ru: VerifyAuditIntegrityResponse - ответ операции VerifyAuditIntegrity.
      /components/schemas/psim.api.v1.ZoneStatus/properties/state/description:
        source: Highest class among active device states.
        ru: Наивысший класс среди активных состояний устройств.
      /components/schemas/psim.api.v1.ZoneStatus/description:
        source: ZoneStatus is the aggregated state of a zone.
        ru: ZoneStatus - агрегированное состояние зоны.
      /components/schemas/psim.audit.v1.AuditChainEntry/properties/tenantId/description:
        source: Tenant is included in the canonical hash payload.
        ru: Тенант включён в канонические данные для хэширования.
      /components/schemas/psim.audit.v1.AuditChainEntry/description:
        source: AuditChainEntry is an audit entry as stored in the chain.
        ru: AuditChainEntry - запись аудита в виде, сохранённом в цепочке.
      /components/schemas/psim.audit.v1.AuditCheckpoint/properties/tenantId/description:
        source: Tenant is included in the signed checkpoint payload.
        ru: Тенант включён в подписываемые данные контрольной точки.
      /components/schemas/psim.audit.v1.AuditCheckpoint/description:
        source: AuditCheckpoint fixes the head of the chain (ADR-021).
        ru: AuditCheckpoint фиксирует конец цепочки (ADR-021).
      /components/schemas/psim.audit.v1.AuditEntry/properties/action/description:
        source: Dotted action name, for example "incident.acknowledge", "access.denied".
        ru: Имя действия с точками, например "incident.acknowledge", "access.denied".
      /components/schemas/psim.audit.v1.AuditEntry/properties/clientAddress/description:
        source: Client address and user agent for user actions.
        ru: Адрес клиента и user agent для действий пользователя.
      /components/schemas/psim.audit.v1.AuditEntry/description:
        source: "AuditEntry is an action to be recorded in the audit chain.\n envelope.causation_id is the source domain event\
          \ id (idempotency key, AU3)."
        ru: AuditEntry - действие для записи в цепочку аудита. envelope.causation_id - идентификатор исходного доменного события,
          ключ идемпотентности (AU3).
      /components/schemas/psim.catalog.v1.Capability/properties/code/description:
        source: For example "lock", "unlock", "arm", "ptz.preset".
        ru: Например, "lock", "unlock", "arm", "ptz.preset".
      /components/schemas/psim.catalog.v1.Capability/properties/critical/description:
        source: Critical commands require approval by a second user (CM3).
        ru: Критичные команды требуют одобрения вторым пользователем (CM3).
      /components/schemas/psim.catalog.v1.Capability/properties/consequence/description:
        source: Operator-facing consequence configured by the administrator; empty means unknown.
        ru: Последствие для оператора, настроенное администратором; пустое значение означает неизвестное последствие.
      /components/schemas/psim.catalog.v1.Capability/description:
        source: Capability is a command or mode a device supports.
        ru: Capability - команда или режим, поддерживаемые устройством.
      /components/schemas/psim.catalog.v1.CertificateFingerprint/properties/sha256/description:
        source: Hex-encoded SHA-256 of the DER certificate.
        ru: SHA-256 сертификата DER в шестнадцатеричном представлении.
      /components/schemas/psim.catalog.v1.CertificateFingerprint/description:
        source: CertificateFingerprint binds an mTLS client certificate to a connector.
        ru: CertificateFingerprint привязывает клиентский сертификат mTLS к коннектору.
      /components/schemas/psim.catalog.v1.Connector/properties/connectorType/description:
        source: Selects the mapping rule set, for example "simulator" or "mqtt".
        ru: Выбирает набор правил нормализации, например "simulator" или "mqtt".
      /components/schemas/psim.catalog.v1.Connector/description:
        source: Connector is a registered connector with its credentials and limits.
        ru: Connector - зарегистрированный коннектор с учётными данными и лимитами.
      /components/schemas/psim.catalog.v1.ConnectorLimits/description:
        source: ConnectorLimits are per-connector ingestion limits enforced by the gateway.
        ru: ConnectorLimits - ограничения приёма событий для каждого коннектора, применяемые шлюзом.
      /components/schemas/psim.catalog.v1.Device/properties/externalId/description:
        source: Device id in the external system, unique per connector (D1).
        ru: Идентификатор устройства во внешней системе, уникальный в пределах коннектора (D1).
      /components/schemas/psim.catalog.v1.Device/description:
        source: Device is a physical or logical device with its sources.
        ru: Device - физическое или логическое устройство с его источниками.
      /components/schemas/psim.catalog.v1.DeviceType/properties/taxonomyDomain/description:
        source: Taxonomy domain, for example "access".
        ru: Домен таксономии, например "access".
      /components/schemas/psim.catalog.v1.DeviceType/description:
        source: DeviceType describes a class of devices, its sources and capabilities.
        ru: DeviceType описывает класс устройств, его источники и capabilities.
      /components/schemas/psim.catalog.v1.FloorPlan/properties/imageRef/description:
        source: Reference to the stored image, served by GET /v1/locations/{id}/floor-plan.
        ru: Ссылка на сохранённое изображение, доступное через GET /v1/locations/{id}/floor-plan.
      /components/schemas/psim.catalog.v1.FloorPlan/description:
        source: FloorPlan is an image of a floor with a coordinate system for device positions.
        ru: FloorPlan - изображение этажа с системой координат для размещения устройств.
      /components/schemas/psim.catalog.v1.Location/properties/parentId/description:
        source: Empty only for sites.
        ru: Пустое значение допускается только для площадок.
      /components/schemas/psim.catalog.v1.Location/properties/code/description:
        source: Unique among siblings.
        ru: Уникально среди объектов с одним родителем.
      /components/schemas/psim.catalog.v1.Location/properties/timezone/description:
        source: IANA time zone, sites only.
        ru: Часовой пояс IANA, только для площадок.
      /components/schemas/psim.catalog.v1.Location/properties/floorPlan/description:
        source: Floors only.
        ru: Только для этажей.
      /components/schemas/psim.catalog.v1.Location/description:
        source: Location is a site, building, floor or zone.
        ru: Location - площадка, здание, этаж или зона.
      /components/schemas/psim.catalog.v1.MaintenanceWindow/description:
        source: "MaintenanceWindow is a one-off interval, evaluated using event receipt time.\n Fire events and P1 signals\
          \ are never suppressed; history and open incidents are preserved."
        ru: MaintenanceWindow - однократный интервал, проверяемый по времени приёма события. Пожарные события и сигналы P1
          никогда не подавляются; история и открытые инциденты сохраняются.
      /components/schemas/psim.catalog.v1.ParameterSpec/description:
        source: ParameterSpec describes one command parameter.
        ru: ParameterSpec описывает один параметр команды.
      /components/schemas/psim.catalog.v1.Source/properties/sourceId/description:
        source: 'Deterministic: UUIDv5(connector_id, external_ref), see ADR-029.'
        ru: Детерминированный UUIDv5(connector_id, external_ref), см. ADR-029.
      /components/schemas/psim.catalog.v1.Source/properties/externalRef/description:
        source: Reference used by the connector, unique per connector (D2).
        ru: Ссылка, используемая коннектором, уникальная в его пределах (D2).
      /components/schemas/psim.catalog.v1.Source/description:
        source: Source is an event channel of a device.
        ru: Source - канал событий устройства.
      /components/schemas/psim.catalog.v1.SourceTemplate/description:
        source: SourceTemplate describes a source every device of the type has.
        ru: SourceTemplate описывает источник, имеющийся у каждого устройства данного типа.
      /components/schemas/psim.catalog.v1.StoredFile/properties/objectKey/description:
        source: Internal storage identity; clients download through the authorized floor endpoint.
        ru: Внутренний идентификатор хранилища; клиенты скачивают файл через авторизованный endpoint этажа.
      /components/schemas/psim.catalog.v1.StoredFile/description:
        source: StoredFile describes an immutable private object owned by a floor.
        ru: StoredFile описывает неизменяемый закрытый объект, принадлежащий этажу.
      /components/schemas/psim.catalog.v1.SuppressionPolicy/description:
        source: SuppressionPolicy explicitly selects event types or rules for new signal suppression.
        ru: SuppressionPolicy явно выбирает типы событий или правила для подавления новых сигналов.
      /components/schemas/psim.common.v1.Actor/properties/id/description:
        source: User id, service name, connector id or "system".
        ru: Идентификатор пользователя, имя сервиса, идентификатор коннектора или "system".
      /components/schemas/psim.common.v1.Actor/description:
        source: Actor identifies the subject that performed an action.
        ru: Actor определяет субъекта, выполнившего действие.
      /components/schemas/psim.common.v1.Position/description:
        source: Position is a point on a floor plan in plan units.
        ru: Position - точка на поэтажном плане в единицах плана.
      /components/schemas/psim.config.v1.ProcessingSettings/properties/significanceThreshold/description:
        source: Events at or above this severity are significant (E3).
        ru: События с этой или более высокой критичностью являются значимыми (E3).
      /components/schemas/psim.config.v1.ProcessingSettings/description:
        source: ProcessingSettings are tenant-wide processing parameters.
        ru: ProcessingSettings - параметры обработки для всего тенанта.
      /components/schemas/psim.config.v1.RetentionSettings/description:
        source: RetentionSettings are data retention periods of a tenant.
        ru: RetentionSettings - сроки хранения данных тенанта.
      /components/schemas/psim.incident.v1.AlarmControl/description:
        source: AlarmControl records an independent, bounded visibility control.
        ru: AlarmControl хранит независимое управление видимостью с ограниченным сроком.
      /components/schemas/psim.incident.v1.Incident/properties/signalIds/description:
        source: Bounded preview of attached identities; ListIncidentSignals returns the complete list.
        ru: Ограниченная выборка прикреплённых идентификаторов; ListIncidentSignals возвращает полный список.
      /components/schemas/psim.incident.v1.Incident/properties/assigneeId/description:
        source: User id of the responsible operator.
        ru: Идентификатор ответственного оператора.
      /components/schemas/psim.incident.v1.Incident/properties/escalationLevel/description:
        source: 0 means not escalated.
        ru: 0 означает отсутствие эскалации.
      /components/schemas/psim.incident.v1.Incident/properties/blockingSteps/description:
        source: Unfinished mandatory steps of the active response run (I7).
        ru: Незавершённые обязательные шаги активного запуска сценария (I7).
      /components/schemas/psim.incident.v1.Incident/properties/responseRunVersion/description:
        source: Version of the response run applied to blocking_steps.
        ru: Версия запуска сценария, применённая к blocking_steps.
      /components/schemas/psim.incident.v1.Incident/properties/relatedIncidentId/description:
        source: Previous incident with the same grouping key, if any (I4).
        ru: Предыдущий инцидент с тем же ключом группировки, если есть (I4).
      /components/schemas/psim.incident.v1.Incident/properties/version/description:
        source: Aggregate version, used as ETag.
        ru: Версия агрегата, используемая как ETag.
      /components/schemas/psim.incident.v1.Incident/properties/incidentTypeVersion/description:
        source: Incident type configuration fixed when the incident is created.
        ru: Конфигурация типа инцидента, зафиксированная при его создании.
      /components/schemas/psim.incident.v1.Incident/properties/pendingTransfer/description:
        source: Pending transfer keeps the current assignee until recipient confirmation.
        ru: Ожидающая передача сохраняет текущего ответственного до подтверждения получателем.
      /components/schemas/psim.incident.v1.Incident/properties/autoCloseAt/description:
        source: Durable deadline used by automatic close after resolution.
        ru: Долговечный срок для автоматического закрытия после решения.
      /components/schemas/psim.incident.v1.Incident/properties/signalCount/description:
        source: Total identities in the paginated signal collection.
        ru: Общее количество идентификаторов в коллекции сигналов с пагинацией.
      /components/schemas/psim.incident.v1.Incident/properties/signalIdsTruncated/description:
        source: The preview is bounded to 1000 identities.
        ru: Предварительная выборка ограничена 1000 идентификаторов.
      /components/schemas/psim.incident.v1.Incident/properties/escalationPolicyId/description:
        source: Policy identity fixed with the incident type version.
        ru: Идентификатор политики, зафиксированный вместе с версией типа инцидента.
      /components/schemas/psim.incident.v1.Incident/properties/operational/description:
        source: Independent alarm condition, acknowledgements and temporary visibility controls.
        ru: Независимое состояние тревоги, подтверждения и временное управление видимостью.
      /components/schemas/psim.incident.v1.Incident/description:
        source: Incident groups signals and tracks the response lifecycle (ADR-027).
        ru: Incident группирует сигналы и отслеживает жизненный цикл реагирования (ADR-027).
      /components/schemas/psim.incident.v1.IncidentTransfer/description:
        source: IncidentTransfer is the pending request tied to an aggregate version.
        ru: IncidentTransfer - ожидающий запрос, привязанный к версии агрегата.
      /components/schemas/psim.incident.v1.IncidentType/properties/responseRequired/description:
        source: When set, an incident without a matching response plan is flagged.
        ru: Если задано, инцидент без подходящего сценария реагирования помечается.
      /components/schemas/psim.incident.v1.IncidentType/properties/autoCloseAfter/description:
        source: Delay between resolved and automatic close.
        ru: Задержка между решением и автоматическим закрытием.
      /components/schemas/psim.incident.v1.IncidentType/properties/priorityMatrix/description:
        source: Optional priority mapping, keyed by the numeric input priority (1-4).
        ru: Необязательное сопоставление приоритетов с ключом по числовому входному приоритету (1-4).
      /components/schemas/psim.incident.v1.IncidentType/description:
        source: IncidentType is a class of situations that defines response plan and SLA.
        ru: IncidentType - тип ситуаций, определяющий сценарий реагирования и SLA.
      /components/schemas/psim.incident.v1.Link/description:
        source: Link is an external reference attached to an incident (video clip, document).
        ru: Link - внешняя ссылка, прикреплённая к инциденту, например видеоклип или документ.
      /components/schemas/psim.incident.v1.OperationalState/properties/conditionKnown/description:
        source: False for pre-existing incidents whose process condition has never been observed.
        ru: False для ранее существовавших инцидентов, состояние процесса которых никогда не наблюдалось.
      /components/schemas/psim.incident.v1.OperationalState/description:
        source: OperationalState preserves condition independently from the incident lifecycle.
        ru: OperationalState сохраняет состояние условия независимо от жизненного цикла инцидента.
      /components/schemas/psim.incident.v1.PresenceLease/description:
        source: PresenceLease is advisory and never grants authorization or blocks an incident action.
        ru: PresenceLease носит информационный характер, никогда не предоставляет права и не блокирует действие с инцидентом.
      /components/schemas/psim.incident.v1.StepRef/description:
        source: StepRef points to a step of a response run.
        ru: StepRef указывает на шаг запуска сценария реагирования.
      /components/schemas/psim.incident.v1.TimelineEntry/properties/refId/description:
        source: 'Id of the related object: signal, step, command, notification, link.'
        ru: 'Идентификатор связанного объекта: сигнала, шага, команды, уведомления или ссылки.'
      /components/schemas/psim.incident.v1.TimelineEntry/description:
        source: TimelineEntry is one record of an incident timeline.
        ru: TimelineEntry - одна запись хронологии инцидента.
      /components/schemas/psim.processing.v1.AbsenceSpec/description:
        source: "AbsenceSpec fires when an expected event does not follow a trigger within the window.\n Without a trigger\
          \ it fires when no expected event occurs within each window (heartbeat)."
        ru: AbsenceSpec срабатывает, если ожидаемое событие не следует за триггером в пределах окна. Без триггера срабатывает
          при отсутствии ожидаемого события в каждом окне (heartbeat).
      /components/schemas/psim.processing.v1.ConjunctionSpec/description:
        source: ConjunctionSpec fires when every part matched within the window, in any order.
        ru: ConjunctionSpec срабатывает, когда все части совпали в пределах окна в любом порядке.
      /components/schemas/psim.processing.v1.CorrelationRule/properties/filter/description:
        source: Events considered by the rule at all.
        ru: События, которые вообще рассматриваются правилом.
      /components/schemas/psim.processing.v1.CorrelationRule/properties/suppression/description:
        source: Suppress repeated signals for the same correlation key for this interval.
        ru: Подавлять повторные сигналы для того же ключа корреляции в течение этого интервала.
      /components/schemas/psim.processing.v1.CorrelationRule/description:
        source: CorrelationRule is one immutable version of a correlation rule (ADR-011).
        ru: CorrelationRule - одна неизменяемая версия правила корреляции (ADR-011).
      /components/schemas/psim.processing.v1.Event/properties/type/description:
        source: Taxonomy type code, for example "intrusion.zone.alarm".
        ru: Код типа таксономии, например "intrusion.zone.alarm".
      /components/schemas/psim.processing.v1.Event/properties/taxonomyVersion/description:
        source: Taxonomy version used for normalization, for example "1".
        ru: Версия таксономии для нормализации, например "1".
      /components/schemas/psim.processing.v1.Event/properties/rawCode/description:
        source: Vendor event code, always preserved.
        ru: Код события производителя, сохраняется всегда.
      /components/schemas/psim.processing.v1.Event/properties/attributes/description:
        source: Standard taxonomy attributes and connector attributes prefixed with "x.".
        ru: Стандартные атрибуты таксономии и атрибуты коннектора с префиксом "x.".
      /components/schemas/psim.processing.v1.Event/properties/significant/description:
        source: Significant events are stored long-term in Event History (ADR-028).
        ru: Значимые события хранятся длительно в Event History (ADR-028).
      /components/schemas/psim.processing.v1.Event/properties/clockSkewCorrected/description:
        source: Event time was corrected because of source clock skew (ADR-010).
        ru: Время события скорректировано из-за рассогласования часов источника (ADR-010).
      /components/schemas/psim.processing.v1.Event/properties/gatewaySessionId/description:
        source: Authenticated receiving session; historical events never advance equipment freshness.
        ru: Аутентифицированная сессия приёма; исторические события никогда не повышают актуальность состояния оборудования.
      /components/schemas/psim.processing.v1.Event/properties/stateObservedAt/description:
        source: Present only for a newer, recent observation from the receiving session.
        ru: Присутствует только для более нового и свежего наблюдения из сессии приёма.
      /components/schemas/psim.processing.v1.Event/description:
        source: "Event is a normalized event. envelope.message_id equals the raw event_id,\n envelope.sequence equals the\
          \ source sequence number."
        ru: Event - нормализованное событие. envelope.message_id равен исходному event_id, envelope.sequence равен порядковому
          номеру источника.
      /components/schemas/psim.processing.v1.EventFilter/properties/types/description:
        source: Taxonomy codes or prefixes ending with ".*", for example "intrusion.*".
        ru: Коды таксономии или префиксы, заканчивающиеся на ".*", например "intrusion.*".
      /components/schemas/psim.processing.v1.EventFilter/properties/condition/description:
        source: Optional CEL expression over the variable "event".
        ru: Необязательное выражение CEL над переменной "event".
      /components/schemas/psim.processing.v1.EventFilter/description:
        source: EventFilter selects events by taxonomy type, severity, location and a CEL condition.
        ru: EventFilter выбирает события по типу таксономии, критичности, локации и условию CEL.
      /components/schemas/psim.processing.v1.MappingRule/properties/rawCode/description:
        source: Exact vendor code or prefix ending with "*".
        ru: Точный код производителя или префикс, заканчивающийся на "*".
      /components/schemas/psim.processing.v1.MappingRule/properties/condition/description:
        source: Optional CEL condition over the variable "raw".
        ru: Необязательное условие CEL над переменной "raw".
      /components/schemas/psim.processing.v1.MappingRule/properties/type/description:
        source: Target taxonomy type code.
        ru: Целевой код типа таксономии.
      /components/schemas/psim.processing.v1.MappingRule/properties/severity/description:
        source: Overrides the default severity of the type when set.
        ru: Если задано, переопределяет критичность типа по умолчанию.
      /components/schemas/psim.processing.v1.MappingRule/properties/attributeMap/description:
        source: 'Attribute renames: raw attribute name -> normalized attribute name.'
        ru: 'Переименование атрибутов: имя сырого атрибута -> имя нормализованного атрибута.'
      /components/schemas/psim.processing.v1.MappingRule/description:
        source: MappingRule maps a raw event to a taxonomy type.
        ru: MappingRule сопоставляет сырое событие типу таксономии.
      /components/schemas/psim.processing.v1.MappingRuleSet/properties/rules/description:
        source: Ordered; the first matching rule wins.
        ru: Упорядочены; применяется первое совпавшее правило.
      /components/schemas/psim.processing.v1.MappingRuleSet/description:
        source: "MappingRuleSet is a published version of mapping rules for one connector type.\n Published in psim.config.v1\
          \ under key \"mapping/<tenant_id>/<connector_type>\"."
        ru: MappingRuleSet - опубликованная версия правил нормализации для одного типа коннектора. Публикуется в psim.config.v1
          с ключом "mapping/<tenant_id>/<connector_type>".
      /components/schemas/psim.processing.v1.RuleOutput/properties/priority/description:
        source: Fixed priority, used when priority_expression is empty.
        ru: Фиксированный приоритет, используемый при пустом priority_expression.
      /components/schemas/psim.processing.v1.RuleOutput/properties/priorityExpression/description:
        source: Optional CEL expression returning 1..4.
        ru: Необязательное выражение CEL, возвращающее 1..4.
      /components/schemas/psim.processing.v1.RuleOutput/properties/groupingScope/description:
        source: Scope of the grouping key; defaults to the correlation scope.
        ru: Область ключа группировки; по умолчанию равна области корреляции.
      /components/schemas/psim.processing.v1.RuleOutput/properties/summaryTemplate/description:
        source: Summary template, may reference event and rule fields.
        ru: Шаблон сводки; может ссылаться на поля события и правила.
      /components/schemas/psim.processing.v1.RuleOutput/description:
        source: RuleOutput describes the signal produced by a rule.
        ru: RuleOutput описывает сигнал, формируемый правилом.
      /components/schemas/psim.processing.v1.RuleSet/description:
        source: "RuleSet is the set of rule versions active for a tenant.\n Published in psim.config.v1 under key \"ruleset/<tenant_id>\"\
          ."
        ru: RuleSet - набор версий правил, активных для тенанта. Публикуется в psim.config.v1 с ключом "ruleset/<tenant_id>".
      /components/schemas/psim.processing.v1.SequenceSpec/description:
        source: SequenceSpec fires when the steps matched within the window in the given order.
        ru: SequenceSpec срабатывает при совпадении шагов в указанном порядке в пределах окна.
      /components/schemas/psim.processing.v1.Signal/properties/groupingKey/description:
        source: Key used by Incident Service to attach the signal to an open incident.
        ru: Ключ, по которому Incident Service прикрепляет сигнал к открытому инциденту.
      /components/schemas/psim.processing.v1.Signal/properties/zoneId/description:
        source: Empty for signals of rules wider than a zone.
        ru: Пустое значение для сигналов правил с областью шире зоны.
      /components/schemas/psim.processing.v1.Signal/properties/explanationRef/description:
        source: Optional reference to an explanation produced by an external module.
        ru: Необязательная ссылка на объяснение, созданное внешним модулем.
      /components/schemas/psim.processing.v1.Signal/properties/absenceDeadline/description:
        source: Timer-driven absence may have no input events. The deadline is its evidence.
        ru: Срабатывание absence по таймеру может не иметь входных событий. Свидетельством служит срок ожидания.
      /components/schemas/psim.processing.v1.Signal/description:
        source: "Signal is the result of a correlation rule firing or of an external producer (ADR-025).\n envelope.message_id\
          \ is the deterministic signal_id (ADR-005)."
        ru: Signal - результат срабатывания правила корреляции или внешнего производителя (ADR-025). envelope.message_id -
          детерминированный signal_id (ADR-005).
      /components/schemas/psim.processing.v1.SignalOrigin/properties/ruleId/description:
        source: Correlation rule id for SIGNAL_ORIGIN_KIND_RULE.
        ru: Идентификатор правила корреляции для SIGNAL_ORIGIN_KIND_RULE.
      /components/schemas/psim.processing.v1.SignalOrigin/properties/producer/description:
        source: Registered external producer name for SIGNAL_ORIGIN_KIND_EXTERNAL.
        ru: Зарегистрированное имя внешнего производителя для SIGNAL_ORIGIN_KIND_EXTERNAL.
      /components/schemas/psim.processing.v1.SignalOrigin/description:
        source: SignalOrigin identifies what produced a signal.
        ru: SignalOrigin определяет источник сигнала.
      /components/schemas/psim.processing.v1.SingleSpec/description:
        source: SingleSpec fires on every matching event.
        ru: SingleSpec срабатывает для каждого подходящего события.
      /components/schemas/psim.processing.v1.ThresholdSpec/properties/distinctBy/description:
        source: Count distinct values of this field ("device_id", "source_id" or an attribute) instead of events.
        ru: Считать различные значения этого поля, "device_id", "source_id" или атрибута, вместо событий.
      /components/schemas/psim.processing.v1.ThresholdSpec/description:
        source: ThresholdSpec fires when at least count matching events occur within the window.
        ru: ThresholdSpec срабатывает, если в пределах окна произошло не менее count подходящих событий.
      /components/schemas/psim.response.v1.AutomatedParams/description:
        source: AutomatedParams calls an external handler (ADR-025).
        ru: AutomatedParams вызывает внешний обработчик (ADR-025).
      /components/schemas/psim.response.v1.ChecklistItem/description:
        source: ChecklistItem is one checklist entry.
        ru: ChecklistItem - один пункт чек-листа.
      /components/schemas/psim.response.v1.ChecklistParams/description:
        source: ChecklistParams is a list of items to check.
        ru: ChecklistParams - список пунктов для проверки.
      /components/schemas/psim.response.v1.Command/properties/resultCode/description:
        source: Error code from the catalog for failed, rejected, timed out or cancelled commands.
        ru: Код ошибки из каталога для неуспешных, отклонённых, просроченных или отменённых команд.
      /components/schemas/psim.response.v1.Command/description:
        source: Command is a request to act on a device.
        ru: Command - запрос действия на устройстве.
      /components/schemas/psim.response.v1.CommandParams/properties/targetExpression/description:
        source: Target expression, for example "zone.devices(type == 'access.door')".
        ru: Выражение цели, например "zone.devices(type == 'access.door')".
      /components/schemas/psim.response.v1.CommandParams/properties/automatic/description:
        source: Execute without operator confirmation.
        ru: Исполнять без подтверждения оператора.
      /components/schemas/psim.response.v1.CommandParams/description:
        source: CommandParams sends a command to devices (P3).
        ru: CommandParams отправляет команду устройствам (P3).
      /components/schemas/psim.response.v1.DecisionOption/properties/suggestedResolution/description:
        source: Resolution suggested when this option leads to the end of the plan, for example false alarm.
        ru: Предлагаемый результат решения, если этот вариант завершает сценарий, например ложная тревога.
      /components/schemas/psim.response.v1.DecisionOption/description:
        source: DecisionOption is one branch of a decision.
        ru: DecisionOption - одна ветка решения.
      /components/schemas/psim.response.v1.DecisionParams/description:
        source: DecisionParams branches the plan by the operator choice (P2).
        ru: DecisionParams выбирает ветку сценария по выбору оператора (P2).
      /components/schemas/psim.response.v1.EscalateParams/description:
        source: EscalateParams escalates the incident to the given level.
        ru: EscalateParams повышает эскалацию инцидента до указанного уровня.
      /components/schemas/psim.response.v1.EscalationLevel/properties/delay/description:
        source: Delay after the SLA breach.
        ru: Задержка после нарушения SLA.
      /components/schemas/psim.response.v1.EscalationLevel/description:
        source: EscalationLevel is one level of escalation.
        ru: EscalationLevel - один уровень эскалации.
      /components/schemas/psim.response.v1.EscalationPolicy/properties/levels/description:
        source: Strictly increasing delays (EP1).
        ru: Строго возрастающие задержки (EP1).
      /components/schemas/psim.response.v1.EscalationPolicy/description:
        source: EscalationPolicy defines SLA and escalation levels.
        ru: EscalationPolicy определяет SLA и уровни эскалации.
      /components/schemas/psim.response.v1.InstructionParams/description:
        source: InstructionParams shows text the operator must read and confirm.
        ru: InstructionParams показывает текст, который оператор должен прочитать и подтвердить.
      /components/schemas/psim.response.v1.Notification/properties/aggregatedNotificationIds/description:
        source: Set for aggregated notifications (N3).
        ru: Задаётся для агрегированных уведомлений (N3).
      /components/schemas/psim.response.v1.Notification/properties/read/description:
        source: In-app notifications only.
        ru: Только для внутренних уведомлений приложения.
      /components/schemas/psim.response.v1.Notification/properties/requestId/description:
        source: Stable source request and delivery receipt identities.
        ru: Стабильные идентификаторы исходного запроса и квитанции доставки.
      /components/schemas/psim.response.v1.Notification/description:
        source: Notification is a message to a recipient over a channel.
        ru: Notification - сообщение получателю по каналу.
      /components/schemas/psim.response.v1.NotifyParams/description:
        source: NotifyParams sends notifications.
        ru: NotifyParams отправляет уведомления.
      /components/schemas/psim.response.v1.PlanBinding/properties/bindingPriority/description:
        source: Tie-breaker among bindings with equal specificity.
        ru: Приоритет при равной специфичности привязок.
      /components/schemas/psim.response.v1.PlanBinding/description:
        source: PlanBinding selects incidents a plan applies to; the most specific binding wins (P5).
        ru: PlanBinding выбирает инциденты для сценария; применяется наиболее специфичная привязка (P5).
      /components/schemas/psim.response.v1.Recipient/properties/currentDuty/description:
        source: Resolve the current site duty at escalation dispatch. Must be true.
        ru: Определять текущего дежурного площадки при отправке эскалации. Должно быть true.
      /components/schemas/psim.response.v1.Recipient/description:
        source: 'Recipient is a notification recipient: a user or a role within the incident scope.'
        ru: 'Recipient - получатель уведомления: пользователь или роль в области инцидента.'
      /components/schemas/psim.response.v1.ResponsePlan/description:
        source: ResponsePlan is one immutable version of a response plan.
        ru: ResponsePlan - одна неизменяемая версия сценария реагирования.
      /components/schemas/psim.response.v1.ResponseRun/properties/blockingStepIds/description:
        source: Unfinished mandatory steps (RR5).
        ru: Незавершённые обязательные шаги (RR5).
      /components/schemas/psim.response.v1.ResponseRun/description:
        source: ResponseRun is the execution of a plan version for an incident.
        ru: ResponseRun - исполнение версии сценария для инцидента.
      /components/schemas/psim.response.v1.SlaTarget/description:
        source: SlaTarget is the SLA for one priority.
        ru: SlaTarget - SLA для одного приоритета.
      /components/schemas/psim.response.v1.Step/properties/nextStepId/description:
        source: Next step for all kinds except decision; empty for a final step.
        ru: Следующий шаг для всех видов, кроме decision; пустой для последнего шага.
      /components/schemas/psim.response.v1.Step/description:
        source: Step is a node of a plan graph.
        ru: Step - узел графа сценария.
      /components/schemas/psim.response.v1.StepExecution/description:
        source: StepExecution is the execution state of one step.
        ru: StepExecution - состояние исполнения одного шага.
      /components/schemas/psim.response.v1.StepResult/properties/note/description:
        source: Reason for skip or override, or a free note.
        ru: Причина пропуска или override либо свободное примечание.
      /components/schemas/psim.response.v1.StepResult/properties/overridden/description:
        source: Set when a supervisor completed a failed step (Override).
        ru: Задаётся, когда supervisor завершает неуспешный шаг через Override.
      /components/schemas/psim.response.v1.StepResult/description:
        source: StepResult is what the step produced.
        ru: StepResult - результат шага.
      /components/schemas/psim.response.v1.WaitParams/description:
        source: WaitParams pauses the plan.
        ru: WaitParams приостанавливает сценарий.
      /components/schemas/Problem/description:
        source: Error body (RFC 9457), see psim.api.v1.Problem.
        ru: Тело ошибки (RFC 9457), см. psim.api.v1.Problem.
      /components/securitySchemes/oidc/description:
        source: Access token issued by Keycloak (OIDC Authorization Code + PKCE).
        ru: Токен доступа, выданный Keycloak (OIDC Authorization Code + PKCE).
      /components/parameters/IfMatch/description:
        source: Expected resource version (ETag). Required for updates of versioned resources.
        ru: Ожидаемая версия ресурса (ETag). Обязательна для обновления версионированных ресурсов.
      /components/parameters/IdempotencyKey/description:
        source: UUID; repeated requests with the same key return the first result.
        ru: UUID; повторные запросы с тем же ключом возвращают первый результат.
      /components/responses/Problem/description:
        source: Error (RFC 9457).
        ru: Ошибка (RFC 9457).
      /tags/0/description:
        source: 'AuditService searches and verifies the audit chain (ADR-021). Owner: Audit Service.'
        ru: 'AuditService ищет и проверяет цепочку аудита (ADR-021). Владелец: Audit Service.'
      /tags/1/description:
        source: "CatalogService manages sites, buildings, floors, zones, device types, devices and connectors.\n Owner: Resource\
          \ Catalog."
        ru: 'CatalogService управляет площадками, зданиями, этажами, зонами, типами устройств, устройствами и коннекторами.
          Владелец: Resource Catalog.'
      /tags/2/description:
        source: 'CommandService manages commands to devices. Owner: Command Service.'
        ru: 'CommandService управляет командами устройств. Владелец: Command Service.'
      /tags/3/description:
        source: "CorrelationRuleService manages correlation rules and the active rule set.\n Owner: Correlation Engine (rule\
          \ management module)."
        ru: 'CorrelationRuleService управляет правилами корреляции и активным набором правил. Владелец: Correlation Engine,
          модуль управления правилами.'
      /tags/4/description:
        source: 'EscalationPolicyService manages SLA and escalation policies. Owner: Response Engine.'
        ru: 'EscalationPolicyService управляет SLA и политиками эскалации. Владелец: Response Engine.'
      /tags/5/description:
        source: 'EventHistoryService searches stored events (ADR-028). Owner: Event History.'
        ru: 'EventHistoryService ищет сохранённые события (ADR-028). Владелец: Event History.'
      /tags/6/description:
        source: 'FeedService serves console read models. Owner: Projection Service.'
        ru: 'FeedService предоставляет read-модели консоли. Владелец: Projection Service.'
      /tags/7/description:
        source: 'IncidentService manages incidents and incident types. Owner: Incident Service.'
        ru: 'IncidentService управляет инцидентами и их типами. Владелец: Incident Service.'
      /tags/8/description:
        source: 'MappingService manages mapping rules of connector types. Owner: Resource Catalog; publishes to psim.config.v1.'
        ru: 'MappingService управляет правилами нормализации типов коннекторов. Владелец: Resource Catalog; публикует в psim.config.v1.'
      /tags/9/description:
        source: 'MeService describes the caller. Owner: API Gateway (from the access token and the policy table).'
        ru: 'MeService описывает вызывающего субъекта. Владелец: API Gateway; данные из токена доступа и таблицы политик.'
      /tags/10/description:
        source: 'NotificationContactService manages channel destinations. Owner: Notification Service.'
        ru: 'NotificationContactService управляет адресами доставки каналов. Владелец: Notification Service.'
      /tags/11/description:
        source: 'NotificationService serves in-app notifications of the caller. Owner: Notification Service.'
        ru: 'NotificationService предоставляет внутренние уведомления вызывающего пользователя. Владелец: Notification Service.'
      /tags/12/description:
        source: "OperationalService owns alarm controls, collaboration, history and isolated exercises.\n Owner: Incident\
          \ Service. All source data is resolved using the caller's current scope."
        ru: 'OperationalService владеет управлением тревогами, совместной работой, историей и изолированными упражнениями.
          Владелец: Incident Service. Все исходные данные разрешаются по текущей области доступа вызывающего субъекта.'
      /tags/13/description:
        source: "ReportService builds incident reports (ADR-028: analytics in ClickHouse).\n Owner: Projection Service."
        ru: 'ReportService формирует отчёты по инцидентам (ADR-028: аналитика в ClickHouse). Владелец: Projection Service.'
      /tags/14/description:
        source: 'ResponsePlanService manages response plans. Owner: Response Engine.'
        ru: 'ResponsePlanService управляет сценариями реагирования. Владелец: Response Engine.'
      /tags/15/description:
        source: 'ResponseRunService executes plan steps. Owner: Response Engine.'
        ru: 'ResponseRunService исполняет шаги сценариев. Владелец: Response Engine.'
      /tags/16/description:
        source: "SettingsService manages tenant-wide retention and processing settings.\n Owner: Resource Catalog; changes\
          \ are published to psim.config.v1."
        ru: 'SettingsService управляет сроками хранения и параметрами обработки тенанта. Владелец: Resource Catalog; изменения
          публикуются в psim.config.v1.'
      /tags/17/description:
        source: 'SiteDutyService assigns explicit site responsibility. Owner: Response Engine.'
        ru: 'SiteDutyService назначает явного ответственного за площадку. Владелец: Response Engine.'
