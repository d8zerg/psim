        ru: Не менее 75 000 долговечно сохранённых событий/с с одной машины; TLS-приёмник сверяет все номера и порядок источников
      /methods/29/criteria:
        source: 500 consoles; REST read p99 <= 200 ms; realtime delivery p99 <= 200 ms; event -> rendering p99 <= 1 s during
