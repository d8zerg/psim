      /methods/30/name:
        source: Ingestion through two gateway instances
        ru: Ввод через два экземпляра шлюза
      /methods/106/name:
        source: Event history and incident links
        ru: История событий и связи инцидентов
      /methods/58/criteria:
        source: At least 75 000 durably stored events/s from one machine; the TLS receiver reconciles every sequence number
