# Scope of the push pipeline (`task ci`, ADR-034): what changed relative to origin/master decides
# which expensive stages run and on which targets. `task ci:nightly` and `task release` always run
# the full scope. Patterns are fnmatch globs over repository-relative paths ("*" spans directories).

# Changes that can affect any build or check: the whole scope runs.
full:
  - CMakeLists.txt
  - CMakePresets.json
  - Taskfile.yml
  - conanfile.py
  - conan.lock
  - .clang-tidy
  - .clang-format
  - cmake/*
  - tools/toolchain/*
  - tools/conan/*
  - tools/cpp/*
  - tools/ci/*
  - tools/taskfiles/cpp.yml
  - tools/taskfiles/arch.yml

# Optional stages and the paths that enable them; C++ stages run for changed modules and every
# target that depends on them (CMake code model).
stages:
  fuzz_rules: ['libs/domain/processing/*', 'services/correlation-engine/*', 'contracts/proto/psim/processing/v1/rules.proto', 'tools/rules/*', 'tools/taskfiles/fuzz.yml']
  contracts: ['contracts/*', 'tools/contracts/*']
  # The portal (docs:portal) is built from the documents and from the contracts.
  docs: ['docs/*', '*.md', 'contracts/*', 'tools/docs/*', 'tools/quality/*', 'tools/security/*']
  deps: ['conanfile.py', 'conan.lock', 'web/pnpm-lock.yaml', 'tools/release/licenses.yaml', 'tools/taskfiles/security.yml']
  release: ['deploy/images/*', 'tools/release/*', 'tools/taskfiles/release.yml']
  # The environment also hosts the component tests of adapters (TS-03) and the registry check (FF-04).
  env: ['deploy/local/*', 'tools/env/*', 'tools/taskfiles/env.yml', 'tools/taskfiles/test.yml', 'tools/taskfiles/flow.yml', 'tools/taskfiles/gateway.yml', 'tools/gateway-admin/*', 'tools/event-flow/*', 'web/apps/console/*', 'web/packages/realtime-client/*', 'libs/platform/stream/*', 'connectors/*', 'contracts/topics/*',
        'contracts/proto/*', 'tools/contracts/registry.py', 'libs/platform/kafka/*', 'libs/platform/pg/*', 'libs/platform/redis/*', 'libs/platform/security/*', 'libs/platform/clickhouse/*', 'libs/platform/s3/*',
        'libs/domain/processing/*', 'services/connector-gateway/*', 'services/normalizer/*', 'services/correlation-engine/*', 'services/incident-service/*', 'services/api-gateway/*', 'services/resource-catalog/*', 'tools/catalog/*', 'tools/taskfiles/catalog.yml', 'services/event-history/*', 'tools/processing/*', 'tools/taskfiles/processing.yml', 'tools/rules/*', 'tools/taskfiles/rules.yml', 'tools/correlation/*', 'tools/taskfiles/correlation.yml', 'libs/domain/incident/*', 'libs/platform/authz/*', 'tools/incidents/*', 'tools/taskfiles/incidents.yml', 'tools/history/*', 'tools/taskfiles/history.yml', 'services/command-service/*', 'libs/domain/response/*', 'tools/commands/*', 'tools/taskfiles/commands.yml', 'services/response-engine/*', 'libs/platform/timers/*', 'tools/response/*', 'tools/taskfiles/response.yml']
  connectors: ['connectors/*', 'libs/platform/connector/*', 'libs/platform/security/*', 'contracts/proto/psim/connector/*', 'tools/connector-conformance/*', 'tools/connectors/*', 'tools/taskfiles/connectors.yml', 'tools/env/event_flow_tls.sh']
  web: ['web/*', 'contracts/openapi/*', 'contracts/proto/*', 'tools/taskfiles/web.yml']
  bench: ['tools/bench/*', 'tools/taskfiles/bench.yml']
