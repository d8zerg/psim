version: '3'
tasks:
  lifecycle:test:
    desc: Verify signatures, compatibility, configuration preservation and initial-install boundaries in Docker
    cmds:
      - docker run --rm --user {{.UID}}:{{.GID}} --volume "{{.ROOT_DIR}}:/repo:ro" --workdir /repo {{.TOOLCHAIN_IMAGE}} python3 -I tools/deploy/test_lifecycle.py
      - docker run --rm --user 0:0 --volume "{{.ROOT_DIR}}:/repo:ro" --workdir /repo {{.TOOLCHAIN_IMAGE}} python3 -I tools/deploy/test_install.py
      - docker run --rm --user 0:0 --volume "{{.ROOT_DIR}}:/repo:ro" --volume "{{.ROOT_DIR}}/build/debian13/release/packages:/packages:ro" --workdir /repo {{.TOOLCHAIN_IMAGE}} python3 -I tools/deploy/test_packages.py
  upgrade:preflight:
    desc: Verify the separately trusted release, complete artifact inventory and mixed-version contracts
    requires: {vars: [BUNDLE, BASELINE, RELEASE, TRUSTED_KEY]}
    cmds:
      - python3 -I tools/deploy/upgrade.py preflight --bundle "{{.BUNDLE}}" --baseline "{{.BASELINE}}" --release "{{.RELEASE}}" --trusted-key "{{.TRUSTED_KEY}}"
  upgrade:prepare:
    desc: Stage signed releases and retain the active installation on every application node
    requires: {vars: [BUNDLE, BASELINE, RELEASE, TRUSTED_KEY]}
    cmds:
      - python3 -I tools/deploy/upgrade.py prepare --bundle "{{.BUNDLE}}" --baseline "{{.BASELINE}}" --release "{{.RELEASE}}" --trusted-key "{{.TRUSTED_KEY}}"
  upgrade:apply:
    desc: Apply expand migrations and replace healthy application replicas serially
    requires: {vars: [BUNDLE, BASELINE, RELEASE, TRUSTED_KEY]}
    cmds:
      - python3 -I tools/deploy/upgrade.py apply --bundle "{{.BUNDLE}}" --baseline "{{.BASELINE}}" --release "{{.RELEASE}}" --trusted-key "{{.TRUSTED_KEY}}"
  upgrade:rollback:
    desc: Restore retained configuration and application versions before the contract barrier
    requires: {vars: [BUNDLE, BASELINE, RELEASE, TRUSTED_KEY]}
    cmds:
      - python3 -I tools/deploy/upgrade.py rollback --bundle "{{.BUNDLE}}" --baseline "{{.BASELINE}}" --release "{{.RELEASE}}" --trusted-key "{{.TRUSTED_KEY}}"
  upgrade:contract:
    desc: Fence rollback and contract the previous expansion only after all readers use a later epoch
    requires: {vars: [BUNDLE, BASELINE, RELEASE, TRUSTED_KEY]}
    cmds:
      - python3 -I tools/deploy/upgrade.py contract --bundle "{{.BUNDLE}}" --baseline "{{.BASELINE}}" --release "{{.RELEASE}}" --trusted-key "{{.TRUSTED_KEY}}"
  upgrade:qualify:
    desc: Verify the signed upgrade and rollback under continuous publication and public floor reads
    requires: {vars: [BASELINE, RELEASE, TRUSTED_KEY]}
    cmds:
      - python3 -I tools/deploy/qualify_upgrade.py --baseline "{{.BASELINE}}" --release "{{.RELEASE}}" --trusted-key "{{.TRUSTED_KEY}}" --rate {{.RATE | default "50000"}} --runtime {{.RUNTIME | default "containers"}}
  check:
    desc: Validate deployment profiles, process isolation and Helm material isolation without VMs
    cmds:
      - python3 -I tools/deploy/check.py
  images:
    desc: Build release services and the configured infrastructure images
    cmds:
      - task: :release:images
      - task: :web:install
      - task: :web:_run
        vars: {CMD: pnpm exec turbo run gen build --output-logs=errors-only}
      - python3 -I tools/deploy/images.py --version {{.VERSION | default "0.1.0"}}
  render:
    desc: Generate an immutable public deployment bundle from an inventory
    requires:
      vars: [PROFILE, OUTPUT]
    cmds:
      - python3 -I tools/deploy/deploy.py render --profile {{.PROFILE}} --output {{.OUTPUT}}
  vm:up:
    desc: Install or resume the complete local VM deployment
    cmds:
      - python3 -I tools/deploy/lab.py up --topology {{.TOPOLOGY | default "cluster"}}
  vm:down:
    desc: Stop the local VM deployment while preserving disks and credentials
    cmds:
      - python3 -I tools/deploy/lab.py down
  vm:destroy:
    desc: Remove the owned VM deployment, disks, lab credentials and node payloads
    cmds:
      - python3 -I tools/deploy/lab.py destroy
  vm:status:
    desc: Show the owned deployment factory record
    cmds:
      - python3 -I tools/deploy/lab.py status
  flow:
    desc: Verify a fresh connector, floor, normalized event, incident and console projection
    cmds:
      - python3 -I tools/deploy/flow.py
  storage:qualify:
    desc: Verify private floor storage through every independent volume, filer and S3 process failure
    cmds:
      - python3 -I tools/deploy/storage.py
  gateway:bench:
    desc: Measure durable input on two gateways and reconcile all acknowledged events
    cmds:
      - python3 -I tools/deploy/gateway.py bench
  gateway:failover:
    desc: Kill the active gateway and verify SDK reconnection without lost events
    cmds:
      - python3 -I tools/deploy/gateway.py failover
  gateway:qualify:
    desc: Qualify two-gateway durable throughput and active-process loss
    cmds:
      - task: gateway:bench
      - task: gateway:failover
  postgres:qualify:
    desc: Cut primary VM power and measure acknowledged-write recovery
    cmds:
      - python3 -I tools/deploy/ha.py
  console:qualify:
    desc: Suspend the console writer and verify standby promotion and resumed-writer fencing
    cmds:
      - python3 -I tools/deploy/qualify.py --bundle build/deployment/lab-cluster --output build/deployment/console-qualification.json console-failover
  runtime:
    desc: Switch PSIM applications between containers and Debian packages under systemd
    cmds:
      - python3 -I tools/deploy/native.py {{.RUNTIME | default "containers"}}
  pki:request:
    desc: Generate fresh private keys and export public requests for external authorities
    requires: {vars: [BUNDLE, PRIVATE, REQUESTS]}
    cmds:
      - python3 -I tools/deploy/provision.py request --bundle "{{.BUNDLE}}" --private "{{.PRIVATE}}" --requests "{{.REQUESTS}}"
  pki:complete:
    desc: Validate external identities and complete per-role private material
    requires: {vars: [BUNDLE, PRIVATE, TRUST, SIGNED]}
    cmds:
      - python3 -I tools/deploy/provision.py complete --bundle "{{.BUNDLE}}" --private "{{.PRIVATE}}" --trust "{{.TRUST}}" --signed "{{.SIGNED}}"
  pki:package:
    desc: Export isolated private payloads for externally provisioned nodes
    requires: {vars: [BUNDLE, PRIVATE, PAYLOADS]}
    cmds:
      - python3 -I tools/deploy/provision.py package --bundle "{{.BUNDLE}}" --private "{{.PRIVATE}}" --payloads "{{.PAYLOADS}}"
  account:
    desc: Create the initial administrator with mandatory password change and TOTP
    requires: {vars: [BUNDLE, PRIVATE, USERNAME]}
    cmds:
      - python3 -I tools/deploy/account.py --bundle "{{.BUNDLE}}" --private "{{.PRIVATE}}" --username "{{.USERNAME}}"
  operators:qualify:
    desc: Verify pinned infrastructure operator checksums and render their charts
    cmds:
      - python3 -I tools/deploy/operators.py
