# C++ toolchain image (ADR-032). Namespace "toolchain"; working directory is the repository root.
version: '3'

tasks:
  build:
    desc: Build the C++ toolchain image (Debian 13 x86_64, clang 21, system libstdc++)
    status:
      - '[ "${PSIM_IN_TOOLCHAIN:-0}" = "1" ] || docker image inspect {{.TOOLCHAIN_IMAGE}} >/dev/null 2>&1'
    cmds:
      - docker build --platform linux/amd64 --build-arg BASE={{.TOOLCHAIN_BASE}} -t {{.TOOLCHAIN_IMAGE}} {{.ROOT_DIR}}/tools/toolchain

  shell:
    desc: Interactive shell in the toolchain container
    interactive: true
    cmds:
      - task: :cpp:_run
        vars: {CMD: bash, TTY: '-it'}
