# Web monorepo (ADR-037): pnpm + Turborepo in web/. Namespace "web"; working directory is
# the repository root. Node runs in a pinned container (pnpm through corepack, version from
# web/package.json, shim in .cache/web/bin); caches live in .cache/web. Playwright runs in its own image with browsers.
version: '3'

vars:
  NODE_IMAGE: node:24.21.0-trixie@sha256:1278a37eb510ec1606fba0e80f554bcc941ae0b44f35ae373c4822ae7717c64d
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
  WEB_CACHE: '{{.CACHE}}/web'

tasks:
  install:
    desc: Install dependencies from the lock file (web/pnpm-lock.yaml)
    sources:
      - web/pnpm-lock.yaml
      - web/package.json
      - web/*/*/package.json
    generates:
      - web/node_modules/.modules.yaml
    cmds:
      - task: _run
        vars: {CMD: pnpm install --frozen-lockfile}

  lock:
    desc: Resolve dependencies into web/pnpm-lock.yaml (after changing a package.json)
    cmds:
      - task: _run
        vars: {CMD: pnpm install --no-frozen-lockfile}

  check:
    desc: 'All web checks: format, generated clients, lint, types, tests with coverage, build, bundle budgets, visual regression and accessibility'
    cmds:
      - task: install
      - task: _run
        vars:
          CMD: pnpm format && node --test eslint-rules/tokens-only.check.js && pnpm exec turbo run gen lint typecheck test build size --output-logs=errors-only
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm --filter @psim/console exec playwright test --grep @gate
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm --filter @psim/design-system exec playwright test --grep @gate

  gen:
    desc: Generate API and realtime clients, presentation tokens and local font assets
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm gen}

  test:
    desc: Unit tests with coverage thresholds (Vitest)
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm test}

  format:fix:
    desc: Format web sources with Prettier
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm format:fix}

  e2e:
    desc: End-to-end checks of the built console and component catalogue in Chromium
    cmds:
      - task: install
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm exec turbo run e2e --output-logs=errors-only

  a11y:
    desc: Accessibility of console layouts and component stories across all presentations, with keyboard checks
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm exec turbo run gen build --output-logs=errors-only}
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm --filter @psim/console exec playwright test --grep @a11y
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm --filter @psim/design-system exec playwright test --grep @a11y

  visual:update:
    desc: Regenerate component visual baselines for review
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm exec turbo run gen build --output-logs=errors-only}
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm --filter @psim/console exec playwright test --grep @visual --update-snapshots
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm --filter @psim/design-system exec playwright test --grep @visual --update-snapshots

  catalogue:
    desc: Ladle component catalogue on http://localhost:61000
    interactive: true
    cmds:
      - task: gen
      - task: _run
        vars:
          TTY: -it -p 127.0.0.1:61000:61000
          CMD: pnpm --filter @psim/design-system catalogue

  catalogue:check:
    desc: Build and check component stories, interactions, accessibility and screenshots
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm exec turbo run gen build --filter=@psim/design-system --output-logs=errors-only}
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: >-
            pnpm --filter @psim/design-system exec playwright test --grep '{{.GREP | default "@gate"}}'

  catalogue:visual:update:
    desc: Generate component catalogue visual baselines for review
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm exec turbo run gen build --filter=@psim/design-system --output-logs=errors-only}
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: >-
            pnpm --filter @psim/design-system exec playwright test --grep '{{.GREP | default "@visual"}}' --update-snapshots

  benchmark:
    desc: Compare deterministic collection rendering in an isolated Chromium worker
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm exec turbo run gen build --filter=@psim/design-system --output-logs=errors-only}
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm --filter @psim/design-system exec playwright test --config benchmark.config.ts

  changeset:status:
    desc: Inspect the release plan without updating versions, tags or commits
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm changeset:status}

  stability:
    desc: Check retained rows, focus and layout during refresh and connection loss
    cmds:
      - task: install
      - task: _run
        vars: {CMD: pnpm exec turbo run gen build --output-logs=errors-only}
      - task: _run
        vars:
          IMAGE: '{{.PLAYWRIGHT_IMAGE}}'
          CMD: pnpm --filter @psim/console exec playwright test --grep 'retains DOM|status layout'

  dev:
    desc: Vite dev server of the console on http://localhost:5173
    interactive: true
    cmds:
      - task: gen
      - task: _run
        vars:
          TTY: -it -p 127.0.0.1:5173:5173
          CMD: pnpm --filter @psim/console dev

  _run:
    internal: true
    requires:
      vars: [CMD]
    env:
      PSIM_CMD: '{{.CMD}}'
    cmds:
      - mkdir -p "{{.WEB_CACHE}}/bin" "{{.WEB_CACHE}}/home" "{{.WEB_CACHE}}/pnpm-store" "{{.WEB_CACHE}}/corepack" "{{.WEB_CACHE}}/buf"
      - >-
        docker run --rm {{.TTY}} -u {{.UID}}:{{.GID}}
        -e PSIM_CMD -e HOME=/cache/home -e COREPACK_HOME=/cache/corepack -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        -e npm_config_store_dir=/cache/pnpm-store -e BUF_CACHE_DIR=/cache/buf -e TURBO_TELEMETRY_DISABLED=1
        -e DO_NOT_TRACK=1 -e CI=true -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
        -v "{{.ROOT_DIR}}":/repo -v "{{.WEB_CACHE}}":/cache -w /repo/web
        {{.IMAGE | default .NODE_IMAGE}} bash -c
        'corepack enable --install-directory /cache/bin pnpm && export PATH=/cache/bin:$PATH && eval "$PSIM_CMD"'
