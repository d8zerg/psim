# C++ build: Conan dependencies, CMake presets, tests, reproducibility (step 1.1, ADR-032);
# quality gates: formatting, clang-tidy, sanitizers, coverage (step 1.2, ADR-033).
# Namespace "cpp"; working directory is the repository root.
# Build commands run in the toolchain container (Debian 12 base); inside the container
# (PSIM_IN_TOOLCHAIN=1) they run directly. Artifacts are verified on the target platforms by
# runtime-test (Debian 12, Astra Linux 1.8).
#   PRESET    debug (default) | release | relwithdebinfo | asan | tsan | coverage
#   JOBS      parallel jobs (default: half of the CPUs)
#   LABELS    ctest label regex limiting the tests (task ci passes affected targets; empty: all)
#   FILES     translation units for clang-tidy (task ci passes affected ones; empty: all)
#   MODULES   coverage modules to gate (task ci passes affected ones; empty: all)
version: '3'

vars:
  PROFILE: tools/conan/profiles/clang21-libcxx
  # Dependencies instrumented with ThreadSanitizer for the tsan preset (ADR-033).
  PROFILE_TSAN: tools/conan/profiles/clang21-libcxx-tsan
  # Project C++ sources: formatting and clang-tidy scope (generated and vendored code excluded).
  CXX_FILES: git ls-files -co --exclude-standard -- '*.cpp' '*.hpp' '*.h' '*.cc' ':!:**/third_party/**'
  # Translation units checked by clang-tidy (regex over compile_commands.json entries).
  TIDY_SCOPE: '^/repo/(libs|services|connectors|tools|contracts/(tests|benchmarks))/'

tasks:
  build:
    desc: Install dependencies, configure and build PRESET
    vars:
      PRESET: '{{.PRESET | default "debug"}}'
    cmds:
      - task: configure
        vars: {PRESET: '{{.PRESET}}'}
      - task: _run
        vars:
          CMD: cmake --build --preset {{.PRESET}} -j {{.JOBS}}

  configure:
    desc: Install dependencies and configure PRESET (also writes the CMake File API code model)
    vars:
      PRESET: '{{.PRESET | default "debug"}}'
      QUERY: build/{{.PLATFORM}}/{{.PRESET}}/.cmake/api/v1/query
    cmds:
      - task: '{{if eq .PRESET "tsan"}}deps:tsan{{else}}deps{{end}}'
      - task: _run
        vars:
          CMD: mkdir -p {{.QUERY}} && touch {{.QUERY}}/codemodel-v2 && cmake --preset {{.PRESET}} >/dev/null

  test:
    desc: Build and run tests of PRESET in the toolchain
    vars:
      PRESET: '{{.PRESET | default "debug"}}'
    cmds:
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
      - task: _run
        vars:
          CMD: ctest --preset {{.PRESET}} -j {{.JOBS}}{{if .LABELS}} -L '{{.LABELS}}' --no-tests=ignore{{end}}

  test:sanitizers:
    desc: Run tests under ASan+UBSan and under TSan (FF-11)
    cmds:
      - task: test
        vars: {PRESET: asan, LABELS: '{{.LABELS}}'}
      - task: test
        vars: {PRESET: tsan, LABELS: '{{.LABELS}}'}

  coverage:
    desc: Measure llvm-cov coverage of the tests and enforce thresholds (FF-12)
    cmds:
      - task: build
        vars: {PRESET: coverage}
      - task: _run
        vars:
          CMD: >-
            rm -rf build/{{.PLATFORM}}/coverage/profiles &&
            ctest --preset coverage -j {{.JOBS}}{{if .LABELS}} -L '{{.LABELS}}' --no-tests=ignore{{end}} &&
            python3 -I tools/cpp/coverage.py build/{{.PLATFORM}}/coverage tools/cpp/coverage.yaml '{{.MODULES}}'

  format:
    desc: Check formatting of C++ sources with clang-format (FILES limits the check)
    cmds:
      - task: _run
        vars:
          CMD: '{{if .FILES}}printf "%s\n" {{.FILES}}{{else}}{{.CXX_FILES}}{{end}} | xargs -r clang-format --dry-run -Werror'

  format:fix:
    desc: Format C++ sources in place
    cmds:
      - task: _run
        vars:
          CMD: '{{.CXX_FILES}} | xargs -r clang-format -i'

  lint:
    desc: Run clang-tidy with the project profile; any finding fails (FF-10, SEC-01)
    cmds:
      - task: build
        vars: {PRESET: debug}
      - task: _run
        vars:
          CMD: >-
            run-clang-tidy -p build/{{.PLATFORM}}/debug -quiet -j {{.JOBS}}
            {{if .FILES}}{{range splitList " " .FILES}}'^/repo/{{.}}$' {{end}}{{else}}'{{.TIDY_SCOPE}}'{{end}}

  deps:
    desc: Build or fetch Conan dependencies (Release, pinned by conan.lock)
    sources:
      - conanfile.py
      - conan.lock
      - '{{.PROFILE}}'
    generates:
      - build/{{.PLATFORM}}/conan/conan_toolchain.cmake
    cmds:
      - task: _run
        vars:
          CMD: >-
            conan install . -pr:a {{.PROFILE}} --lockfile=conan.lock --build=missing
            -c tools.build:jobs={{.JOBS}} -of build/{{.PLATFORM}}/conan

  deps:tsan:
    desc: Build or fetch Conan dependencies instrumented with ThreadSanitizer (tsan preset)
    sources:
      - conanfile.py
      - conan.lock
      - '{{.PROFILE}}'
      - '{{.PROFILE_TSAN}}'
    generates:
      - build/{{.PLATFORM}}/conan-tsan/conan_toolchain.cmake
    cmds:
      - task: _run
        vars:
          CMD: >-
            conan install . -pr:h {{.PROFILE_TSAN}} -pr:b {{.PROFILE}} --lockfile=conan.lock --build=missing
            -c tools.build:jobs={{.JOBS}} -of build/{{.PLATFORM}}/conan-tsan

  lock:
    desc: Re-resolve dependency versions into conan.lock (after changing conanfile.py)
    cmds:
      - task: _run
        vars:
          CMD: conan lock create . -pr:a {{.PROFILE}} --lockfile-out=conan.lock

  reproducible:
    desc: Build release twice in different directories without ccache and compare artifacts (FF-13)
    cmds:
      - task: deps
      - task: _run
        vars:
          CMD: >-
            rm -rf build/{{.PLATFORM}}/repro-a build/{{.PLATFORM}}/repro-b &&
            for d in repro-a repro-b; do
            CCACHE_DISABLE=1 cmake --preset release -B build/{{.PLATFORM}}/$d >/dev/null &&
            CCACHE_DISABLE=1 cmake --build build/{{.PLATFORM}}/$d -j {{.JOBS}} >/dev/null || exit 1; done &&
            python3 -I tools/cpp/compare_builds.py build/{{.PLATFORM}}/repro-a build/{{.PLATFORM}}/repro-b

  runtime-test:
    desc: 'Run built tests and psimctl of PRESET on target platforms (RUNTIMES="debian12 astra18")'
    vars:
      PRESET: '{{.PRESET | default "debug"}}'
      RUNTIMES: '{{.RUNTIMES | default "debian12 astra18"}}'
    deps:
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmds:
      - for: {var: RUNTIMES}
        cmd: >-
          docker run --rm -u {{.UID}}:{{.GID}} -v "{{.ROOT_DIR}}":/repo:ro -w /repo
          {{index .RUNTIME_IMAGES .ITEM}}
          sh /repo/tools/cpp/runtime_test.sh {{.ITEM}} build/{{.PLATFORM}}/{{.PRESET}}

  clean:
    desc: Remove build directories (keeps the Conan and ccache caches)
    cmds:
      - rm -rf build/{{.PLATFORM}}

  _run_env:
    desc: Run CMD in the toolchain on the compose network of environment PROJECT with its PSIM_TEST_* endpoints
    internal: true
    requires:
      vars: [CMD, PROJECT]
    vars:
      CACHE_DIR: '{{.CACHE}}/{{.PLATFORM}}'
    deps:
      - task: :toolchain:build
    env:
      PSIM_CMD: '{{.CMD}}'
      PSIM_PLATFORM: '{{.PLATFORM}}'
    cmds:
      - cmd: |
          mkdir -p "{{.CACHE_DIR}}/home"
          docker run --rm -u {{.UID}}:{{.GID}} --network {{.PROJECT}}_default \
            -e PSIM_CMD -e PSIM_PLATFORM -e HOME=/cache/home \
            -e PSIM_TEST_KAFKA=kafka-1:19092 -e PSIM_TEST_KAFKA_FAULT=toxiproxy:29092 \
            -e PSIM_TEST_TOXIPROXY=toxiproxy:8474 -e PSIM_TEST_REGISTRY=http://registry:8080/apis/ccompat/v7 \
            -v "{{.ROOT_DIR}}":/repo -v "{{.CACHE_DIR}}/home":/cache/home \
            -w /repo {{.TOOLCHAIN_IMAGE}} bash -c 'eval "$PSIM_CMD"'

  _run:
    internal: true
    requires:
      vars: [CMD]
    vars:
      CACHE_DIR: '{{.CACHE}}/{{.PLATFORM}}'
    deps:
      - task: :toolchain:build
    env:
      PSIM_CMD: '{{.CMD}}'
      PSIM_PLATFORM: '{{.PLATFORM}}'
    cmds:
      - cmd: |
          if [ "${PSIM_IN_TOOLCHAIN:-0}" = "1" ]; then
            eval "$PSIM_CMD"
          else
            mkdir -p "{{.CACHE_DIR}}/conan" "{{.CACHE_DIR}}/ccache" "{{.CACHE_DIR}}/home"
            docker run --rm {{.TTY}} -u {{.UID}}:{{.GID}} \
              -e PSIM_CMD -e PSIM_PLATFORM -e HOME=/cache/home \
              -v "{{.ROOT_DIR}}":/repo -v "{{.CACHE_DIR}}/conan":/cache/conan \
              -v "{{.CACHE_DIR}}/ccache":/cache/ccache -v "{{.CACHE_DIR}}/home":/cache/home \
              -w /repo {{.TOOLCHAIN_IMAGE}} bash -c 'eval "$PSIM_CMD"'
          fi
