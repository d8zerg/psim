# Cross-component tests against the local environment. Namespace "test"; working directory is
# the repository root. They need a running environment: `task env:up` (PROJECT=psim-platform) or the
# fresh one of `task env:ci-test` (PROJECT=psim-ci).
version: '3'

tasks:
  s3:
    desc: S3 streaming, integrity, conditional writes, cancellation and network recovery
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :env:s3
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :cpp:build
        vars: {PRESET: debug}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/debug -R '^S3' -j 1 --output-on-failure

  s3:sanitizers:
    desc: S3 unit and component checks under ASan/UBSan and TSan
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :env:s3
        vars: {PROJECT: '{{.PROJECT}}'}
      - for: [asan, tsan]
        task: :cpp:build
        vars: {PRESET: '{{.ITEM}}'}
      - for: [asan, tsan]
        task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/{{.ITEM}} -R '^S3' -j 1 --output-on-failure

  clickhouse:
    desc: Native ClickHouse TLS, batching, migrations, replica recovery and SIGKILL tests
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :env:clickhouse:ha
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :cpp:build
        vars: {PRESET: debug}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/debug -R '^ClickHouse' -j 1 --output-on-failure
      - task: clickhouse:replica
        vars: {PROJECT: '{{.PROJECT}}'}

  clickhouse:replica:
    desc: Stop a real ClickHouse replica, write through failover and reconcile after restart
    dir: deploy/local
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
      PRESET: '{{.PRESET | default "debug"}}'
      PROBE_TABLE:
        sh: python3 -c 'import secrets; print("chprobe_" + secrets.token_hex(8))'
      COMPOSE: docker compose -p {{.PROJECT}} -f compose.yaml --profile clickhouse-ha
    cmds:
      - '{{.COMPOSE}} exec -T clickhouse-1 clickhouse-client --user psim --password psim-dev-clickhouse -q "CREATE TABLE IF NOT EXISTS {{.PROBE_TABLE}} ON CLUSTER psim_clickhouse (tenant_id String, event_id String, occurred_at DateTime64(3), value String) ENGINE=ReplicatedReplacingMergeTree(''/clickhouse/ch-component/{shard}/{database}/{{.PROBE_TABLE}}'', ''{replica}'') ORDER BY (tenant_id,occurred_at,event_id)"'
      - defer: {cmd: '{{.COMPOSE}} start --wait --wait-timeout 120 clickhouse-1'}
      - '{{.COMPOSE}} stop -t 5 clickhouse-1'
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: build/{{.PLATFORM}}/{{.PRESET}}/libs/platform/clickhouse/psim_clickhouse_test_worker replica {{.PROBE_TABLE}} write
      - '{{.COMPOSE}} start --wait --wait-timeout 120 clickhouse-1'
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: build/{{.PLATFORM}}/{{.PRESET}}/libs/platform/clickhouse/psim_clickhouse_test_worker replica {{.PROBE_TABLE}} verify
      - '{{.COMPOSE}} exec -T clickhouse-1 clickhouse-client --user psim --password psim-dev-clickhouse -q "DROP TABLE {{.PROBE_TABLE}} ON CLUSTER psim_clickhouse SYNC"'


  clickhouse:sanitizers:
    desc: Native ClickHouse unit and component paths under ASan/UBSan and TSan
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :env:clickhouse:ha
        vars: {PROJECT: '{{.PROJECT}}'}
      - for: [asan, tsan]
        task: :cpp:build
        vars: {PRESET: '{{.ITEM}}'}
      - for: [asan, tsan]
        task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/{{.ITEM}} -R '^ClickHouse' -j 1 --output-on-failure

  redis:
    desc: Valkey and Sentinel component tests against the local environment (ADR-015)
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :env:valkey:ha
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :cpp:build
        vars: {PRESET: debug}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/debug -L '^component$' -R '^Redis' -j 1 --output-on-failure

  redis:sanitizers:
    desc: Valkey component tests with ASan+UBSan and TSan, including Sentinel failover (ADR-015)
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :env:valkey:ha
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :cpp:build
        vars: {PRESET: asan}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/asan -L '^component$' -R '^Redis' -j 1 --output-on-failure
      - task: :cpp:build
        vars: {PRESET: tsan}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/tsan -L '^component$' -R '^Redis' -j 1 --output-on-failure

  pg:sanitizers:
    desc: 'PostgreSQL component tests with ASan+UBSan and TSan against the environment (FF-11, ADR-014)'
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :cpp:build
        vars: {PRESET: asan}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/asan -L '^component$' -R '^Pg' -j 1 --output-on-failure
      - task: :cpp:build
        vars: {PRESET: tsan}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/tsan -L '^component$' -R '^Pg' -j 1 --output-on-failure

  security:
    desc: Verify JWT/JWKS, secrets, certificate renewal/revocation and native mTLS transports (SR-01, SR-03, SR-04, SR-08, SR-09)
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :env:security
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :cpp:build
        vars: {PRESET: debug}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/debug -R '^Security' -j 1 --output-on-failure

  security:sanitizers:
    desc: Run security unit and component checks with ASan/UBSan and TSan
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :env:security
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :cpp:build
        vars: {PRESET: asan}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/asan -R '^Security' -j 1 --output-on-failure
      - task: :cpp:build
        vars: {PRESET: tsan}
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: ctest --test-dir build/{{.PLATFORM}}/tsan -R '^Security' -j 1 --output-on-failure

  component:
    desc: 'Component tests of adapters against the environment containers, with coverage of the adapter modules (TS-03, FF-12)'
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
      BUILD: build/{{.PLATFORM}}/coverage
    cmds:
      - task: :env:s3
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :env:clickhouse:ha
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :env:valkey:ha
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :env:security
        vars: {PROJECT: '{{.PROJECT}}'}
      - task: :cpp:build
        vars: {PRESET: coverage}
      - task: :contracts:registry:register      # the tests read the schemas of the topics
        vars: {PROJECT: '{{.PROJECT}}'}
      # Unit and component profiles together: adapter modules are gated on both (coverage.yaml).
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: >-
            rm -rf {{.BUILD}}/profiles &&
            export LLVM_PROFILE_FILE=/repo/{{.BUILD}}/profiles/%p-%m.profraw &&
            ctest --test-dir {{.BUILD}} -LE '^component$' -j {{.JOBS}} --output-on-failure -Q &&
            ctest --test-dir {{.BUILD}} -L '^component$' -j 1 --output-on-failure
      - task: :gateway:test
        vars: {PROJECT: '{{.PROJECT}}', PRESET: coverage}
      - task: :flow:test
        vars: {PROJECT: '{{.PROJECT}}', PRESET: coverage}
      - task: :catalog:test
        vars: {PROJECT: '{{.PROJECT}}', PRESET: coverage}
      - task: :connectors:conformance
        vars: {PRESET: coverage, OUTAGE_SECONDS: '1'}
      - task: :cpp:_run
        vars:
          CMD: >-
            LLVM_PROFILE_FILE=/repo/{{.BUILD}}/profiles/%p-%m.profraw
            python3 -I tools/connectors/load.py --preset coverage --count 10000 --minimum-rate 0 &&
            python3 -I tools/cpp/coverage.py {{.BUILD}} tools/cpp/coverage.yaml '' --component

  observability:
    desc: 'Every service exports /health/live, /health/ready, /metrics, JSON logs and traces and drains on SIGTERM (FF-06)'
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :cpp:build
        vars: {PRESET: debug}
      - '{{.PYTHON}} tools/env/envctl.py observability {{.PROJECT}} build/{{.PLATFORM}}/debug {{index .RUNTIME_IMAGES "debian13"}}'
