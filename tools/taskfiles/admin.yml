version: '3'
vars:
  ADMIN_PROJECT: '{{.ADMIN_PROJECT | default "psim-admin-test"}}'
  PRESET: '{{.PRESET | default "release"}}'
tasks:
  test:
    desc: Administrative browser with real PKCE, connector certificates, catalog, import, rules and response plans
    cmds:
      - task: :cpp:build
        vars: {PRESET: '{{.PRESET}}'}
      - task: :web:gen
      - task: :web:_run
        vars: {CMD: pnpm --filter @psim/console build}
      - python3 -I tools/admin/check.py {{.ADMIN_PROJECT}} {{.PRESET}}
