# Local environment (step 1.4, ADR-035): Kafka (KRaft, 1 or 3 brokers), Schema Registry,
# PostgreSQL, ClickHouse with Keeper, Valkey, Keycloak with the realm psim, OpenTelemetry Collector,
# Prometheus, Loki, Tempo, Grafana, Toxiproxy. Namespace "env"; working directory is the repository root.
#   KAFKA   1 (default) or 3 brokers; switching needs `task env:reset` (the KRaft quorum changes)
version: '3'

vars:
  COMPOSE_DIR: deploy/local
  ENVCTL: '{{.PYTHON}} tools/env/envctl.py'
  KAFKA: '{{.KAFKA | default "1"}}'
  KAFKA_ENV: >-
    {{if eq .KAFKA "3"}}COMPOSE_PROFILES=kafka3 PSIM_KAFKA_RF=3 PSIM_KAFKA_MIN_ISR=2
    PSIM_KAFKA_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093{{end}}
  TOPIC_PROFILE: '{{if eq .KAFKA "3"}}cluster{{else}}single{{end}}'
  PROJECT: '{{.PROJECT | default "psim-platform"}}'
  CI_PROJECT: psim-ci
  # Startup budget from scratch (DoD of step 1.4), checked by env:ci-test.
  UP_BUDGET: 300

tasks:
  valkey:ha:
    desc: Start the isolated Valkey primary, two replicas and three Sentinels for component tests
    dir: '{{.COMPOSE_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :cpp:_run
        vars: {CMD: sh tools/env/valkey_test_tls.sh}
      - docker compose -p {{.PROJECT}} -f compose.yaml --profile valkey-ha up -d --force-recreate --renew-anon-volumes --wait --wait-timeout 90 valkey-primary valkey-replica-1 valkey-replica-2 valkey-sentinel-1 valkey-sentinel-2 valkey-sentinel-3 valkey-tls

  security:
    desc: Start isolated mTLS Kafka, PostgreSQL and Valkey transports and reconcile the development Keycloak audience
    dir: '{{.COMPOSE_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :cpp:_run
        vars: {CMD: sh tools/env/security_test_tls.sh && sh tools/env/valkey_test_tls.sh}
      - docker compose -p {{.PROJECT}} -f compose.yaml --profile security up -d --force-recreate --renew-anon-volumes --wait --wait-timeout 150 kafka-tls postgres-tls valkey-tls
      - task: :cpp:_run_env
        vars:
          PROJECT: '{{.PROJECT}}'
          CMD: python3 -I tools/env/keycloak_security.py http://keycloak:8080

  clickhouse:ha:
    desc: Start isolated ClickHouse replicas with native mTLS and Keeper for component tests
    dir: '{{.COMPOSE_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "psim-platform"}}'
    cmds:
      - task: :cpp:_run
        vars: {CMD: sh tools/env/clickhouse_test_tls.sh}
      - docker compose -p {{.PROJECT}} -f compose.yaml --profile clickhouse-ha up -d --force-recreate --renew-anon-volumes --wait --wait-timeout 150 clickhouse-1 clickhouse-2

  up:
    desc: 'Start the interactive environment on 127.0.0.1 ports and create Kafka topics (KAFKA=1|3)'
    preconditions:
      - sh: '[ "{{.KAFKA}}" = 1 ] || [ "{{.KAFKA}}" = 3 ]'
        msg: KAFKA must be 1 or 3
      - sh: '[ ! -f {{.CACHE}}/env/kafka ] || [ "$(cat {{.CACHE}}/env/kafka)" = "{{.KAFKA}}" ]'
        msg: 'the environment runs with a different number of brokers; run: task env:reset'
    cmds:
      - cmd: |
          start=$(date +%s)
          cd {{.COMPOSE_DIR}}
          env {{.KAFKA_ENV}} docker compose -p {{.PROJECT}} -f compose.yaml -f compose.ports.yaml up -d --wait --wait-timeout 600 --quiet-pull
          cd - >/dev/null
          {{.ENVCTL}} wait {{.PROJECT}}
          {{.ENVCTL}} topics {{.PROJECT}} {{.TOPIC_PROFILE}}
          mkdir -p {{.CACHE}}/env && echo {{.KAFKA}} > {{.CACHE}}/env/kafka
          echo "env: ready in $(( $(date +%s) - start ))s ({{.KAFKA}} Kafka broker(s))"
      - task: endpoints

  endpoints:
    desc: Show the endpoints and development credentials of the interactive environment
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Kafka           localhost:9092 (KAFKA=3: also 9192, 9292); services: kafka-1:19092; faults: toxiproxy:29092
        Schema Registry http://localhost:8081/apis/ccompat/v7
        PostgreSQL      localhost:5432  db/user psim, registry, keycloak; password psim-dev-<user>; faults: toxiproxy:15432
        ClickHouse      http://localhost:8123, native localhost:9000; user psim / psim-dev-clickhouse
        Valkey          localhost:6379  password psim-dev-valkey
        Keycloak        http://localhost:8180  admin / psim-dev-keycloak-admin; realm psim, users <role>1 / psim-dev-Passw0rd
        OTLP            localhost:4317 (gRPC), localhost:4318 (HTTP)
        Grafana         http://localhost:3000  admin / psim-dev-grafana
        Prometheus      http://localhost:9090   Loki http://localhost:3100   Tempo http://localhost:3200
        Toxiproxy API   http://localhost:8474
        EOF

  test:
    desc: Smoke tests of the running interactive environment
    cmds:
      - '{{.ENVCTL}} test {{.PROJECT}} {{.KAFKA}}'

  ps:
    desc: Status of the environment containers
    dir: '{{.COMPOSE_DIR}}'
    cmds:
      - docker compose -p {{.PROJECT}} --profile kafka3 ps

  logs:
    desc: 'Follow logs (SERVICE=<name> for one service)'
    dir: '{{.COMPOSE_DIR}}'
    interactive: true
    cmds:
      - docker compose -p {{.PROJECT}} --profile kafka3 logs -f --tail 100 {{.SERVICE}}

  down:
    desc: Stop the environment, keep its data
    dir: '{{.COMPOSE_DIR}}'
    cmds:
      - docker compose -p {{.PROJECT}} --profile kafka3 --profile valkey-ha --profile security --profile clickhouse-ha down

  reset:
    desc: Stop the environment and delete its data volumes
    cmds:
      - cd {{.COMPOSE_DIR}} && docker compose -p {{.PROJECT}} --profile kafka3 --profile valkey-ha --profile security --profile clickhouse-ha down -v --remove-orphans
      - rm -f {{.CACHE}}/env/kafka

  ci-test:
    desc: 'Fresh environment without published ports: startup budget, topics, smoke tests, teardown (KAFKA=1|3)'
    preconditions:
      - sh: '[ "{{.KAFKA}}" = 1 ] || [ "{{.KAFKA}}" = 3 ]'
        msg: KAFKA must be 1 or 3
    cmds:
      - task: _ci_down
      - defer: {task: _ci_down}
      - cmd: |
          start=$(date +%s)
          cd {{.COMPOSE_DIR}} && env {{.KAFKA_ENV}} docker compose -p {{.CI_PROJECT}} -f compose.yaml up -d --wait --wait-timeout {{.UP_BUDGET}} --quiet-pull
          cd {{.ROOT_DIR}}
          {{.ENVCTL}} wait {{.CI_PROJECT}}
          {{.ENVCTL}} topics {{.CI_PROJECT}} {{.TOPIC_PROFILE}}
          elapsed=$(( $(date +%s) - start ))
          echo "env: ready from scratch in ${elapsed}s (budget {{.UP_BUDGET}}s)"
          [ "$elapsed" -le {{.UP_BUDGET}} ] || { echo "FAIL: startup exceeds the budget" >&2; exit 1; }
      - '{{.ENVCTL}} test {{.CI_PROJECT}} {{.KAFKA}}'
      - task: :test:observability             # FF-06: every service in this environment
        vars: {PROJECT: '{{.CI_PROJECT}}'}
      - task: :contracts:registry-compat      # FF-04: schema compatibility in a fresh registry
        vars: {PROJECT: '{{.CI_PROJECT}}'}
      - task: :test:component                 # TS-03: adapters against the containers
        vars: {PROJECT: '{{.CI_PROJECT}}'}
      - task: :test:clickhouse:replica
        vars: {PROJECT: '{{.CI_PROJECT}}', PRESET: coverage}
      - task: :test:pg:sanitizers             # FF-11: native PostgreSQL and outbox paths
        vars: {PROJECT: '{{.CI_PROJECT}}'}
      - task: :test:security:sanitizers       # FF-11: trust, real Keycloak and native mTLS transports
        vars: {PROJECT: '{{.CI_PROJECT}}'}
      - task: :test:clickhouse:sanitizers
        vars: {PROJECT: '{{.CI_PROJECT}}'}
      - task: :test:redis:sanitizers          # FF-11: native RESP3 and Sentinel paths
        vars: {PROJECT: '{{.CI_PROJECT}}'}
      - task: :bench:kafka                    # B-01, nightly only
        vars: {PROJECT: '{{.CI_PROJECT}}'}
        if: '[ "{{.NIGHTLY}}" = true ]'

  _ci_down:
    internal: true
    dir: '{{.COMPOSE_DIR}}'
    cmds:
      - docker compose -p {{.CI_PROJECT}} -f compose.yaml --profile kafka3 --profile valkey-ha --profile security --profile clickhouse-ha down -v --remove-orphans --timeout 5 2>/dev/null
