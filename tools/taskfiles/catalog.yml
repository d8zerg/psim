version: '3'
vars:
  PROJECT: '{{.PROJECT | default "psim-catalog-test"}}'
  PRESET: '{{.PRESET | default "debug"}}'
tasks:
  test:
    desc: Resource Catalog REST, scope, files, outbox, maintenance and restart checks
    cmds:
      - task: :cpp:build
        vars: {PRESET: '{{.PRESET}}'}
      - python3 -I tools/catalog/check.py {{.PROJECT}} {{.PRESET}} 100
  bench:
    desc: Import and reconcile 50000 devices and measure consumer propagation
    cmds:
      - task: :cpp:build
        vars: {PRESET: release}
      - python3 -I tools/catalog/check.py {{.PROJECT}} release 50000
  sanitizers:
    desc: Catalog model and real service checks under ASan/UBSan and TSan
    cmds:
      - task: :cpp:test:sanitizers
        vars: {LABELS: psim_catalog_test}
      - for: [asan, tsan]
        task: test
        vars: {PROJECT: '{{.PROJECT}}', PRESET: '{{.ITEM}}'}
  coverage:
    desc: Catalog unit and real service coverage
    cmds:
      - rm -rf build/{{.PLATFORM}}/coverage/profiles
      - task: test
        vars: {PROJECT: '{{.PROJECT}}', PRESET: coverage}
      - task: :cpp:_run
        vars:
          CMD: >-
            LLVM_PROFILE_FILE=/repo/build/{{.PLATFORM}}/coverage/profiles/%p-%m.profraw ctest --test-dir build/{{.PLATFORM}}/coverage -L '^psim_catalog_test$' --output-on-failure &&
            python3 -I tools/cpp/coverage.py build/{{.PLATFORM}}/coverage tools/cpp/coverage.yaml 'services/resource-catalog' --component
