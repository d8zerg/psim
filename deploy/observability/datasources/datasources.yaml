apiVersion: 1
datasources:
- isDefault: true
  jsonData:
    httpMethod: POST
    timeInterval: 15s
  name: Prometheus
  type: prometheus
  uid: prometheus
  url: http://127.0.0.1:19090
- jsonData:
    derivedFields:
    - datasourceUid: tempo
      matcherRegex: trace_id
      matcherType: label
      name: trace_id
      url: $${__value.raw}
  name: Loki
  type: loki
  uid: loki
  url: http://127.0.0.1:13100
- jsonData:
    tracesToLogsV2:
      datasourceUid: loki
      filterByTraceID: true
      spanEndTimeShift: 1m
      spanStartTimeShift: -1m
      tags:
      - key: service.name
        value: service_name
  name: Tempo
  type: tempo
  uid: tempo
  url: http://127.0.0.1:13200
- jsonData:
    handleGrafanaManagedAlerts: false
    implementation: prometheus
  name: Alertmanager
  type: alertmanager
  uid: alertmanager
  url: http://127.0.0.1:19093
