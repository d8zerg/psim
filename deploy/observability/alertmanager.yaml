global:
  resolve_timeout: 5m
route:
  receiver: operations-journal
  group_by: [deployment, alertname, node]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="PsimWatchdog"']
      receiver: operations-journal
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity="critical"']
      receiver: operations-journal
      group_wait: 10s
      repeat_interval: 30m
inhibit_rules:
  - source_matchers: ['alertname="PsimDiskCritical"']
    target_matchers: ['alertname="PsimDiskSpace"']
    equal: [deployment, node, volume]
  - source_matchers: ['alertname="PsimMonitoringUnavailable"']
    target_matchers: ['alertname="PsimMetricCollectionFailed"']
    equal: [deployment, node]
receivers:
  - name: operations-journal
    webhook_configs:
      - url: https://127.0.0.1:19443/alerts
        send_resolved: true
        http_config:
          tls_config:
            ca_file: /etc/psim-platform/alertmanager/secrets/ca.pem
            cert_file: /etc/psim-platform/alertmanager/secrets/identity.pem
            key_file: /etc/psim-platform/alertmanager/secrets/identity.key
