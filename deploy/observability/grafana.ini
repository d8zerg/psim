[server]
protocol = https
http_addr = ${PSIM_NODE_ADDRESS}
http_port = 19444
domain = ${PSIM_PUBLIC_NAME}
root_url = ${PSIM_ORIGIN}/monitoring/
serve_from_sub_path = true
cert_file = /etc/psim-platform/grafana/secrets/identity.pem
cert_key = /etc/psim-platform/grafana/secrets/identity.key
[security]
admin_user = recovery-admin
admin_password = $__file{/etc/psim-platform/grafana/secrets/admin.secret}
secret_key = $__file{/etc/psim-platform/grafana/secrets/session.secret}
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true
[users]
allow_sign_up = false
viewers_can_edit = false
[auth.anonymous]
enabled = false
[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
client_id = psim-grafana
client_secret = $__file{/etc/psim-platform/grafana/secrets/identity.secret}
scopes = openid profile email
auth_url = ${PSIM_ISSUER}/protocol/openid-connect/auth
token_url = ${PSIM_ISSUER}/protocol/openid-connect/token
api_url = ${PSIM_ISSUER}/protocol/openid-connect/userinfo
use_pkce = true
use_refresh_token = true
validate_id_token = true
jwk_set_url = ${PSIM_ISSUER}/protocol/openid-connect/certs
tls_client_ca = /etc/psim-platform/grafana/secrets/ca.pem
role_attribute_strict = true
role_attribute_path = contains(psim_observability_roles[*], 'psim-observability-admin') && 'Admin' || contains(psim_observability_roles[*], 'psim-observability-viewer') && 'Viewer'
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
preinstall_disabled = true
[dashboards]
default_home_dashboard_path = /etc/psim-platform/observability/dashboards/overview.json
