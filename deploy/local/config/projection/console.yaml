service:
  instance: console-writer
runtime:
  shards: 1
telemetry:
  otlp_endpoint: otel-collector:4317
  otlp_tls: false
  sampling_ratio: 1
settings:
  allow_plaintext: true
  pg_password_file: /repo/.cache/event-flow/postgres.secret
  listen_port: 8443
  reports_enabled: false
  redis_host: valkey
  redis_password_file: /repo/.cache/event-flow/redis.secret
