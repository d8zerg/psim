service:
  instance: event-flow
runtime:
  shards: 1
telemetry:
  otlp_endpoint: otel-collector:4317
  otlp_tls: false
  sampling_ratio: 1
settings:
  allow_plaintext: true
  pg_password_file: /repo/.cache/event-flow/postgres.secret
  introspection_secret_file: /repo/.cache/event-flow/introspection.secret
  legacy_types: true
  issuer: http://keycloak:8080/realms/psim
