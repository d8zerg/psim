# Prometheus of the local environment. Service metrics arrive by remote write from the
# Collector; services running on the local environment expose /metrics for scrape jobs.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/reports.yml, /etc/prometheus/api.yml]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: projection-service
    dns_sd_configs:
      - names: [projection-service, reports-2]
        type: A
        port: 9100
  - job_name: api-gateway
    dns_sd_configs:
      - names: [api-gateway]
        type: A
        port: 9100
