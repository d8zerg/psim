# Prometheus of the local environment (step 1.4). Service metrics arrive by remote write from the
# Collector; services started on the stand are scraped at /metrics by the jobs added with step 2.1.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
