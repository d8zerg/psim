groups:
  - name: api-gateway
    rules:
      - alert: ApiGatewaySharedRateLimiterUnavailable
        expr: sum(rate(psim_api_rate_limit_failures_total[5m])) > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: API Gateway cannot enforce the shared request quota
          description: Check Valkey availability, primary discovery, credentials and quota key permissions.
      - alert: ApiGatewayProxyFailures
        expr: sum(rate(psim_api_proxy_failures_total[5m])) > 1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: API Gateway repeatedly fails to transfer requests or responses
          description: Check upstream readiness, TLS trust, response sizes and client connection failures.
      - alert: RealtimeDeliveryLatency
        expr: histogram_quantile(0.99, sum by (le) (rate(psim_realtime_delivery_seconds_bucket[5m]))) > 0.2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Realtime live delivery p99 exceeds 200 milliseconds
          description: Check Kafka delay, Gateway CPU, owner authorization latency and connected client load.
      - alert: RealtimeSlowConsumers
        expr: sum(rate(psim_realtime_slow_consumers_total[5m])) > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Realtime receivers repeatedly exceed their queue or write budget
          description: Check client connectivity, message sizes and Gateway queue settings.
