version: 1
methods:
- id: TS-39
  kind: test
  name: Observability package
  criteria: Seven static dashboards in both languages, valid PromQL and configurations, alert transitions and instructions
    for C-01-C-15, business aggregates without access to source tables, mTLS metrics, OTLP logs and traces, Prometheus ->
    Alertmanager -> journal delivery, and browser rendering without query errors
  env: E-CI
  gate: pr
  barrier: automated
  task: task deploy:observability:test
  purpose: Delivery of observability assets and failure diagnostic procedures; does not replace RPO/RTO qualification
- id: TS-38
  kind: test
  name: Web module loading and recovery
  criteria: Compare the original build, static modules, deferred editors, language dictionaries and separate entry points;
    ru/en, real cold and warm HTTP caches, complete graphs including dynamic imports and dictionary data, no premature loading
    of restricted routes, chunk failure, artifact replacement and translation reload with input preserved
  env: E-CI
  gate: pr
  barrier: automated
  task: task web:loading
  purpose: Compare loading strategies and verify current limits before changing the distribution
- id: TS-37
  kind: test
  name: Audit and supervisor reporting through the public interface
  criteria: Real PKCE with TOTP, audit search and pagination, independent verification of downloaded JSONL, exact detection
    of modified and deleted PostgreSQL records, denial of access to another site, role revocation with the previous JWT, reference
    metrics for 30 days in under three seconds and matching CSV
  env: E-LOCAL
  gate: pr
  barrier: automated
  task: task insights:test
- id: TS-36
  kind: test
  name: Administration through the public interface
  criteria: Real PKCE with MFA, certificate registration and renewal, mapping for a new connector type, hierarchy and import,
    maintenance, SLA, a rule with a trial run, scenario publication, and rejection of access to another site and invalid uploads
  env: E-LOCAL
  gate: pr
  barrier: automated
  task: task admin:test
- id: TS-35
  kind: test
  name: Operator console
  criteria: Real PKCE, incident acceptance, checklist and decisions, command preview and execution, SLA and notifications,
    private floor plan and responsibility handover
  env: E-LOCAL
  gate: on-demand
  barrier: automated
  task: task operator:test
- id: B-07
  kind: benchmark
  name: Virtualized operator feed
  criteria: 10000 incidents, scrolling at least 50 frames/s, realtime -> DOM p99 at most 1 s; raw measurement series and one
    browser worker
  env: E-CI
  gate: on-demand
  barrier: automated
  task: task operator:benchmark
  purpose: Verify responsiveness of the operational feed without substituting for the full ingestion pipeline SLO
- id: TS-34
  kind: test
  name: Shell session and role-based routes
  criteria: PKCE, ID token validation, a single concurrent refresh, cleanup on logout, direct entry, role boundaries and late
    responses
  env: E-CI
  gate: pr
  barrier: automated
  task: task web:check
  purpose: Verify session isolation and the shared shell without mixing users' operational data
- id: TS-33
  kind: test
  name: Server operations for the operational interface
  criteria: Independent alarm, permissions, versions, retries, leases across instances, history, exercise isolation and authorized
    assistant sources
  env: E-CI
  gate: pr
  barrier: automated
  task: task operations:test
  purpose: Verify server operations for the operational interface without a read-model simulator
- id: TS-01
  kind: test
  name: Domain core unit tests
  criteria: All tests pass; every invariant in aggregates.md and every transition in state-models.md is covered
  env: E-CI
  gate: pr
  barrier: automated
  task: task cpp:test
- id: TS-02
  kind: test
  name: Property-based aggregate invariant tests
  criteria: Invariants hold for random command sequences; 0 duplicate incidents when signals are repeated
  env: E-CI
  gate: pr
  barrier: automated
  task: task cpp:test:property
- id: TS-03
  kind: test
  name: Adapter component tests against containers
  criteria: Real Kafka, PostgreSQL, Redis and ClickHouse containers in the local environment; connection loss and failover
    scenarios
  env: E-CI
  gate: pr
  barrier: automated
  task: task test:component
- id: TS-04
  kind: test
  name: Contract validation
  criteria: task contracts:check passes; formatting, linting, buf breaking, valid and current OpenAPI and AsyncAPI, consistent
    registries
  env: E-CI
  gate: pr
  barrier: automated
  task: task contracts:check
- id: TS-05
  kind: test
  name: REST contract tests against OpenAPI
  criteria: All Protobuf routes are available through Gateway; actual responses conform to psim-api-v1.yaml, catalog error
    codes and RFC 9457
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:api-contract
- id: TS-06
  kind: test
  name: Connector protocol conformance suite
  criteria: Reference connectors and the simulator pass the complete suite; a 10-minute connection outage causes no data loss
  env: E-CI
  gate: pr
  barrier: automated
  task: task connectors:conformance
- id: TS-07
  kind: test
  name: Short pipeline simulation
  criteria: Manually run 200 trials with random failures; in-memory reconciliation finds 0 losses and 0 duplicate effects;
    reference delivery and correlation evaluator with independent oracles (ADR-044)
  env: E-DEV
  gate: on-demand
  barrier: automated
  task: task sim:short
- id: TS-08
  kind: test
  name: Long pipeline simulation
  criteria: Manually run 10 000 trials; reproduce failures from seed, model version and parameters; retain the trace for regression
    testing (ADR-044)
  env: E-DEV
  gate: on-demand
  barrier: automated
  task: task sim:long
- id: TS-09
  kind: test
  name: End-to-end pipeline smoke test in Docker Compose
  criteria: A simulator event creates an incident visible through the API and realtime; one trace covers the entire path
  env: E-CI
  gate: pr
  barrier: automated
  task: task test:smoke
- id: TS-10
  kind: test
  name: Scenario acceptance tests through the API
  criteria: Scenarios in acceptance-spec.md executable through the API and connector protocol, including negative checks
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:acceptance
- id: TS-11
  kind: test
  name: End-to-end Playwright UI tests
  criteria: Scenarios S1, S2, S6-S10, S13 through the interface with real Keycloak, Kafka and services; required steps, restart
    with scenario version preserved, second command approval, responsibility handover, incident resolution and closure
  env: E-CI
  gate: pr
  barrier: automated
  task: task web:native
- id: TS-12
  kind: test
  name: Role x action x scope authorization matrix
  criteria: All actions and six roles, tenant, site and zone; service and Gateway requests, compact scope sets, REST/WSS revocation
    before JWT expiry and audited denials
  env: E-CI
  gate: pr
  barrier: automated
  task: task test:authz
- id: TS-13
  kind: test
  name: Audit integrity test
  criteria: Verification detects database record modification, deletion and insertion with record-level precision
  env: E-CI
  gate: pr
  barrier: automated
  task: task test:audit-integrity
- id: TS-14
  kind: test
  name: Console resilience to connection loss
  criteria: Recover from an outage of at least 5 minutes without losing changes; an expired JWT receives 401 after clock tolerance,
    and the new token differs from the old one; replay and Gateway restart, RESYNC outside the replay window
  env: E-CI
  gate: pr
  barrier: automated
  task: task web:session
- id: TS-15
  kind: test
  name: Console feed performance
  criteria: 10 000 active incidents, scrolling >= 50 frames/s, delta application without blocking the interface
  env: E-CI
  gate: nightly
  barrier: automated
  task: task web:perf
- id: TS-16
  kind: test
  name: Automated interface accessibility check
  criteria: axe-core reports no critical violations on key screens
  env: E-CI
  gate: nightly
  barrier: automated
  task: task web:a11y
  purpose: Accessibility of key screens
- id: TS-17
  kind: test
  name: Scenario and timer resumption after restart
  criteria: Restart Response Engine during a scenario and before a timer fires; timer error <= 1 s
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:timers
- id: L-01
  kind: load
  name: Nightly LOAD-5K test
  criteria: Lag does not grow; stage latency regresses by no more than 5% against baseline; reconciliation finds no loss
  env: E-CI
  gate: nightly
  barrier: automated
  task: task load:nightly
- id: L-02
  kind: load
  name: Sustained LOAD-50K for 1 hour
  criteria: 50 000 events/s; event -> signal p99 <= 300 ms; event -> console p99 <= 1 s; reconciliation finds no loss or duplicates
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task load:steady
- id: L-03
  kind: soak
  name: LOAD-50K soak test for 24 hours
  criteria: The L-02 thresholds hold throughout the interval; memory use, lag and latency do not grow
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task load:soak
- id: L-04
  kind: load
  name: 1.5x peak (75 000 events/s) for 10 minutes
  criteria: 0 losses; lag returns to normal within 5 minutes after the peak
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task load:peak
- id: L-05
  kind: load
  name: Consoles and REST under load
  criteria: 500 consoles; REST read p99 <= 200 ms; realtime delivery p99 <= 200 ms; event -> rendering p99 <= 1 s during LOAD-50K
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task load:consoles
- id: L-06
  kind: load
  name: Ingestion through two gateway instances
  criteria: 50 000 events/s through 2 Connector Gateway instances up to Kafka acknowledgement; other application processes
    on the combined local profile are temporarily stopped; instance failure causes no loss
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task deploy:gateway:qualify
- id: L-07
  kind: load
  name: Import of 50 000 devices
  criteria: Import completes within 5 minutes; consumers receive catalog changes within 2 s
  env: E-LOCAL
  gate: nightly
  barrier: automated
  task: task catalog:bench
- id: L-08
  kind: load
  name: Event history search under write load
  criteria: Search one day of data for a zone within 500 ms while writing 50 000 events/s to ClickHouse
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task history:bench
- id: TS-30
  kind: test
  name: Incident facts and reporting
  purpose: Metrics, authorization, retries and fact recomputation for the reporting API
  criteria: Metrics match reference values; retries and recomputation preserve results; roles and access scopes are enforced
  env: E-LOCAL
  gate: pr
  barrier: automated
  task: task reports:test
- id: L-09
  kind: load
  name: Report covering 30 days
  criteria: Report generation takes <= 3 s; values match the reference
  env: E-LOCAL
  gate: nightly
  barrier: automated
  task: task reports:bench
- id: L-10
  kind: load
  name: Single-machine LOAD-10K
  criteria: 10 000 events/s on the reference server with cluster latency SLOs
  env: E-LOCAL
  gate: release
  barrier: automated
  task: task load:single-node
  purpose: Target load for the single-machine topology (scaling.md, 5.4)
- id: L-11
  kind: load
  name: Incident Service signal processing
  criteria: Two instances; signal processing p99 <= 50 ms; signal and incident reconciliation finds no loss or duplicates
    after an instance receives SIGKILL
  env: E-LOCAL
  gate: release
  barrier: automated
  task: task incidents:bench
  purpose: Incident stage latency budget (signal processing)
- id: L-12
  kind: load
  name: Command delivery to the connector
  criteria: Command request -> connector delivery p99 <= 200 ms; every command reaches a final status
  env: E-LOCAL
  gate: release
  barrier: automated
  task: task commands:bench
  purpose: Command latency budget (command delivery)
- id: C-01
  kind: chaos
  name: Kafka broker failure
  criteria: Under LOAD-50K, reconciliation finds no loss or duplicates; processing continues; RTO <= 60 s
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:kafka-broker
- id: C-02
  kind: chaos
  name: Termination of an instance of each service
  criteria: Run kill -9 against each service in turn under load; reconciliation finds no loss or duplicates; RTO <= 60 s
  env: E-CI
  gate: nightly
  barrier: automated
  task: task chaos:service-kill
- id: C-03
  kind: chaos
  name: PostgreSQL primary failover
  criteria: Patroni leader failure under load; 0 lost incidents (RPO = 0); failover <= 30 s
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:postgres-failover
- id: C-04
  kind: chaos
  name: Redis-compatible storage primary failure
  criteria: Event processing continues; connector sessions recover
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:redis
- id: C-05
  kind: chaos
  name: ClickHouse replica failure
  criteria: Search and reports use the second replica; ingestion catches up without loss after recovery
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:clickhouse
- id: C-06
  kind: chaos
  name: Network partition between an application node and infrastructure nodes
  criteria: Available instances take over partitions; reconciliation after recovery finds no loss or duplicates
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:partition
- id: C-07
  kind: chaos
  name: Packet delays and loss
  criteria: Toxiproxy injects 200 ms latency and 5% packet loss on Kafka and PostgreSQL connections; no data loss or duplicate
    effects; record latency degradation in the report
  env: E-CI
  gate: nightly
  barrier: automated
  task: task chaos:network
- id: C-08
  kind: chaos
  name: Disk exhaustion
  criteria: Alert before processing stops; a full disk applies backpressure without losing acknowledged data
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:disk-full
- id: C-09
  kind: chaos
  name: Node and source clock skew
  criteria: A source clock is 10 minutes ahead; events are corrected and marked clock_skew; node clock skew raises an alert
  env: E-CI
  gate: nightly
  barrier: automated
  task: task chaos:clock-skew
- id: C-10
  kind: chaos
  name: Connector connection loss for 10 minutes
  criteria: SDK-buffered events are delivered without loss; commands issued during the outage reach a final status
  env: E-CI
  gate: nightly
  barrier: automated
  task: task chaos:connector-disconnect
- id: C-11
  kind: chaos
  name: Cluster node power loss
  criteria: Measure RTO <= 60 s and RPO = 0 for each node in turn; reconciliation finds no loss
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:node-down
- id: C-12
  kind: chaos
  name: N -> N+1 upgrade and rollback under load
  criteria: No interval longer than 5 s without new signals; latency SLOs hold throughout; reconciliation finds no loss or
    duplicates
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task deploy:upgrade:qualify
- id: C-13
  kind: chaos
  name: Keycloak unavailability
  criteria: Existing sessions continue; new sign-ins receive a clear error; event processing is unaffected
  env: E-CI
  gate: nightly
  barrier: automated
  task: task chaos:idp
  purpose: Threat T38 in the threat model
- id: C-14
  kind: chaos
  name: Correlation state recovery
  criteria: Correlation Engine recovers within 30 s after crashing with the reference state size
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:correlation-restore
- id: C-15
  kind: chaos
  name: File storage node failures
  criteria: Stop the SeaweedFS volume server, filer, S3 gateway and master leader during floor plan reads and uploads; existing
    plans remain readable, failed uploads preserve the previous version, volume replicas recover and SHA-256 matches for every
    version
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task chaos:filestore
  purpose: Cluster floor plan storage resilience (ADR-042, ADR-046)
- id: B-01
  kind: benchmark
  name: Kafka layer
  criteria: At least 200 000 messages/s for both producer and consumer on the reference environment
  env: E-LOCAL
  gate: nightly
  barrier: automated
  task: task bench:kafka
- id: B-02
  kind: benchmark
  name: Asynchronous primitives
  criteria: Record overhead as the baseline
  env: E-CI
  gate: pr
  barrier: automated
  task: task bench:async
- id: B-03
  kind: benchmark
  name: Normalizer per CPU core
  criteria: Record per-core throughput and stage p99 <= 30 ms as the baseline
  env: E-CI
  gate: pr
  barrier: automated
  task: task bench:normalizer
- id: B-04
  kind: benchmark
  name: Correlation rule evaluation
  criteria: Throughput for every rule type and cost of CEL expression evaluation
  env: E-CI
  gate: pr
  barrier: automated
  task: task bench:rules
- id: B-05
  kind: benchmark
  name: Performance regression gate
  criteria: Compare all benchmarks against the master baseline; regression greater than 5% blocks merging
  env: E-CI
  gate: pr
  barrier: automated
  task: task bench:compare
- id: B-06
  kind: benchmark
  name: Reference simulator event generator
  criteria: At least 75 000 durably stored events/s from one machine; the TLS receiver reconciles every sequence number and
    source ordering
  env: E-LOCAL
  gate: pr
  barrier: automated
  task: task connectors:bench
  purpose: Verify generator performance independently of the platform pipeline
- id: FF-01
  kind: fitness
  name: Module dependency directions
  criteria: libs/domain has no infrastructure dependencies; services do not depend on each other (ADR-001)
  env: E-CI
  gate: pr
  barrier: automated
  task: task arch:deps
  purpose: Architecture rules (ADR-001)
- id: FF-02
  kind: fitness
  name: Domain core purity
  criteria: libs/domain prohibits system clocks, randomness, input/output and exceptions as the domain error mechanism
  env: E-CI
  gate: pr
  barrier: automated
  task: task arch:domain-purity
  purpose: Deterministic domain core
- id: FF-03
  kind: fitness
  name: tenant_id in all storage queries
  criteria: Static checks of repository SQL and ClickHouse queries (ADR-022)
  env: E-CI
  gate: pr
  barrier: automated
  task: task arch:tenant
  purpose: Multitenancy (ADR-022)
- id: FF-04
  kind: fitness
  name: Schema Registry compatibility
  criteria: Register working-tree schemas against the latest release using ADR-004 compatibility rules
  env: E-CI
  gate: pr
  barrier: automated
  task: task contracts:registry-compat
- id: FF-05
  kind: fitness
  name: Per-stage latency budgets
  criteria: Each stage's p99 in load tests stays within its budget in quality.md, section 4
  env: E-CLUSTER
  gate: release
  barrier: automated
  task: task load:budget
- id: FF-06
  kind: fitness
  name: Service observability
  criteria: After startup, each service serves /health/live, /health/ready and /metrics and exports traces
  env: E-CI
  gate: pr
  barrier: automated
  task: task test:observability
  purpose: Metrics, logs and traces for every service
- id: FF-07
  kind: fitness
  name: Prohibit concatenation of user input into queries
  criteria: Static analysis (requirement SR-13)
  env: E-CI
  gate: pr
  barrier: automated
  task: task arch:sql
  purpose: Security requirement SR-13
- id: FF-08
  kind: fitness
  name: Documentation as code
  criteria: task docs:check passes; links, typography, PlantUML, C4, threat and verification registries are current; both
    language versions are complete and reviewed
  env: E-CI
  gate: pr
  barrier: automated
  task: task docs:check
- id: FF-09
  kind: fitness
  name: Documentation portal build
  criteria: English is the default; complete English and Russian portals build from maintained sources and generated OpenAPI,
    AsyncAPI and Protobuf references; offline archive, local search and section-preserving language switches pass browser
    checks
  env: E-CI
  gate: pr
  barrier: automated
  task: task docs:portal
- id: FF-10
  kind: fitness
  name: Zero compiler and clang-tidy warnings
  criteria: Build with -Werror; clang-tidy reports no findings under the project profile
  env: E-CI
  gate: pr
  barrier: automated
  task: task cpp:lint
- id: FF-11
  kind: fitness
  name: Sanitizers
  criteria: Unit, property and component tests pass under ASan+UBSan and TSan without findings
  env: E-CI
  gate: pr
  barrier: automated
  task: task cpp:test:sanitizers
- id: FF-12
  kind: fitness
  name: Coverage thresholds
  criteria: Domain core coverage >= 90% of lines and >= 80% of branches; infrastructure coverage >= 75% of lines
  env: E-CI
  gate: pr
  barrier: automated
  task: task cpp:coverage
- id: FF-13
  kind: fitness
  name: Build reproducibility
  criteria: Two independent builds of the same commit produce identical artifacts
  env: E-CI
  gate: nightly
  barrier: automated
  task: task cpp:reproducible
- id: FF-14
  kind: fitness
  name: SBOM and artifact signatures
  criteria: Every release artifact has a CycloneDX SBOM and a signature verified by the installer
  env: E-CI
  gate: release
  barrier: automated
  task: task release:verify
- id: FF-15
  kind: fitness
  name: Artifact execution on the target platform
  criteria: Test executables and psimctl pass on Debian 13 x86_64 without the toolchain; all system shared-library dependencies
    resolve (ADR-032)
  env: E-CI
  gate: pr
  barrier: automated
  task: task cpp:runtime-test
- id: FF-16
  kind: fitness
  name: C++ formatting
  criteria: clang-format with .clang-format changes no project files
  env: E-CI
  gate: pr
  barrier: automated
  task: task cpp:format
  purpose: Coding standard (ADR-033)
- id: FF-17
  kind: fitness
  name: Architecture check self-tests
  criteria: For every arch:deps, arch:domain-purity and arch:sql rule, a violating fixture fails
  env: E-CI
  gate: pr
  barrier: automated
  task: task arch:selftest
  purpose: Verify architecture checks even with an empty domain core (ADR-033)
- id: FF-18
  kind: fitness
  name: Package installation on the target platform
  criteria: Each DEB package installs, runs and uninstalls in a clean Debian 13 x86_64 image; dpkg-shlibdeps derives dependencies
    from actual executable symbols
  env: E-CI
  gate: pr
  barrier: automated
  task: task release:package:test
  purpose: Debian 13 x86_64 distribution (F-PLT-06, ADR-034)
- id: FF-19
  kind: fitness
  name: Images without root or unnecessary privileges
  criteria: Every image runs as a non-root user with a read-only filesystem, no capabilities and no-new-privileges
  env: E-CI
  gate: pr
  barrier: automated
  task: task release:images:test
  purpose: Requirement SR-24 (ADR-034)
- id: FF-20
  kind: fitness
  name: Local environment from scratch
  criteria: Start a fresh environment within 5 minutes with 1 and 3 Kafka brokers; all component and inter-component smoke
    tests pass; Keycloak realm enforces SR-02
  env: E-CI
  gate: pr
  barrier: automated
  task: task env:ci-test
  purpose: Reproducible environment and requirement SR-02 (ADR-035)
- id: FF-21
  kind: fitness
  name: Web client quality
  criteria: Formatting, ESLint without warnings, strict type checks, Vitest coverage >= 80% per package, bundle budgets, REST
    and realtime clients generated from contracts, and an end-to-end console smoke test in Chromium
  env: E-CI
  gate: pr
  barrier: automated
  task: task web:check
  purpose: TypeScript standard and web client checks (ADR-037)
- id: FF-22
  kind: fitness
  name: Shared service authorization
  criteria: Services contain neither custom scope checks nor JWT validation without shared introspection configuration; negative
    self-tests detect violations
  env: E-CI
  gate: pr
  barrier: automated
  task: task arch:authz
  purpose: Shared RBAC/ABAC implementation and mandatory identity freshness checks
- id: SEC-01
  kind: security
  name: Static security analysis
  criteria: clang-tidy profile with bugprone, cert and security checks; 0 findings
  env: E-CI
  gate: pr
  barrier: automated
  task: task cpp:lint
  purpose: Security requirements verified by scanning
- id: SEC-02
  kind: security
  name: Dependency vulnerabilities and licenses
  criteria: Trivy scans lockfiles and SBOMs; critical and high vulnerabilities and prohibited licenses block the pipeline
  env: E-CI
  gate: pr
  barrier: automated
  task: task security:deps
- id: SEC-03
  kind: security
  name: Image vulnerability scanning
  criteria: Trivy scans release images; critical and high vulnerabilities block the pipeline
  env: E-CI
  gate: nightly
  barrier: automated
  task: task security:images
  purpose: Requirements SR-23, SR-24
- id: SEC-04
  kind: security
  name: Nightly fuzzing
  criteria: Every fuzz target runs for 1 hour without crashes; new crashing inputs are added to the corpus
  env: E-CI
  gate: nightly
  barrier: automated
  task: task fuzz:nightly
- id: SEC-05
  kind: security
  name: Fuzzing for 24 hours
  criteria: Every untrusted-data parser and the rule DSL run for 24 hours without crashes
  env: E-LOCAL
  gate: release
  barrier: automated
  task: task fuzz:release
- id: SEC-09
  kind: security
  name: Rule parser and validator fuzzing for 10 minutes
  criteria: Rule DSL parser and validator run for 10 minutes without crashes or sanitizer findings; retain the corpus and
    report
  env: E-LOCAL
  gate: pr
  barrier: automated
  task: task fuzz:rules
- id: SEC-06
  kind: security
  name: REST and WebSocket DAST
  criteria: OWASP ZAP scans OpenAPI and realtime; no high-severity findings
  env: E-LOCAL
  gate: release
  barrier: automated
  task: task security:dast
  purpose: Security requirements verified by penetration testing and scanning
- id: SEC-07
  kind: security
  name: TLS configuration
  criteria: testssl.sh checks external ports; only TLS 1.3 on TB1 and TB2, with no weak cipher suites
  env: E-LOCAL
  gate: release
  barrier: automated
  task: task security:tls
  purpose: Requirement SR-08
- id: SEC-08
  kind: security
  name: Platform trust and authentication
  criteria: JWT/JWKS and key rotation, rejection of incorrect issuer/audience/algorithm, TLS/mTLS with CA/name/CRL verification,
    renewal without losing test events, revocation of an active stream, expiry and protected secret files; real Keycloak,
    Kafka, PostgreSQL and Valkey; ASan/UBSan and TSan
  env: E-CI
  gate: pr
  barrier: automated
  task: task test:security:sanitizers
  purpose: Platform mechanisms for SR-01, SR-03, SR-04, SR-08, SR-09; the complete service lifecycle remains in TS-22
- id: M-01
  kind: manual
  name: Installation and connector integration by an independent engineer
  criteria: Use each complete EN and RU version independently, with English as the default, without developer assistance or
    development-only materials; verify actual platform behavior and absence of direct and indirect dependencies on removed
    materials; record elapsed time and findings
  env: E-LOCAL
  gate: release
  barrier: manual
  task: '-'
- id: M-02
  kind: manual
  name: Backup recovery exercise
  criteria: Restore into a clean environment using the procedure and measure elapsed time; floor plans, links and SHA-256
    match, Keycloak and trust recover, and revoked keys cannot grant access
  env: E-LOCAL
  gate: release
  barrier: manual
  task: '-'
  purpose: Recovery from an independent backup
- id: M-03
  kind: manual
  name: Internal penetration test against the threat model
  criteria: Test every high-risk threat in threat-register.md; no open critical or high-severity findings
  env: E-CLUSTER
  gate: release
  barrier: manual
  task: '-'
  purpose: Security requirements verified by penetration testing
- id: M-04
  kind: manual
  name: Reproduce the demonstration from scratch
  criteria: Reproduce the demonstration environment and scenarios using the instructions
  env: E-LOCAL
  gate: release
  barrier: manual
  task: '-'
  purpose: Reproducible synthetic demonstration
- id: M-05
  kind: manual
  name: S1-S13 acceptance run
  criteria: Final execution of every scenario, signed off by the product owner
  env: E-CLUSTER
  gate: release
  barrier: manual
  task: '-'
- id: TS-18
  kind: test
  name: Floor plan files and recovery
  criteria: Upload PNG/JPEG up to 20 MB; reject forged file types and pixel-limit violations; deny other access scopes and
    public bucket access; a failed replacement preserves the version; restored objects and links match by SHA-256
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:acceptance
  purpose: Operational criteria in ADR-042
- id: TS-19
  kind: test
  name: Reliable device state and realtime updates
  criteria: Offline after three missed heartbeats; historical delivery and old snapshots cannot improve freshness; reconciliation
    restores actual; snapshots and deltas after disconnection preserve versions and access scope; delivery p99 <= 200 ms
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:acceptance
  purpose: Operational criteria in ADR-042
- id: TS-20
  kind: test
  name: Maintenance mode and completion
  criteria: Selected signals are suppressed and events retained; fire events and P1 pass through; reject other access scopes;
    preserve open-incident SLAs; completion within 1 s, including restart recovery
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:acceptance
  purpose: Operational criteria in ADR-042
- id: TS-21
  kind: test
  name: Responsibility handover and duty assignment
  criteria: Recipient confirmation, version and scope checks, idempotence; the previous owner remains responsible until acceptance;
    preserve SLA and scenario; use the current duty assignee or fallback contact; audit actions
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:acceptance
  purpose: Operational criteria in ADR-042
- id: TS-22
  kind: test
  name: Certificate lifecycle
  criteria: Initial registration through CSR; overlapping renewal without event loss; revocation closes the session and blocks
    reconnection; revoked certificates remain denied after recovery
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:acceptance
  purpose: Operational criteria in ADR-042
- id: TS-23
  kind: test
  name: Diagnostic replay isolation
  criteria: History containing commands, email and webhooks causes 0 changes to production signals, incidents, commands and
    notifications and 0 external calls; ACLs reject production writes; audit scope and run parameters
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:acceptance
  purpose: Operational criteria in ADR-042
- id: TS-25
  kind: test
  name: Rule lifecycle and isolated historical replay
  criteria: Two instances maintain consistent versions, retries and audit; invalid rules cannot activate; all five rule types
    produce identical decisions from Kafka and ClickHouse; maintenance preserves explanations and versions, while fire events
    and P1 pass through; jobs recover after SIGKILL; reject other access scopes; production topics remain unchanged and real
    ACLs prohibit writes and offset commits
  env: E-CI
  gate: pr
  barrier: automated
  task: task rules:test
  purpose: Real PostgreSQL, Kafka, Schema Registry, ClickHouse, Keycloak and two Correlation Engine instances
- id: TS-24
  kind: test
  name: Resource Catalog resources, floor plans and maintenance
  criteria: Hierarchy and sources preserve invariants; versions and request retries remain consistent; reject other access
    scopes; PNG/JPEG up to 20 MiB and floor plan versions survive S3 and database failures; clean up orphans; maintenance
    ends within 1 s, including startup recovery; the audit consumer receives every change and access denial
  env: E-CI
  gate: pr
  barrier: automated
  task: task catalog:test
  purpose: Two real instances, PostgreSQL, Kafka and S3; backup and suppression application are tested separately
- id: TS-26
  kind: test
  name: Projection rebuild from Kafka
  criteria: Projections rebuilt by Kafka replay match production projections; old events cannot produce false online or actual
    state; the end-to-end event scenario passes after API Gateway projection migration
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:projections
  purpose: Reproducibility of read models from Kafka
- id: TS-27
  kind: test
  name: Notification delivery and webhook protection
  criteria: Email and webhooks reach test SMTP and HTTP receivers; receiver failure and recovery cause no notification loss
    or duplication; reject prohibited and internal webhook addresses; audit delivery
  env: E-CI
  gate: nightly
  barrier: automated
  task: task test:notifications
  purpose: Notification delivery and SSRF protection
- id: TS-28
  kind: test
  name: Incident Service and authorization
  criteria: Two HTTPS instances, real Kafka, PostgreSQL and Keycloak; transitions, versions, retries, grouping window, history,
    access scope and confirmed handover preserve invariants; SIGKILL and repeated signals cause no lost or duplicate effects
  env: E-CI
  gate: pr
  barrier: automated
  task: task incidents:test
  purpose: Incident lifecycle, shared authorization and responsibility preservation
- id: TS-29
  kind: test
  name: Event history and incident links
  criteria: Real ingestion workers, Kafka, ClickHouse and PostgreSQL; search and statistics enforce access scope; signals
    extend TTL; SIGKILL and retries preserve the full link set without logical duplicates
  env: E-CI
  gate: pr
  barrier: automated
  task: task history:test
  purpose: Complete incident context, search and durable retention extension
- id: TS-31
  kind: test
  name: Shared console models and Kafka recovery
  criteria: Real Kafka, PostgreSQL, Valkey and HTTPS; access scopes, independent observation and report cursors, duty, maintenance,
    PostgreSQL fallback, rebuild equality and rejection of incomplete history; local update p99 <= 100 ms
  env: E-CI
  gate: pr
  barrier: automated
  task: task projection:test
  purpose: Consistent console snapshots, state freshness and safe recovery
- id: TS-32
  kind: test
  name: Realtime subscriptions, recovery and 500 clients
  criteria: Two Gateways, 500 WSS clients and 10000 deliveries without loss; local p99 <= 200 ms; restore 500 subscriptions
    after a node restart without a new snapshot; filters, JWT, old clients, multiple subscriptions, private variants, current
    state after lease expiry and slow-consumer disconnection
  env: E-CI
  gate: pr
  barrier: automated
  task: task realtime:test
  purpose: Compatible change delivery, node-independent resumption and bounded queues
