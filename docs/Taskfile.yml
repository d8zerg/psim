# Documentation checks: links and anchors, typography, Mermaid diagrams, C4 model.
# Included from the root Taskfile as namespace "docs"; working directory is docs/.
version: '3'

vars:
  TOOLS: '{{.ROOT_DIR}}/tools/docs'
  MERMAID_OUT: '{{.CACHE}}/mermaid'
  # Markdown with links to check; text sources with typography rules.
  LINK_SOURCES: '{{.ROOT_DIR}}/docs {{.ROOT_DIR}}/contracts/README.md {{.ROOT_DIR}}/README.md'
  TEXT_SOURCES: '{{.ROOT_DIR}}/docs {{.ROOT_DIR}}/contracts {{.ROOT_DIR}}/tools {{.ROOT_DIR}}/README.md {{.ROOT_DIR}}/Taskfile.yml'

tasks:
  check:
    desc: Run all documentation checks
    cmds:
      - task: links
      - task: typography
      - task: mermaid
      - task: c4
      - task: threats
      - task: verification
      - task: portal

  links:
    desc: Check relative links and heading anchors in Markdown
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/check_links.py {{.LINK_SOURCES}}'

  typography:
    desc: 'Check typography: "-" instead of dashes, "->" instead of arrows, no emoji'
    dir: '{{.ROOT_DIR}}'
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/check_typography.py {{.TEXT_SOURCES}}'

  mermaid:
    desc: Render every Mermaid diagram in docs to catch syntax errors
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/extract_mermaid.py {{.MERMAID_OUT}} {{.ROOT_DIR}}/docs'
      - cmd: |
          cd "{{.MERMAID_OUT}}"
          ls *.mmd | xargs -P 4 -I{} sh -c '
            docker run --rm -u {{.UID}}:{{.GID}} -v "$PWD":/data {{.MERMAID_IMAGE}} \
              -i /data/{} -o /data/{}.svg >"{}.log" 2>&1 \
              && echo "ok: {}" || { echo "FAIL: {}"; grep -m3 "Error\|Expecting" "{}.log"; exit 255; }'

  threats:
    desc: Verify the threat model registry and that the rendered register is up to date
    vars:
      UPDATE: '{{.UPDATE | default "false"}}'
    cmds:
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/security/threat_model.py verify {{.ROOT_DIR}} security/threat-model.yaml'
      - mkdir -p {{.CACHE}}/security
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/security/threat_model.py render security/threat-model.yaml {{.CACHE}}/security/threat-register.md'
      - task: :_publish
        vars: {SRC: '{{.CACHE}}/security/threat-register.md', DST: '{{.TASKFILE_DIR}}/security/threat-register.md', UPDATE: '{{.UPDATE}}'}

  threats:gen:
    desc: Regenerate the threat register from the registry
    cmds:
      - task: threats
        vars: {UPDATE: 'true'}
      - task: verification
        vars: {UPDATE: 'true'}

  verification:
    desc: Verify the verification registry against plan goals and scenarios; the matrix must be up to date
    vars:
      UPDATE: '{{.UPDATE | default "false"}}'
    cmds:
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/quality/verification.py verify {{.ROOT_DIR}} quality/verification.yaml'
      - mkdir -p {{.CACHE}}/quality
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/quality/verification.py render {{.ROOT_DIR}} quality/verification.yaml {{.CACHE}}/quality/verification-matrix.md'
      - task: :_publish
        vars: {SRC: '{{.CACHE}}/quality/verification-matrix.md', DST: '{{.TASKFILE_DIR}}/quality/verification-matrix.md', UPDATE: '{{.UPDATE}}'}

  verification:gen:
    desc: Regenerate the verification matrix from the registry
    cmds:
      - task: verification
        vars: {UPDATE: 'true'}

  c4:
    desc: Validate the C4 model (Structurizr DSL)
    cmds:
      - >-
        docker run --rm -v "{{.TASKFILE_DIR}}/architecture/c4":/usr/local/structurizr {{.STRUCTURIZR_IMAGE}}
        validate -workspace workspace.dsl

  portal:
    desc: Build the documentation portal into build/portal/site (FF-09); references are generated from the contracts
    vars:
      OUT: '{{.ROOT_DIR}}/build/portal'
      C4_OUT: '{{.CACHE}}/portal/c4'
      REDOC_CDN: https://cdn.redocly.com/redoc/v{{.REDOC_VERSION}}/bundles/redoc.standalone.js
      REPO_URL:
        sh: git -C {{.ROOT_DIR}} remote get-url origin 2>/dev/null | sed -E 's#^git@([^:]+):#https://\1/#; s#\.git$##' || echo https://github.com/d8zerg/psim
      COMMIT:
        sh: git -C {{.ROOT_DIR}} rev-parse HEAD
    cmds:
      - task: portal:image
      # C4 views -> Mermaid (Structurizr exports next to the workspace, so it works on a copy).
      - rm -rf {{.C4_OUT}} && mkdir -p {{.C4_OUT}} && cp {{.TASKFILE_DIR}}/architecture/c4/workspace.dsl {{.C4_OUT}}/
      - >-
        docker run --rm -u {{.UID}}:{{.GID}} -v "{{.C4_OUT}}":/usr/local/structurizr {{.STRUCTURIZR_IMAGE}}
        export -workspace workspace.dsl -format mermaid -output views >/dev/null
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/docs/portal.py stage {{.ROOT_DIR}} {{.OUT}} {{.C4_OUT}}/views {{.REPO_URL}} {{.COMMIT}}'
      # REST reference: Redoc HTML built from the OpenAPI contract.
      - >-
        docker run --rm -u {{.UID}}:{{.GID}} -v "{{.ROOT_DIR}}":/repo -w /repo {{.REDOCLY_IMAGE}}
        build-docs contracts/openapi/psim-api-v1.yaml --disableGoogleFont --output build/portal/src/reference/rest-api.html >/dev/null
      - >-
        docker run --rm -u {{.UID}}:{{.GID}} -v "{{.ROOT_DIR}}":/repo -w /repo/build/portal/src/reference {{.PORTAL_IMAGE}} sh -c
        'grep -q "{{.REDOC_CDN}}" rest-api.html || { echo "Redoc version changed; update tools/docs/portal/Dockerfile" >&2; exit 1; };
        cp /opt/portal/redoc.standalone.js . && sed -i "s#{{.REDOC_CDN}}#redoc.standalone.js#" rest-api.html'
      # Mermaid -> SVG on white, readable in both themes; the portal needs no JavaScript renderer.
      - cmd: |
          cd {{.OUT}}/src
          find . -name '*.mmd' -path '*/_diagrams/*' | xargs -P 4 -I{} sh -c '
            docker run --rm -u {{.UID}}:{{.GID}} -v "$PWD":/data {{.MERMAID_IMAGE}} -i "/data/{}" -o "/data/$(echo {} | sed "s/\\.mmd$/.svg/")" -b white >/dev/null 2>&1 \
              || { echo "FAIL: mermaid {}"; exit 255; }'
          find . -name '*.mmd' -path '*/_diagrams/*' -delete
      - >-
        docker run --rm -u {{.UID}}:{{.GID}} -v "{{.ROOT_DIR}}":/repo -w /repo/build/portal {{.PORTAL_IMAGE}}
        mkdocs build
      - 'echo "portal: build/portal/site/index.html ($(find {{.OUT}}/site -name "*.html" | wc -l) pages)"'

  portal:image:
    desc: Build the MkDocs image of the portal (tools/docs/portal)
    status:
      - docker image inspect {{.PORTAL_IMAGE}} >/dev/null 2>&1
    cmds:
      - docker build --quiet -t {{.PORTAL_IMAGE}} {{.ROOT_DIR}}/tools/docs/portal >/dev/null

  serve:
    desc: Serve the built portal on http://localhost:8000
    interactive: true
    cmds:
      - >-
        docker run --rm -it -u {{.UID}}:{{.GID}} -p 127.0.0.1:8000:8000 -v "{{.ROOT_DIR}}/build/portal/site":/site:ro
        -w /site {{.PORTAL_IMAGE}} python -m http.server 8000
