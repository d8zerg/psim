# Documentation checks: links and anchors, typography, PlantUML diagrams and C4 views.
# Included from the root Taskfile as namespace "docs"; working directory is docs/.
version: '3'

vars:
  TOOLS: '{{.ROOT_DIR}}/tools/docs'
  PLANTUML_OUT: '{{.CACHE}}/plantuml'
  # Markdown with links to check; text sources with typography rules.
  LINK_SOURCES: '{{.ROOT_DIR}}/docs {{.ROOT_DIR}}/contracts/docs {{.ROOT_DIR}}/contracts/README.md {{.ROOT_DIR}}/README.md {{.ROOT_DIR}}/CONTRIBUTING.md {{.ROOT_DIR}}/SECURITY.md {{.ROOT_DIR}}/libs/platform/pg/README.md {{.ROOT_DIR}}/libs/platform/redis/README.md {{.ROOT_DIR}}/libs/platform/security/README.md {{.ROOT_DIR}}/libs/platform/clickhouse/README.md {{.ROOT_DIR}}/libs/platform/s3/README.md {{.ROOT_DIR}}/libs/sim/README.md {{.ROOT_DIR}}/connectors/README.md {{.ROOT_DIR}}/deploy/README.md {{.ROOT_DIR}}/web/README.md {{.ROOT_DIR}}/libs/domain/README.md {{.ROOT_DIR}}/libs/platform/README.md {{.ROOT_DIR}}/services/README.md {{.ROOT_DIR}}/tests/README.md'
  TEXT_SOURCES: '{{.ROOT_DIR}}/docs {{.ROOT_DIR}}/contracts {{.ROOT_DIR}}/tools {{.ROOT_DIR}}/README.md {{.ROOT_DIR}}/CONTRIBUTING.md {{.ROOT_DIR}}/SECURITY.md {{.ROOT_DIR}}/libs/platform/pg/README.md {{.ROOT_DIR}}/libs/platform/redis/README.md {{.ROOT_DIR}}/libs/platform/security/README.md {{.ROOT_DIR}}/libs/platform/clickhouse/README.md {{.ROOT_DIR}}/libs/platform/s3/README.md {{.ROOT_DIR}}/libs/sim/README.md {{.ROOT_DIR}}/Taskfile.yml'

tasks:
  check:
    desc: Run all documentation checks
    cmds:
      - task: links
      - task: typography
      - task: comments
      - task: localization
      - task: plantuml
      - task: threats
      - task: verification
      - task: registries:test
      - task: portal
      - task: release:check
      - task: browser

  links:
    desc: Check relative links and heading anchors in Markdown
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/check_links.py {{.LINK_SOURCES}}'

  typography:
    desc: 'Check typography: "-" instead of dashes, "->" instead of arrows, no emoji'
    dir: '{{.ROOT_DIR}}'
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/check_typography.py {{.TEXT_SOURCES}}'

  comments:
    desc: Require English source comments while preserving localized strings
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/check_comments.py {{.ROOT_DIR}}'

  localization:
    desc: Verify complete English and Russian documentation and translation freshness
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/localization.py {{.ROOT_DIR}}'
      - '{{.PYTHON}} {{.TOOLS}}/localized_assets.py {{.ROOT_DIR}}'
      - '{{.PYTHON}} {{.TOOLS}}/proto_reference.py {{.ROOT_DIR}}'

  review:
    desc: Record a paired translation review for explicitly listed page paths or identifiers
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/localization.py {{.ROOT_DIR}} --review {{.CLI_ARGS}}'

  plantuml:
    desc: Render all UML and C4 diagrams with the pinned PlantUML image
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/extract_plantuml.py {{.PLANTUML_OUT}} {{.ROOT_DIR}}/docs'
      - >-
        docker run --rm --network none -u {{.UID}}:{{.GID}} -v "{{.PLANTUML_OUT}}":/data
        {{.PLANTUML_IMAGE}} -charset UTF-8 -failfast2 -tsvg -nometadata /data/*.puml

  registries:test:
    desc: Verify independent quality and security registry invariants
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/test_registries.py'
      - '{{.PYTHON}} {{.TOOLS}}/test_comments.py'
      - '{{.PYTHON}} {{.TOOLS}}/test_localization.py'
      - '{{.PYTHON}} {{.TOOLS}}/test_document_links.py'
      - '{{.PYTHON}} {{.TOOLS}}/test_proto_reference.py'

  release:check:
    desc: Check the release source copy and portal without development-only materials
    cmds:
      - '{{.PYTHON}} {{.TOOLS}}/check_release.py {{.ROOT_DIR}} {{.ROOT_DIR}}/build/portal/site {{.PORTAL_IMAGE}} {{.PLANTUML_IMAGE}}'

  threats:
    desc: Verify the threat model registry and that the rendered register is up to date
    vars:
      UPDATE: '{{.UPDATE | default "false"}}'
    cmds:
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/security/threat_model.py verify {{.ROOT_DIR}} security/threat-model.yaml'
      - mkdir -p {{.CACHE}}/security
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/security/threat_model.py render security/threat-model.yaml {{.CACHE}}/security/threat-register.md'
      - task: :_publish
        vars: {SRC: '{{.CACHE}}/security/threat-register.md', DST: '{{.TASKFILE_DIR}}/security/threat-register.md', UPDATE: '{{.UPDATE}}'}
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/security/threat_model.py render security/threat-model.yaml {{.CACHE}}/security/threat-register-ru.md ru'
      - task: :_publish
        vars: {SRC: '{{.CACHE}}/security/threat-register-ru.md', DST: '{{.TASKFILE_DIR}}/ru/security/threat-register.md', UPDATE: '{{.UPDATE}}'}

  threats:gen:
    desc: Regenerate the threat register from the registry
    cmds:
      - task: threats
        vars: {UPDATE: 'true'}
      - task: verification
        vars: {UPDATE: 'true'}

  verification:
    desc: Verify coverage of permanent quality requirements and acceptance scenarios; the matrix must be up to date
    vars:
      UPDATE: '{{.UPDATE | default "false"}}'
    cmds:
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/quality/verification.py verify {{.ROOT_DIR}} quality/verification.yaml'
      - mkdir -p {{.CACHE}}/quality
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/quality/verification.py render {{.ROOT_DIR}} quality/verification.yaml {{.CACHE}}/quality/verification-matrix.md'
      - task: :_publish
        vars: {SRC: '{{.CACHE}}/quality/verification-matrix.md', DST: '{{.TASKFILE_DIR}}/quality/verification-matrix.md', UPDATE: '{{.UPDATE}}'}
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/quality/verification.py render {{.ROOT_DIR}} quality/verification.yaml {{.CACHE}}/quality/verification-matrix-ru.md ru'
      - task: :_publish
        vars: {SRC: '{{.CACHE}}/quality/verification-matrix-ru.md', DST: '{{.TASKFILE_DIR}}/ru/quality/verification-matrix.md', UPDATE: '{{.UPDATE}}'}

  verification:gen:
    desc: Regenerate the verification matrix from the registry
    cmds:
      - task: verification
        vars: {UPDATE: 'true'}

  c4:
    desc: Validate the PlantUML C4 views
    cmds:
      - task: plantuml

  portal:
    desc: Build the documentation portal into build/portal/site (FF-09); references are generated from the contracts
    vars:
      OUT: '{{.ROOT_DIR}}/build/portal'
      REPO_URL:
        sh: git -C {{.ROOT_DIR}} remote get-url origin 2>/dev/null | sed -E 's#^git@([^:]+):#https://\1/#; s#\.git$##' || echo https://github.com/d8zerg/psim
      COMMIT:
        sh: git -C {{.ROOT_DIR}} rev-parse HEAD
    cmds:
      - task: portal:image
      - '{{.PYTHON}} {{.ROOT_DIR}}/tools/docs/portal.py stage {{.ROOT_DIR}} {{.OUT}} {{.TASKFILE_DIR}}/architecture/c4 {{.REPO_URL}} {{.COMMIT}}'
      # The browser renderer and branding are bundled for offline use.
      - >-
        docker run --rm --network none -u {{.UID}}:{{.GID}} -v "{{.OUT}}":/work {{.PORTAL_IMAGE}} sh -c
        'cp /opt/portal/redoc.standalone.js /opt/portal/redoc-logo.svg /work/src/reference/ &&
        cp /opt/portal/redoc.standalone.js /opt/portal/redoc-logo.svg /work/ru/src/reference/'
      # PlantUML renders SVG during the build; the portal loads no external renderer.
      - >-
        docker run --rm --network none -u {{.UID}}:{{.GID}} -v "{{.OUT}}":/data
        {{.PLANTUML_IMAGE}} -charset UTF-8 -failfast2 -tsvg -nometadata /data/**/_diagrams/*.puml
      - >-
        docker run --rm --network none -u {{.UID}}:{{.GID}} -v "{{.ROOT_DIR}}":/repo -w /repo/build/portal {{.PORTAL_IMAGE}}
        mkdocs build
      - >-
        docker run --rm --network none -u {{.UID}}:{{.GID}} -v "{{.ROOT_DIR}}":/repo -w /repo/build/portal/ru {{.PORTAL_IMAGE}}
        mkdocs build
      - '{{.PYTHON}} {{.TOOLS}}/portal.py finalize {{.OUT}}/site'
      - 'echo "portal: build/portal/site/index.html ($(find {{.OUT}}/site -name "*.html" | wc -l) pages)"'

  portal:image:
    desc: Build the MkDocs image of the portal (tools/docs/portal)
    status:
      - docker image inspect {{.PORTAL_IMAGE}} >/dev/null 2>&1
    cmds:
      - docker build --quiet -t {{.PORTAL_IMAGE}} {{.ROOT_DIR}}/tools/docs/portal >/dev/null

  browser:
    desc: Check the extracted documentation archive in an offline browser
    cmds:
      - task: browser:image
      - >-
        docker run --rm --network none --ipc=host -u {{.UID}}:{{.GID}}
        -v "{{.ROOT_DIR}}":/repo {{.DOCS_BROWSER_IMAGE}} bash -c
        'python3 -c "import tarfile; tarfile.open(\"/repo/build/portal-validation.tar\").extractall(\"/tmp/psim-docs-archive\", filter=\"data\")" &&
        node /repo/tools/docs/browser/check.mjs /tmp/psim-docs-archive/portal /repo/build/portal-browser'

  browser:image:
    desc: Build the pinned browser image for documentation verification
    status:
      - docker image inspect {{.DOCS_BROWSER_IMAGE}} >/dev/null 2>&1
    cmds:
      - docker build --quiet -t {{.DOCS_BROWSER_IMAGE}} {{.ROOT_DIR}}/tools/docs/browser >/dev/null

  serve:
    desc: Serve the built portal on http://localhost:8000
    interactive: true
    cmds:
      - >-
        docker run --rm -it -u {{.UID}}:{{.GID}} -p 127.0.0.1:8000:8000 -v "{{.ROOT_DIR}}/build/portal/site":/site:ro
        -w /site {{.PORTAL_IMAGE}} python -m http.server 8000
