    assets: [A3]
    likelihood: 2
    impact: 3
    requirements: [SR-10, SR-26]
    residual: Изменение не предотвращается, но обнаруживается проверкой целостности.
  - id: T26
    boundary: TB4
    stride: I
    title: Хищение данных с носителей и резервных копий
    scenario: Копирование дисков узлов хранилищ или файлов резервных копий.
    assets: [A8, A3, A5]
    likelihood: 1
    impact: 3
    requirements: [SR-22, SR-09]
    residual: При отказе заказчика от шифрования дисков - открытые данные на носителях.
  - id: T27
    boundary: TB4
    stride: E
    title: Инъекция в запросы к PostgreSQL и ClickHouse
    scenario: Фильтры поиска или атрибуты событий меняют смысл запроса.
    assets: [A1, A3, A8]
    likelihood: 2
    impact: 3
    requirements: [SR-13, SR-12]
