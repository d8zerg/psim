  # --- TB6 Platform -> external systems -------------------------------------
  - id: T35
    boundary: TB6
    stride: E
    title: SSRF через адреса webhook и автоматических шагов
    scenario: Администратор или злоумышленник с его правами указывает адрес внутреннего сервиса или метаданных и получает доступ во внутреннюю сеть.
    assets: [A5, A1]
    likelihood: 2
    impact: 3
    requirements: [SR-20, SR-07]
    residual: Разрешённые адреса из списка могут быть скомпрометированы на стороне получателя.
  - id: T36
    boundary: TB6
    stride: I
    title: Утечка данных в уведомлениях
    scenario: Электронные письма и webhook содержат персональные данные и подробности инцидентов.
    assets: [A8]
    likelihood: 2
    impact: 2
    requirements: [SR-21, SR-20]
