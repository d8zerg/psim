    assets: [A7, A1]
    likelihood: 2
    impact: 3
    requirements: [SR-18, SR-27]
    residual: Ошибка сайзинга требует вмешательства эксплуатации до заполнения.
  - id: T29
    boundary: TB4
    stride: T
    title: Подмена схем в Schema Registry
    scenario: Регистрация несовместимой схемы ломает потребителей.
    assets: [A7]
    likelihood: 1
    impact: 3
    requirements: [SR-28]
    residual: Нет при закрытой записи.
  - id: T30
    boundary: TB4
    stride: I
    title: Открытые хранилища без аутентификации
    scenario: Redis, ClickHouse, Kafka или PostgreSQL доступны из сетей пользователей или объектов.
    assets: [A1, A3, A5, A8]
    likelihood: 2
    impact: 3
    requirements: [SR-19, SR-08]
    residual: Ошибка конфигурации межсетевого экрана у заказчика; проверяется установщиком.

