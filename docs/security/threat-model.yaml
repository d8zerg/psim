  - id: T16
    boundary: TB2
    stride: T
    title: Внедрение скрипта через данные коннекторов и пользователей
    scenario: Атрибуты событий, названия устройств, комментарии содержат HTML или скрипт, исполняемый в консоли.
    assets: [A6, A2]
    likelihood: 2
    impact: 3
    requirements: [SR-11, SR-14]
