  # --- TB3 Service <-> service ----------------------------------------------
  - id: T22
    boundary: TB3
    stride: S
    title: Подмена сервиса во внутренней сети
    scenario: Посторонний процесс вызывает API сервисов, минуя API Gateway.
    assets: [A1, A2, A4]
    likelihood: 2
    impact: 3
    requirements: [SR-04, SR-19]
    residual: Компрометация узла приложений даёт доступ к ключам сервисов этого узла.
  - id: T23
    boundary: TB3
    stride: T
    title: Запись в чужие топики
    scenario: Скомпрометированный сервис публикует поддельные сигналы, инциденты или команды.
    assets: [A1, A2]
    likelihood: 2
    impact: 3
    requirements: [SR-19]
    residual: Сервис может подделывать сообщения в своих топиках.
  - id: T24
    boundary: TB3
    stride: I
    title: Чтение чужих данных сервисом
    scenario: Скомпрометированный сервис читает топики и схемы БД, не нужные ему.
    assets: [A8, A1]
    likelihood: 2
    impact: 2
    requirements: [SR-19]
    residual: Сервисы с широким чтением (Projection Service, API Gateway) видят большую часть данных по назначению.

  # --- TB4 Service -> storages ----------------------------------------------
  - id: T25
    boundary: TB4
    stride: T
    title: Изменение журнала аудита администратором БД
