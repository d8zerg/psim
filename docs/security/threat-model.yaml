version: 1
assets:
- id: A1
  name: Event stream
  сигналы: null
  инциденты: null
- id: A2
  name: Device Commands
- id: A3
  name: Audit Log
- id: A4
  name: Reaction Configuration
- id: A5
  name: Keys and Secrets
- id: A6
  name: Accounts and sessions
- id: A7
  name: Platform availability
- id: A8
  name: Personal Data
- id: A9
  name: Files and metadata of hierarchical plans
boundaries:
- id: TB1
  name: Connector -> Connector Gateway
- id: TB2
  name: Browser -> API Gateway
- id: TB3
  name: Service <-> Service
- id: TB4
  name: Services -> Storage
- id: TB5
  name: Administration
- id: TB6
  name: Platform -> External Systems
- id: TB7
  name: Supply chain
requirements:
- id: SR-01
  area: AUTHN
  text: The connector authenticates only with an mTLS client certificate issued by the deployment operator's or organization's
    CA. Its fingerprint is bound to the connector registration in the catalog. Revocation immediately closes active sessions.
    Certificate lifetime is at most 1 year; rotation uses an overlap period (C1, C2).
  components:
  - libs/platform/security
  - services/connector-gateway
  - services/resource-catalog
  verify: test
- id: SR-02
  area: AUTHN
  text: Users sign in only through Keycloak (OIDC Authorization Code + PKCE). Enforce a password policy with at least 12 characters
    and lockout against guessing. MFA is mandatory for admin and supervisor roles. The session idle timeout is 30 minutes
    and maximum duration is 12 hours (configurable).
  components:
  - deploy/local
  - libs/platform/authz
  - web
  verify: config
- id: SR-03
  area: AUTHN
  text: Token validation uses a fixed issuer, checks audience, permits only RS256 and ES256, and checks exp and nbf with at
    most 30 seconds of clock tolerance. JWKS is fetched only from the configured address over TLS and cached with key rotation.
    Access token lifetime is 5 minutes; refresh tokens rotate.
  components:
  - libs/platform/security
  - services/api-gateway
  verify: test
- id: SR-04
  area: AUTHN
  text: Service calls require mTLS with an internal CA and a service token (client credentials) or delegated user token. Each
    service independently validates the token and permissions.
  components:
  - libs/platform/security
  verify: test
- id: SR-15
  area: AUTHN
  text: Store browser tokens only in memory, never in localStorage or sessionStorage, and never include them in URLs. Authenticate
    the realtime channel with its first frame. Allow CORS only for approved origins. Send tokens in the Authorization header
    to prevent CSRF.
  components:
  - services/api-gateway
  - web
  verify: test
- id: SR-05
  area: AUTHZ
  text: Deny by default. Apply RBAC + ABAC in API Gateway and again in the owning service. Filter lists, search, realtime
    streams, reports and exports by access scope. Every denial produces an audit record (ADR-020).
  components:
  - libs/platform/authz
  - services/api-gateway
  verify: test
- id: SR-06
  area: AUTHZ
  text: Commands require checks of device capabilities and the requester's access scope. Critical commands execute only after
    approval by a different shift supervisor (CM3). The connector protocol does not allow connectors to initiate commands.
    The gateway delivers a command only to the session of the connector serving that device.
  components:
  - services/command-service
  - services/connector-gateway
  verify: test
- id: SR-07
  area: AUTHZ
  text: Response configuration changes (activating rule sets, publishing mappings and scenarios, escalation policies and archiving
    rules) require the admin role and an audit record describing the change. Disabling or archiving rules for incident types
    with default priority P1 or P2 immediately notifies shift supervisors.
  components:
  - services/audit-service
  - services/correlation-engine
  - services/response-engine
  - web
  verify: test
- id: SR-29
  area: AUTHZ
  text: Administration tools (psimctl) authenticate as users through OIDC device flow and follow the same authorization model.
    No service account bypasses permissions. The emergency Keycloak account requires MFA; its use is audited and notifies
    administrators.
  components:
  - libs/platform/authz
  - tools/psimctl
  verify: review
- id: SR-08
  area: CRYPTO
  text: Require TLS 1.3 at external boundaries (TB1, TB2), and at least TLS 1.2 with AEAD suites inside the platform. Certificate
    verification is always enabled. No exposed port permits plaintext traffic. Enable HSTS for the web interface.
  components:
  - deploy
  - libs/platform/security
  verify: scan
- id: SR-09
  area: SECRETS
  text: Secrets must not appear in plaintext configuration or environment variables accessible to other processes. Use files
    owned by the service user with mode 0400, or a secret store. Exclude secrets from logs, traces and diagnostic bundles.
    Store CA private keys and audit checkpoint signing keys separately with restricted access. Document rotation procedures.
    An automated test starts services with known test secrets, then verifies that their values are absent from logs, traces
    and the diagnostic bundle.
  components:
  - deploy
  - libs/platform/runtime
  - libs/platform/security
  - tools/psimctl
  verify: test
- id: SR-10
  area: AUDIT
  text: Audit all user actions, access denials, configuration changes, connector session events (opening, rejection and revocation)
    and command lifecycle events. Maintain a hash chain and signed checkpoints outside the database. Database permissions
    prohibit UPDATE, DELETE and TRUNCATE (ADR-021).
  components:
  - services/api-gateway
  - services/audit-service
  - services/connector-gateway
  verify: test
- id: SR-11
  area: INPUT
  text: Validate all incoming messages with protovalidate at the boundary (Connector Gateway and API Gateway). Limit gRPC
    messages to 4 MB, event batches to 1 MB and 1000 events, and REST bodies to 1 MB (imports up to 100 MB, floor plans up
    to 20 MB). Reject unknown REST fields.
  components:
  - services/api-gateway
  - services/connector-gateway
  verify: test
- id: SR-12
  area: INPUT
  text: Fuzz all parsers of untrusted data, including connector protocol decoding, CSV and JSON imports, rule and mapping
    expressions, and realtime frames. CI requires 10 crash-free minutes for the rule parser and validator. Release qualification
    requires a complete 24-hour run of every target.
  components:
  - services/connector-gateway
  - services/correlation-engine
  - tools/security
  verify: test
- id: SR-13
  area: INPUT
  text: Access PostgreSQL and ClickHouse only through parameterized queries. Concatenating user input into query text is prohibited
    and checked by static analysis in CI.
  components:
  - libs/platform/clickhouse
  - libs/platform/pg
  - services/normalizer
  - tools/cpp
  verify: scan
- id: SR-14
  area: INPUT
  text: Render user and connector data as text in the web client, without inserting HTML. Use a strict CSP without inline
    scripts, X-Content-Type-Options, frame-ancestors 'none', and Referrer-Policy. Incident links allow only http and https
    with rel="noopener noreferrer".
  components:
  - services/api-gateway
  - web
  verify: test
- id: SR-30
  area: INPUT
  text: Prevent replay through event_id and source sequence deduplication, command deadlines and idempotent command_id, signed
    webhooks with a timestamp and a 5-minute acceptance window, and expiring realtime resume tokens bound to the user.
  components:
  - services/api-gateway
  - services/command-service
  - services/normalizer
  - services/notification-service
  verify: test
- id: SR-16
  area: DOS
  text: Protect ingestion with credits, per-connector event rate limits, batch and message limits, one active session per
    connector and a connection limit per gateway. On SDK buffer overflow, evict info events first and emit system.connector.buffer_overflow.
    Never evict alarm or fault events.
  components:
  - libs/platform/connector
  - services/connector-gateway
  verify: test
- id: SR-17
  area: DOS
  text: Protect the API and realtime channel with per-user and per-endpoint rate limits, a maximum page size of 1000, request
    deadlines, at most 5 WebSocket connections per user, disconnection of slow clients and export size limits.
  components:
  - services/api-gateway
  verify: test
- id: SR-18
  area: DOS
  text: Prevent resource exhaustion through bounded queues and backpressure, Kafka client quotas, disk utilization monitoring
    for Kafka, PostgreSQL and ClickHouse with alerts at 70% and 85%, and enforced retention.
  components:
  - deploy/observability
  - libs/platform/async
  - libs/platform/kafka
  verify: test
- id: SR-27
  area: DOS
  text: Protect alarm response availability with alerts on pipeline lag and event -> console latency SLO violations. The console
    indicates loss of connectivity. Per-connector limits prevent a source from displacing others. Runbooks describe degraded
    operation.
  components:
  - deploy/observability
  - libs/platform/connector
  - tools/bench
  verify: test
- id: SR-19
  area: NET
  text: Storage and internal ports are reachable only within the platform network. The installer provides a firewall rule
    template. Kafka, PostgreSQL, Redis-compatible storage and ClickHouse require authentication and TLS. Generate service-specific
    Kafka ACLs from the topic registry, allowing writes only to the service's own topics. Use separate PostgreSQL roles and
    ClickHouse users per service with minimum permissions.
  components:
  - deploy
  - libs/platform/clickhouse
  - libs/platform/kafka
  - libs/platform/pg
  - libs/platform/redis
  verify: config
- id: SR-20
  area: INTEGR
  text: Outbound calls (webhooks, automatic steps and SMTP) may target only addresses in the administrator's allowlist. Reject
    private, loopback, link-local and metadata addresses by default, checking after DNS resolution. Verify TLS, sign webhooks
    with HMAC-SHA256, and enforce timeouts and response size limits.
  components:
  - services/notification-service
  - services/response-engine
  verify: test
- id: SR-28
  area: INTEGR
  text: Only the installer and CI may write schemas to Schema Registry. Services have read-only access. Configure compatibility
    rules for every subject.
  components:
  - libs/platform/kafka
  - tools/deploy
  verify: config
- id: SR-21
  area: DATA
  text: Minimize personal data. By default, replace access-control card identifiers with a keyed HMAC during normalization.
    Exclude personal data from logs, apply RetentionSettings, use notification templates without personal data and audit data
    exports.
  components:
  - services/audit-service
  - services/normalizer
  - services/notification-service
  verify: test
- id: SR-22
  area: DATA
  text: Recommend full-disk encryption on storage nodes; the installer checks it and warns when absent. Encrypt PostgreSQL,
    ClickHouse and configuration backups.
  components:
  - deploy
  - tools/psimctl
  verify: config
- id: SR-23
  area: SUPPLY
  text: Pin dependencies in lockfiles (Conan, pnpm and buf.lock), and base and tooling images by digest. Produce a CycloneDX
    SBOM. CI checks licenses and vulnerabilities, blocking critical and high findings. Builds must be reproducible.
  components:
  - tools/release
  - tools/toolchain
  verify: scan
- id: SR-24
  area: SUPPLY
  text: Sign release artifacts (images and packages). The installer verifies signatures before installation and upgrades.
    Run containers without root, with a read-only filesystem where possible and without unnecessary capabilities.
  components:
  - tools/deploy
  - tools/release
  - tools/security
  verify: test
- id: SR-25
  area: OPS
  text: Harden the deployment with a minimal OS package set, dedicated service users and systemd restrictions (NoNewPrivileges,
    ProtectSystem and PrivateTmp). Do not use privileged containers. The Keycloak administration console must be inaccessible
    from user networks.
  components:
  - deploy
  - tools/security
  verify: pentest
- id: SR-26
  area: OPS
  text: Security monitoring alerts on spikes in failed logins, connector rejections and access denials, disabled rules, failed
    periodic audit integrity checks and certificates expiring within 30 days.
  components:
  - deploy/observability
  - services/audit-service
  verify: test
- id: SR-31
  area: INPUT
  text: Accept floor plans only as PNG/JPEG up to 20 MB, checking file signatures, decoding and pixel limits. The platform
    generates object names; the bucket is private. Reads and writes enforce RBAC and access scope. Independent backups include
    versions and SHA-256.
  components:
  - deploy
  - services/resource-catalog
  - tools/psimctl
  - web
  verify: test
- id: SR-32
  area: DATA
  text: Device state is separate from connectivity and actual/stale/unknown quality. Loss of connectivity requires fresh confirmation;
    old events and snapshots cannot improve freshness. Reconciliation considers source sequence and epoch. Filter snapshots
    and deltas by access scope.
  components:
  - libs/platform/connector
  - services/api-gateway
  - services/connector-gateway
  - services/normalizer
  - services/projection-service
  verify: test
- id: SR-33
  area: AUTHZ
  text: Maintenance is available to administrators within their scope and requires an end time, reason, owner and explicit
    policy. Fire events and P1 are never suppressed. History is retained; open incidents and SLAs remain unchanged. Automatic
    completion survives restarts and is audited.
  components:
  - services/correlation-engine
  - services/resource-catalog
  - web
  verify: test
- id: SR-34
  area: AUTHZ
  text: Incident handover requires recipient confirmation and checks of role, scope and version. The previous operator remains
    responsible until confirmation. Retries are idempotent; SLA and response scenario are preserved. Only a shift supervisor
    within the relevant scope may assign duty or force reassignment. Audit every action.
  components:
  - services/incident-service
  - services/notification-service
  - web
  verify: test
- id: SR-35
  area: AUTHZ
  text: Diagnostic replay is restricted to the requester's scope and isolated through separate ACLs, topics, consumer groups
    and storage. Its executor cannot write production signals, incidents, commands or notifications, or call HTTP, SMTP or
    devices. Audit every run. Projection recovery and production DLQ processing are separate authorized operations.
  components:
  - services/correlation-engine
  - services/response-engine
  - tools/psimctl
  verify: test
- id: SR-36
  area: AUTHZ
  text: The assistant receives only server-provided facts within the user's current scope, without bearer tokens or tools.
    An administrator configures the endpoint and model. Enforce response time and size limits and server-provided source links.
    Recheck permissions and source version after the response; failure preserves the original authorized facts.
  components:
  - services/api-gateway
  - services/incident-service
  verify: test
- id: SR-37
  area: AUTHZ
  text: Exercises have separate state, owner, version and expiry. Training actions cannot create production commands, incidents
    or notifications. Presence grants no business permissions; leases are bounded by time and generation identifier. Alarm
    suppression requires shift supervisor permission, a reason and an end time.
  components:
  - services/api-gateway
  - services/incident-service
  verify: test
- id: SR-38
  area: AUTHN
  text: The shell validates PKCE state, nonce and the configured issuer's ID token, stores tokens only in memory, coalesces
    concurrent refreshes and clears data on logout. Role-specific navigation does not replace server authorization. When scope
    changes, acquiring a new cursor clears the previous snapshot before reading a new one.
  components:
  - web
  verify: test
threats:
- id: T01
  boundary: TB1
  stride: S
  title: Connector impersonation with a stolen certificate
  scenario: An attacker with a connector certificate connects and sends events on behalf of that connector.
  assets:
  - A1
  likelihood: 2
  impact: 3
  requirements:
  - SR-01
  - SR-10
  - SR-26
  residual: Until revocation, the attacker can send events for the connector's sources; session audits and anomaly detection
    help identify this.
- id: T02
  boundary: TB1
  stride: T
  title: False events from a compromised connector
  scenario: A connector generates false alarms to distract operators or suppresses real events.
  assets:
  - A1
  - A7
  likelihood: 2
  impact: 3
  requirements:
  - SR-01
  - SR-16
  - SR-27
  - SR-30
  residual: Plausible false events cannot be distinguished at the protocol level; correlate multiple sources and monitor sequence
    gaps to reduce the risk.
- id: T03
  boundary: TB1
  stride: T
  title: Interception and modification of connector traffic
  scenario: An attacker in the site's network modifies events or commands in transit.
  assets:
  - A1
  - A2
  likelihood: 2
  impact: 3
  requirements:
  - SR-01
  - SR-08
  residual: None with correct TLS configuration.
- id: T04
  boundary: TB1
  stride: R
  title: Integrator repudiation of sent events and command results
  scenario: A dispute arises over whether a connector sent an event or a command result.
  assets:
  - A3
  likelihood: 1
  impact: 2
  requirements:
  - SR-10
  residual: Individual event signatures by connectors are not included in the MVP.
- id: T05
  boundary: TB1
  stride: I
  title: Eavesdropping on the event stream
  scenario: An attacker reads access-control events containing personal data on the site's network.
  assets:
  - A8
  likelihood: 2
  impact: 2
  requirements:
  - SR-08
  - SR-21
  residual: None with correct TLS configuration.
- id: T06
  boundary: TB1
  stride: D
  title: Connector event flood
  scenario: A faulty or malicious connector exceeds event limits and displaces other sources.
  assets:
  - A7
  likelihood: 3
  impact: 3
  requirements:
  - SR-16
  - SR-18
  - SR-27
  residual: Each connector's throughput remains bounded by its configured limit.
- id: T07
  boundary: TB1
  stride: D
  title: Malicious protocol messages
  scenario: Oversized or malformed messages crash the gateway.
  assets:
  - A7
  likelihood: 2
  impact: 3
  requirements:
  - SR-11
  - SR-12
  residual: Address parsing vulnerabilities in third-party libraries (gRPC, protobuf) by updating dependencies.
- id: T08
  boundary: TB1
  stride: E
  title: Connector control of another connector's devices
  scenario: A connector attempts to initiate commands or receive commands for another connector's devices.
  assets:
  - A2
  likelihood: 1
  impact: 3
  requirements:
  - SR-06
  residual: None; the protocol accepts no commands initiated by connectors, and delivery targets only the session serving
    the device.
- id: T09
  boundary: TB1
  stride: T
  title: Replay of old events
  scenario: Previously recorded events are resent to create false incidents.
  assets:
  - A1
  likelihood: 2
  impact: 2
  requirements:
  - SR-30
  residual: Replays with new identifiers and sequence numbers cannot be distinguished from new events (see T02).
- id: T10
  boundary: TB1
  stride: I
  title: Reading or modifying the SDK buffer on a connector node
  scenario: A local user on the connector node reads or modifies the buffer file.
  assets:
  - A1
  - A8
  likelihood: 1
  impact: 2
  requirements:
  - SR-09
  residual: The integrator is responsible for protecting the connector node; the SDK creates files accessible only to its
    own user.
- id: T11
  boundary: TB2
  stride: S
  title: Credential theft or guessing
  scenario: An operator, administrator or shift supervisor password is phished or guessed.
  assets:
  - A6
  - A2
  - A4
  likelihood: 3
  impact: 3
  requirements:
  - SR-02
  - SR-26
  residual: MFA is optional for the operator role and configured by the customer.
- id: T12
  boundary: TB2
  stride: S
  title: Access token theft
  scenario: A token is extracted through XSS, proxy logs or browser history.
  assets:
  - A6
  likelihood: 2
  impact: 3
  requirements:
  - SR-03
  - SR-14
  - SR-15
  residual: A stolen token is valid for no longer than 5 minutes.
- id: T13
  boundary: TB2
  stride: E
  title: Access to another site's incidents
  scenario: An operator supplies the identifier of an incident, device or zone outside their access scope.
  assets:
  - A1
  - A8
  likelihood: 3
  impact: 2
  requirements:
  - SR-05
  residual: None with a complete authorization test matrix.
- id: T14
  boundary: TB2
  stride: E
  title: Operator execution of administrator actions
  scenario: Administration methods are called with an operator role token.
  assets:
  - A4
  likelihood: 2
  impact: 3
  requirements:
  - SR-05
  - SR-10
  residual: None with a complete authorization test matrix.
- id: T15
  boundary: TB2
  stride: T
  title: Cross-site request forgery
  scenario: A third-party site sends a request on behalf of an authenticated user.
  assets:
  - A2
  - A4
  likelihood: 1
  impact: 3
  requirements:
  - SR-15
  residual: None; the browser does not send the token automatically.
- id: T16
  boundary: TB2
  stride: T
  title: Script injection through connector and user data
  scenario: Event attributes, device names or comments contain HTML or scripts that execute in the console.
  assets:
  - A6
  - A2
  likelihood: 2
  impact: 3
  requirements:
  - SR-11
  - SR-14
  residual: None when output rendering rules are followed.
- id: T17
  boundary: TB2
  stride: R
  title: Operator repudiation of performed actions
  scenario: An operator denies accepting an incident, skipping a step or sending a command.
  assets:
  - A3
  likelihood: 2
  impact: 3
  requirements:
  - SR-10
  - SR-02
  residual: Actions performed under another person's compromised account (see T11).
- id: T18
  boundary: TB2
  stride: D
  title: API and realtime channel overload
  scenario: Excessive requests, expensive queries or numerous WebSocket connections overload the service.
  assets:
  - A7
  likelihood: 2
  impact: 2
  requirements:
  - SR-17
  residual: Protection against a distributed attack from user networks is limited by the load balancer's capacity.
- id: T19
  boundary: TB2
  stride: I
  title: Excessive data disclosure
  scenario: API responses or errors disclose data outside the access scope or internal details.
  assets:
  - A8
  - A5
  likelihood: 2
  impact: 2
  requirements:
  - SR-05
  - SR-21
  residual: Return RFC 9457 errors without stack traces or internal addresses.
- id: T20
  boundary: TB2
  stride: E
  title: Abuse of critical commands by one employee
  scenario: An operator or shift supervisor unlocks many doors or disarms a site.
  assets:
  - A2
  likelihood: 2
  impact: 3
  requirements:
  - SR-06
  - SR-10
  - SR-26
  residual: Collusion between two employees remains possible and is detectable through audit.
- id: T21
  boundary: TB2
  stride: T
  title: Malicious links in incident attachments
  scenario: An incident receives a link to a phishing site or a URL using the javascript scheme.
  assets:
  - A6
  likelihood: 1
  impact: 2
  requirements:
  - SR-14
  residual: An external URL with an allowed scheme may still point to a malicious site.
- id: T22
  boundary: TB3
  stride: S
  title: Service impersonation on the internal network
  scenario: An unauthorized process calls service APIs while bypassing API Gateway.
  assets:
  - A1
  - A2
  - A4
  likelihood: 2
  impact: 3
  requirements:
  - SR-04
  - SR-19
  residual: Compromise of an application node exposes the keys of services running on that node.
- id: T23
  boundary: TB3
  stride: T
  title: Writing to another service's topics
  scenario: A compromised service publishes forged signals, incidents or commands.
  assets:
  - A1
  - A2
  likelihood: 2
  impact: 3
  requirements:
  - SR-19
  residual: A service can forge messages in its own topics.
- id: T24
  boundary: TB3
  stride: I
  title: Service access to unrelated data
  scenario: A compromised service reads topics and database schemas it does not need.
  assets:
  - A8
  - A1
  likelihood: 2
  impact: 2
  requirements:
  - SR-19
  residual: Services with broad read access (Projection Service, API Gateway) legitimately see most data.
- id: T25
  boundary: TB4
  stride: T
  title: Database administrator modification of the audit log
  scenario: An administrator with superuser privileges changes or deletes audit records.
  assets:
  - A3
  likelihood: 2
  impact: 3
  requirements:
  - SR-10
  - SR-26
  residual: Integrity verification detects changes but cannot prevent them.
- id: T26
  boundary: TB4
  stride: I
  title: Data theft from storage media and backups
  scenario: Storage node disks or backup files are copied.
  assets:
  - A8
  - A3
  - A5
  likelihood: 1
  impact: 3
  requirements:
  - SR-22
  - SR-09
  residual: If the customer declines disk encryption, data on the media remains in plaintext.
- id: T27
  boundary: TB4
  stride: E
  title: Injection into PostgreSQL and ClickHouse queries
  scenario: Search filters or event attributes alter query semantics.
  assets:
  - A1
  - A3
  - A8
  likelihood: 2
  impact: 3
  requirements:
  - SR-13
  - SR-12
  residual: None when parameterized query rules are followed.
- id: T28
  boundary: TB4
  stride: D
  title: Storage disk exhaustion
  scenario: Event traffic or growing history fills Kafka, PostgreSQL or ClickHouse disks and stops the pipeline.
  assets:
  - A7
  - A1
  likelihood: 2
  impact: 3
  requirements:
  - SR-18
  - SR-27
  residual: Incorrect sizing requires operations staff to intervene before disks fill.
- id: T29
  boundary: TB4
  stride: T
  title: Schema tampering in Schema Registry
  scenario: Registering an incompatible schema breaks consumers.
  assets:
  - A7
  likelihood: 1
  impact: 3
  requirements:
  - SR-28
  residual: None when write access is restricted.
- id: T30
  boundary: TB4
  stride: I
  title: Exposed storage without authentication
  scenario: Redis, ClickHouse, Kafka or PostgreSQL are reachable from user or site networks.
  assets:
  - A1
  - A3
  - A5
  - A8
  likelihood: 2
  impact: 3
  requirements:
  - SR-19
  - SR-08
  residual: Customer firewall misconfiguration; checked by the installer.
- id: T31
  boundary: TB5
  stride: T
