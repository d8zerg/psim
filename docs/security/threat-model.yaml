# Threat model registry - source of truth (step 0.6). Method and context: threat-model.md.
# Rendered to threat-register.md by `task docs:threats:gen`; checked by `task docs:threats`.
# risk = likelihood x impact (1..3 each): high >= 6, medium 3..4, low <= 2.
# stride: S spoofing, T tampering, R repudiation, I information disclosure, D denial of service,
#         E elevation of privilege.
# verify: test (automated test), config (configuration review with automated check where possible),
#         scan (scanner in CI or step 10.3), pentest (step 10.3), review (design or code review).

version: 1

assets:
  - {id: A1, name: Поток событий, сигналы, инциденты}
  - {id: A2, name: Команды устройствам}
  - {id: A3, name: Журнал аудита}
  - {id: A4, name: Конфигурация реакции}
  - {id: A5, name: Ключи и секреты}
  - {id: A6, name: Учётные записи и сессии}
  - {id: A7, name: Доступность платформы}
  - {id: A8, name: Персональные данные}

boundaries:
  - {id: TB1, name: Коннектор -> Connector Gateway}
  - {id: TB2, name: Браузер -> API Gateway}
  - {id: TB3, name: Сервис <-> сервис}
  - {id: TB4, name: Сервис -> хранилища}
  - {id: TB5, name: Администрирование}
  - {id: TB6, name: Платформа -> внешние системы}
  - {id: TB7, name: Цепочка поставки}

requirements:
  # --- AUTHN ----------------------------------------------------------------
  - id: SR-01
    area: AUTHN
    text: >-
      Коннектор аутентифицируется только клиентским сертификатом mTLS, выпущенным УЦ платформы или
      заказчика; отпечаток сертификата привязан к регистрации коннектора в каталоге; отзыв закрывает
      открытые сессии немедленно; срок сертификата не более 1 года; ротация с перекрытием (C1, C2).
    steps: ['2.6', '4.2', '4.4']
    verify: test
  - id: SR-02
    area: AUTHN
    text: >-
      Пользователи входят только через Keycloak (OIDC Authorization Code + PKCE). Политика паролей
      (не короче 12 символов), блокировка при подборе, многофакторная аутентификация обязательна для
      ролей admin и supervisor; тайм-аут бездействия сессии 30 мин, максимальная длительность 12 ч
      (настраивается).
    steps: ['1.4', '7.4', '8.2']
    verify: config
  - id: SR-03
    area: AUTHN
    text: >-
      Проверка токенов: фиксированный issuer, проверка audience, разрешённые алгоритмы только RS256 и
      ES256, проверка exp и nbf с допуском не более 30 с; JWKS загружается только с настроенного
      адреса по TLS и кэшируется с ротацией ключей; срок токена доступа 5 мин, ротация refresh-токена.
    steps: ['2.6', '7.1']
    verify: test
  - id: SR-04
    area: AUTHN
    text: >-
      Межсервисные вызовы: mTLS на внутреннем УЦ и токен сервиса (client credentials) или
      делегированный токен пользователя; каждый сервис сам проверяет токен и права.
    steps: ['2.6']
    verify: test
  - id: SR-15
    area: AUTHN
    text: >-
      Токены в браузере хранятся только в памяти (не в localStorage и sessionStorage) и никогда не
      передаются в URL; realtime-канал аутентифицируется первым кадром; CORS только для разрешённых
      источников; токен передаётся в заголовке Authorization, что исключает CSRF.
    steps: ['7.2', '8.2']
    verify: test

  # --- AUTHZ ----------------------------------------------------------------
  - id: SR-05
    area: AUTHZ
    text: >-
      Запрет по умолчанию: решение RBAC + ABAC в API Gateway и повторно в сервисе-владельце;
      фильтрация по области доступа в списках, поиске, realtime-потоке, отчётах и экспорте; каждый
      отказ - запись аудита (ADR-020).
    steps: ['7.1', '7.2', '7.4']
    verify: test
  - id: SR-06
    area: AUTHZ
    text: >-
      Команды: проверка возможности устройства и области доступа инициатора; критичные команды
      исполняются только после подтверждения старшим смены, отличным от инициатора (CM3); протокол
      коннекторов не позволяет коннектору инициировать команды; шлюз доставляет команду только в
      сессию коннектора, обслуживающего устройство.
    steps: ['4.2', '6.2']
    verify: test
  - id: SR-07
    area: AUTHZ
    text: >-
      Изменения конфигурации реакции (активация набора правил, публикация отображений и сценариев,
      политики эскалации, архивирование правил) доступны только роли admin, фиксируются в аудите с
      описанием изменения; отключение или архивирование правил для типов инцидентов с приоритетом
      по умолчанию P1 или P2 немедленно оповещает старших смены.
    steps: ['5.1', '6.1', '6.4', '8.4']
    verify: test
  - id: SR-29
    area: AUTHZ
    text: >-
      Инструменты администрирования (psimctl) аутентифицируются как пользователи (OIDC device flow) и
      подчиняются той же модели прав; служебных учётных записей в обход прав нет; аварийная учётная
      запись Keycloak защищена MFA, её использование в аудите и оповещает администраторов.
    steps: ['7.4', '9.5']
    verify: review

  # --- CRYPTO, SECRETS ------------------------------------------------------
  - id: SR-08
    area: CRYPTO
    text: >-
      TLS 1.3 на внешних границах (TB1, TB2); внутри платформы - не ниже TLS 1.2 только с AEAD-
      наборами; проверка сертификатов всегда включена; открытых портов без TLS нет; HSTS для веб.
    steps: ['2.6', '9.1']
    verify: scan
  - id: SR-09
    area: SECRETS
    text: >-
      Секреты не хранятся открыто в конфигурации и переменных окружения, доступных другим процессам:
      только файлы с правами 0400 пользователя сервиса или хранилище секретов; секреты не попадают в
      логи, трассировки и диагностические пакеты; закрытые ключи УЦ и подписи контрольных точек
      аудита хранятся отдельно с ограниченным доступом; процедуры ротации документированы.
      Автоматический тест: сервисы запускаются с известными тестовыми секретами, затем логи,
      трассировки и диагностический пакет проверяются на отсутствие их значений.
    steps: ['2.1', '2.6', '9.1', '9.5']
    verify: test

  # --- AUDIT ----------------------------------------------------------------
  - id: SR-10
    area: AUDIT
    text: >-
      Аудит всех действий пользователей, отказов в доступе, изменений конфигурации, событий сессий
      коннекторов (открытие, отказ, отзыв), жизненного цикла команд; цепочка хэшей и подписанные
      контрольные точки вне БД; права БД запрещают UPDATE, DELETE, TRUNCATE (ADR-021).
    steps: ['6.4', '7.1', '4.2']
    verify: test

  # --- INPUT ----------------------------------------------------------------
  - id: SR-11
    area: INPUT
    text: >-
      Все входящие сообщения проверяются правилами protovalidate на границе (шлюз коннекторов, API
      Gateway); ограничения размера: сообщение gRPC до 4 МБ, пакет событий до 1 МБ и 1000 событий,
      тело REST до 1 МБ (импорт до 100 МБ, план этажа до 20 МБ); неизвестные поля в REST отклоняются.
    steps: ['4.2', '7.1']
    verify: test
  - id: SR-12
    area: INPUT
    text: >-
      Фаззинг всех разборщиков недоверенных данных: декодирование протокола коннекторов, импорт CSV и
      JSON, выражения правил и отображений, кадры realtime; 24 ч без падений.
    steps: ['4.2', '5.1', '10.3']
    verify: test
  - id: SR-13
    area: INPUT
    text: >-
      Доступ к PostgreSQL и ClickHouse только параметризованными запросами; конкатенация
      пользовательского ввода в текст запроса запрещена и проверяется статическим анализом в CI.
    steps: ['1.2', '2.4', '4.5']
    verify: scan
  - id: SR-14
    area: INPUT
    text: >-
      Безопасный вывод в веб-клиенте: данные пользователей и коннекторов отображаются только как текст,
      без вставки HTML; строгий CSP без inline-скриптов; заголовки X-Content-Type-Options,
      frame-ancestors 'none', Referrer-Policy; ссылки из инцидентов - только http и https с
      rel="noopener noreferrer".
    steps: ['7.1', '8.1', '8.6']
    verify: test
  - id: SR-30
    area: INPUT
    text: >-
      Защита от повторов: дедупликация по event_id и порядковым номерам источников; дедлайн и
      идемпотентный command_id у команд; подпись webhook с меткой времени и окном приёма 5 мин;
      токены возобновления realtime привязаны к пользователю и имеют срок действия.
    steps: ['4.5', '6.2', '6.3', '7.2']
    verify: test

  # --- DOS, AVAILABILITY ----------------------------------------------------
  - id: SR-16
    area: DOS
    text: >-
      Защита ввода: кредиты, лимит событий в секунду на коннектор, ограничения пакета и сообщения,
      одна активная сессия на коннектор, лимит соединений на шлюз; при переполнении буфера SDK первыми
      вытесняются события info и порождается system.connector.buffer_overflow; события классов alarm и
      fault не вытесняются.
    steps: ['4.1', '4.2']
    verify: test
  - id: SR-17
    area: DOS
    text: >-
      Защита API и realtime: лимиты частоты на пользователя и эндпоинт, размер страницы не больше 1000,
      дедлайны запросов, не больше 5 WebSocket-соединений на пользователя, отключение медленных
      клиентов, ограничение размера экспорта.
    steps: ['7.1', '7.2']
    verify: test
  - id: SR-18
    area: DOS
    text: >-
      Защита от исчерпания ресурсов: ограниченные очереди и противодавление вместо неограниченного
      роста; квоты клиентов Kafka; контроль заполнения дисков Kafka, PostgreSQL, ClickHouse с
      алертами на 70% и 85%; принудительный retention.
    steps: ['2.2', '2.3', '9.4']
    verify: test
  - id: SR-27
    area: DOS
    text: >-
      Доступность реакции на тревоги: алерты на лаг конвейера и нарушение SLO задержки событие ->
      консоль; консоль показывает потерю связи; лимиты на коннектор не дают одному источнику вытеснить
      остальные; поведение при деградации описано в runbook.
    steps: ['4.1', '9.4', '10.1']
    verify: test

  # --- NET, INTEGRATION -----------------------------------------------------
  - id: SR-19
    area: NET
    text: >-
      Хранилища и внутренние порты доступны только во внутренней сети платформы; установщик выдаёт
      шаблон правил межсетевого экрана; Kafka, PostgreSQL, Redis-совместимое хранилище и ClickHouse
      требуют аутентификации и TLS; ACL Kafka по сервисам генерируются из реестра топиков (запись -
      только в свои топики); роли PostgreSQL и пользователи ClickHouse - по сервисам с минимальными
      правами.
    steps: ['2.3', '2.4', '2.5', '9.1']
    verify: config
  - id: SR-20
    area: INTEGR
    text: >-
      Исходящие вызовы (webhook, автоматические шаги, SMTP) - только на адреса из списка, заданного
      администратором; частные, loopback, link-local диапазоны и адреса метаданных запрещены по
      умолчанию, проверка после разрешения DNS; проверка TLS; подпись webhook HMAC-SHA256; тайм-ауты и
      ограничение размера ответа.
    steps: ['6.1', '6.3']
    verify: test
  - id: SR-28
    area: INTEGR
    text: >-
      Запись схем в Schema Registry - только установщик и CI; сервисы имеют права только на чтение;
      правила совместимости заданы на всех subject.
    steps: ['2.3', '9.2']
    verify: config

  # --- DATA -----------------------------------------------------------------
  - id: SR-21
    area: DATA
    text: >-
      Минимизация персональных данных: идентификаторы карт СКУД по умолчанию заменяются ключевым
      HMAC при нормализации; персональные данные не пишутся в логи; сроки хранения по
      RetentionSettings; шаблоны уведомлений без персональных данных; экспорт данных - в аудите.
    steps: ['4.5', '6.3', '6.4']
    verify: test
  - id: SR-22
    area: DATA
    text: >-
      Шифрование хранимых данных: полнодисковое шифрование узлов хранилищ рекомендуется и проверяется
      установщиком с предупреждением; резервные копии PostgreSQL, ClickHouse и конфигурации
      шифруются.
    steps: ['9.1', '9.3']
    verify: config

  # --- SUPPLY ---------------------------------------------------------------
  - id: SR-23
    area: SUPPLY
    text: >-
      Зависимости зафиксированы lock-файлами (Conan, pnpm, buf.lock); базовые образы и образы
      инструментов закреплены по дайджесту; SBOM CycloneDX; проверка лицензий и уязвимостей в CI
      блокирует критичные и высокие; воспроизводимые сборки.
    steps: ['1.1', '1.3']
    verify: scan
  - id: SR-24
    area: SUPPLY
    text: >-
      Артефакты выпуска (образы, пакеты) подписываются; установщик проверяет подписи перед установкой
      и обновлением; контейнеры работают без root, с файловой системой только для чтения где возможно
      и без лишних capabilities.
    steps: ['1.3', '9.2', '10.3']
    verify: test

  # --- OPS ------------------------------------------------------------------
  - id: SR-25
    area: OPS
    text: >-
      Усиление защиты: минимальный набор пакетов ОС; сервисы под выделенными пользователями с
      ограничениями systemd (NoNewPrivileges, ProtectSystem, PrivateTmp); контейнеры без privileged;
      административная консоль Keycloak недоступна из сетей пользователей.
    steps: ['9.1', '10.3']
    verify: pentest
  - id: SR-26
    area: OPS
    text: >-
      Мониторинг безопасности: алерты на всплески неудачных входов, отказов коннекторам и отказов в
      доступе, отключение правил, ошибки периодической проверки целостности аудита, истечение
      сертификатов (за 30 дней).
    steps: ['6.4', '9.4']
    verify: test

threats:
  # --- TB1 Connector -> Connector Gateway -----------------------------------
  - id: T01
    boundary: TB1
    stride: S
    title: Подмена коннектора украденным сертификатом
    scenario: Злоумышленник с сертификатом коннектора подключается и отправляет события от его имени.
    assets: [A1]
    likelihood: 2
    impact: 3
    requirements: [SR-01, SR-10, SR-26]
    residual: До отзыва сертификата атакующий может слать события источников этого коннектора; обнаруживается по аудиту сессий и аномалиям.
  - id: T02
    boundary: TB1
    stride: T
    title: Ложные события скомпрометированного коннектора
    scenario: Коннектор генерирует ложные тревоги для отвлечения или подавляет реальные события.
    assets: [A1, A7]
    likelihood: 2
    impact: 3
    requirements: [SR-01, SR-16, SR-27, SR-30]
    residual: Правдоподобные ложные события не отличимы на уровне протокола; снижается корреляцией нескольких источников и контролем разрывов номеров.
  - id: T03
    boundary: TB1
    stride: T
    title: Перехват и изменение трафика коннектора
    scenario: Атакующий в сети объекта изменяет события или команды в канале.
    assets: [A1, A2]
    likelihood: 2
    impact: 3
    requirements: [SR-01, SR-08]
    residual: Нет при корректной настройке TLS.
  - id: T04
    boundary: TB1
    stride: R
    title: Отказ интегратора от отправленных событий и результатов команд
    scenario: Спор о том, присылал ли коннектор событие или результат команды.
    assets: [A3]
    likelihood: 1
    impact: 2
    requirements: [SR-10]
    residual: Подписи отдельных событий коннектором не вводятся в MVP.
  - id: T05
    boundary: TB1
    stride: I
    title: Прослушивание потока событий
    scenario: Чтение событий СКУД с персональными данными в сети объекта.
    assets: [A8]
    likelihood: 2
    impact: 2
    requirements: [SR-08, SR-21]
    residual: Нет при корректной настройке TLS.
  - id: T06
    boundary: TB1
    stride: D
    title: Поток событий от коннектора
    scenario: Неисправный или злонамеренный коннектор отправляет события сверх лимитов и вытесняет другие источники.
    assets: [A7]
    likelihood: 3
    impact: 3
    requirements: [SR-16, SR-18, SR-27]
    residual: Пропускная способность одного коннектора ограничена его лимитом.
  - id: T07
    boundary: TB1
    stride: D
    title: Вредоносные сообщения протокола
    scenario: Сообщения огромного размера или с некорректной структурой роняют шлюз.
    assets: [A7]
    likelihood: 2
    impact: 3
    requirements: [SR-11, SR-12]
    residual: Ошибки разбора в сторонних библиотеках (gRPC, protobuf) - через обновление зависимостей.
  - id: T08
    boundary: TB1
    stride: E
    title: Коннектор управляет чужими устройствами
    scenario: Коннектор пытается инициировать команды или получить команды для устройств другого коннектора.
    assets: [A2]
    likelihood: 1
    impact: 3
    requirements: [SR-06]
    residual: Нет, протокол не содержит команд от коннектора, а доставка идёт только в сессию обслуживающего коннектора.
  - id: T09
    boundary: TB1
    stride: T
    title: Повтор старых событий
    scenario: Повторная отправка записанных ранее событий для создания ложных инцидентов.
    assets: [A1]
    likelihood: 2
    impact: 2
    requirements: [SR-30]
    residual: Повтор с новыми идентификаторами и номерами не отличим от новых событий (см. T02).
  - id: T10
    boundary: TB1
    stride: I
    title: Чтение или изменение буфера SDK на узле коннектора
    scenario: Локальный пользователь узла коннектора читает или меняет файл буфера.
    assets: [A1, A8]
    likelihood: 1
    impact: 2
    requirements: [SR-09]
    residual: Защита узла коннектора - ответственность интегратора; SDK создаёт файлы с правами только для своего пользователя.

  # --- TB2 Browser -> API Gateway -------------------------------------------
  - id: T11
    boundary: TB2
    stride: S
    title: Кража или подбор учётных данных
    scenario: Фишинг или подбор пароля оператора, администратора или старшего смены.
    assets: [A6, A2, A4]
    likelihood: 3
    impact: 3
    requirements: [SR-02, SR-26]
    residual: Для роли operator MFA не обязательна (настраивается заказчиком).
  - id: T12
    boundary: TB2
    stride: S
    title: Кража токена доступа
    scenario: Токен извлекается через XSS, журналы прокси или историю браузера.
    assets: [A6]
    likelihood: 2
    impact: 3
    requirements: [SR-03, SR-14, SR-15]
    residual: Украденный токен действует не дольше 5 мин.
  - id: T13
    boundary: TB2
    stride: E
    title: Доступ к инцидентам чужой площадки
    scenario: Оператор подставляет идентификатор инцидента, устройства или зоны вне своей области доступа.
    assets: [A1, A8]
    likelihood: 3
    impact: 2
    requirements: [SR-05]
    residual: Нет при полной матрице тестов прав.
  - id: T14
    boundary: TB2
    stride: E
