    assets: [A4]
    likelihood: 2
    impact: 3
    requirements: [SR-05, SR-10]
    residual: Нет при полной матрице тестов прав.
  - id: T15
    boundary: TB2
    stride: T
    title: Подделка межсайтовых запросов
    scenario: Сторонний сайт отправляет запрос от имени вошедшего пользователя.
    assets: [A2, A4]
    likelihood: 1
    impact: 3
